<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missaoui">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/site.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151233">
<title>Khyout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Khyout (خيوط, « les fils ») : on relie les pelotes de laine de la même couleur, sans croiser les fils, et on remplit la grille.
   D'après le cahier des charges du papa (17/11, « Color Flow Puzzle »), adapté au site et aux enfants : JavaScript sans
   compilation, 230 niveaux tous vérifiés par un solveur (30 « petits » pour Amine + 200 de 5×5 à 10×10), chrono, défi du jour,
   indices, mode symboles (daltonien). Nom, couleurs, dessins et sons à nous.
   Code : khyout/regles.js (règles, tracé, solveur, générateur ; testés en Node : docs/khyout/), khyout/niveaux.js (fabriqué
   par docs/khyout/genere.mjs), khyout/jeu.js (écrans, dessin, sons, sauvegarde). */
:root{ --nuit:#151233; --nuit2:#211c4d; --or:#ffc94a; --texte:#f4f1ff; --doux:#b9b2e6; --ombre:0 4px 0 rgba(0,0,0,.28); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ margin:0; height:100%; overflow:hidden; background:var(--nuit); font-family:Nunito, system-ui, sans-serif; color:var(--texte); user-select:none; -webkit-user-select:none; }
body{ background:radial-gradient(1200px 700px at 50% -10%, #3a2f86 0%, transparent 60%), radial-gradient(900px 600px at 100% 110%, #4a1f5c 0%, transparent 55%), var(--nuit); }
button{ font:inherit; cursor:pointer; border:0; color:inherit; }
.ecran{ position:fixed; inset:0; display:none; overflow:auto; }
.ecran.on{ display:block; }
.boite{ max-width:820px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px 40px; }
.haut{ display:flex; align-items:center; gap:10px; }
.pill{ background:#ffffff14; border:2px solid #ffffff22; color:var(--texte); border-radius:999px; padding:8px 16px; font-weight:800; min-height:48px; display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
.pill img{ width:34px; height:34px; border-radius:50%; object-fit:cover; background:#ffffff22; }
h1{ font-family:'Baloo 2', sans-serif; text-align:center; font-size:clamp(46px, 11vw, 76px); line-height:1; margin:18px 0 0; letter-spacing:2px;
  background:linear-gradient(90deg, #ff5a5a, #ffb02e, #ffe44d, #4ade80, #38bdf8, #a78bfa, #f472b6); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
.ar{ text-align:center; font-size:28px; color:var(--or); margin:2px 0 0; font-weight:800; }
.sous{ text-align:center; color:var(--doux); font-size:18px; margin:6px 0 16px; }
.carte{ background:#ffffff0d; border:1px solid #ffffff1c; border-radius:22px; padding:16px; margin-top:14px; }
.carte h2{ margin:0 0 10px; font-family:'Baloo 2', sans-serif; font-size:22px; }
.modes{ display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
.mode{ background:#ffffff10; border:2px solid #ffffff22; border-radius:18px; padding:12px 10px; text-align:left; min-height:96px; }
.mode b{ display:block; font-size:18px; } .mode span{ display:block; color:var(--doux); font-size:13.5px; margin-top:4px; line-height:1.25; }
.mode.on{ border-color:var(--or); background:#ffc94a1f; }
@media (max-width:640px){ .modes{ grid-template-columns:1fr 1fr; } }
.tranche{ margin-top:14px; } .tranche h3{ margin:0 0 8px; font-size:16px; color:var(--doux); display:flex; justify-content:space-between; }
.niveaux{ display:grid; grid-template-columns:repeat(auto-fill, minmax(54px, 1fr)); gap:8px; }
.niv{ min-height:54px; border-radius:14px; background:#ffffff14; border:2px solid #ffffff20; font-weight:800; font-size:17px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
.niv small{ font-size:10px; color:var(--or); margin-top:3px; letter-spacing:-1px; min-height:10px; }
.niv.fait{ background:#4ade8022; border-color:#4ade8066; }
.niv.suivant{ border-color:var(--or); background:#ffc94a2a; box-shadow:0 0 0 3px #ffc94a33; }
.niv:disabled{ opacity:.35; cursor:default; }
.choix{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
.choix button{ background:#ffffff14; border:2px solid #ffffff22; border-radius:14px; padding:10px 14px; font-weight:800; min-height:48px; }
.choix button.on{ border-color:var(--or); background:#ffc94a26; }
.gros{ background:linear-gradient(180deg, #ffd66b, #f5a524); color:#3a2300; border-radius:16px; padding:12px 22px; font-weight:800; font-size:19px; min-height:54px; box-shadow:0 4px 0 #b3700c; }
.jours{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; } .jours i{ width:30px; height:30px; border-radius:9px; background:#ffffff12; display:grid; place-items:center; font-style:normal; font-size:12px; color:var(--doux); }
.jours i.ok{ background:#4ade8040; color:#fff; } .jours i.auj{ outline:2px solid var(--or); }
.regles{ margin:0; padding-left:20px; line-height:1.5; color:#e6e1ff; } .regles li{ margin:4px 0; }
.rec{ margin:0; padding-left:22px; } .rec li{ margin:4px 0; font-weight:800; } .rec .none{ color:var(--doux); }

/* l'écran de jeu */
#jeu{ overflow:hidden; }
#cv{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.barre{ position:absolute; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 10px; z-index:2; pointer-events:none; flex-wrap:wrap; }
.barre > *{ pointer-events:auto; }
#hautJeu{ top:0; padding-top:calc(8px + env(safe-area-inset-top)); }
#basJeu{ bottom:0; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
.titreJeu{ font-family:'Baloo 2', sans-serif; font-size:22px; font-weight:800; text-align:center; width:100%; margin:0; line-height:1.1; }
.stats{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; width:100%; }
.stat{ background:#ffffff14; border-radius:999px; padding:5px 12px; font-weight:800; font-size:15px; }
.stat.chrono{ background:#ffc94a2e; color:var(--or); }
.btn{ background:#ffffff16; border:2px solid #ffffff26; border-radius:16px; min-height:52px; min-width:52px; padding:0 14px; font-weight:800; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn:active{ transform:translateY(1px); }
#toast{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); background:#000a; border-radius:999px; padding:10px 18px; font-weight:800; z-index:3; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; max-width:calc(100vw - 24px); }
#toast.on{ opacity:1; }
#modal{ position:fixed; inset:0; z-index:10; display:none; place-items:center; background:#0008; padding:16px; }
#modal.on{ display:grid; }
.fenetre{ background:#231d52; border:2px solid #ffffff2a; border-radius:24px; padding:20px; width:min(440px, 100%); text-align:center; box-shadow:0 20px 50px #0008; max-height:calc(100vh - 32px); overflow:auto; }
.fenetre h2{ font-family:'Baloo 2', sans-serif; margin:0 0 6px; font-size:30px; }
.fenetre p{ color:var(--doux); margin:6px 0 14px; }
.fenetre .etoiles{ font-size:44px; letter-spacing:6px; margin:4px 0; }
.fenetre .rang{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
.reg{ display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; padding:10px 0; border-top:1px solid #ffffff18; }
.reg span small{ display:block; color:var(--doux); font-size:13px; }
.reg .choix{ margin:0; }
</style>
</head>
<body>

<section class="ecran on" id="menu"><div class="boite">
  <div class="haut"><a class="pill" href="../" aria-label="Retour à l'accueil">←</a><button class="pill" id="who">Qui joue ?</button>
    <button class="pill" id="regBtn" aria-label="Paramètres" style="margin-left:auto">⚙️</button><span class="pill" id="total">⭐ 0</span></div>
  <h1>Khyout</h1>
  <div class="ar">خيوط</div>
  <p class="sous">Relie les pelotes de la même couleur… et remplis toute la grille !</p>
  <div class="carte">
    <div class="modes">
      <button class="mode" data-m="classique"><b>🧶 Les niveaux</b><span>De niveau en niveau, sans chrono.</span></button>
      <button class="mode" data-m="chrono"><b>⏱️ Chrono</b><span>Le plus de grilles possible avant la fin.</span></button>
      <button class="mode" data-m="jour"><b>📅 Défi du jour</b><span>Une grille par jour, un peu plus dure chaque jour de la semaine.</span></button>
      <button class="mode" data-m="aide"><b>❓ Comment jouer</b><span>Les règles, en 4 lignes.</span></button>
    </div>
    <div id="panneau"></div>
  </div>
  <div class="carte"><h2>🏆 Records de la famille</h2><ol class="rec" id="records"><p class="none">…</p></ol></div>
</div></section>

<section class="ecran" id="jeu">
  <canvas id="cv"></canvas>
  <div class="barre" id="hautJeu">
    <p class="titreJeu" id="titreJeu">Niveau 1</p>
    <div class="stats"><span class="stat" id="sPaires">🧶 0/0</span><span class="stat" id="sCases">▦ 0 %</span><span class="stat" id="sCoups">✋ 0</span><span class="stat chrono" id="sChrono" hidden>⏱️ 1:00</span></div>
  </div>
  <div class="barre" id="basJeu">
    <button class="btn" id="bPause">⏸ Pause</button>
    <button class="btn" id="bAnnule">↶ Annuler</button>
    <button class="btn" id="bRecommence">⟲ Recommencer</button>
    <button class="btn" id="bIndice">💡 Indice</button>
  </div>
  <div id="toast"></div>
</section>

<div id="modal"></div>

<script src="../famille.js"></script>
<script type="module" src="khyout/jeu.js?v=1"></script>
</body>
</html>
