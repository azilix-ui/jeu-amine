<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missaoui">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/site.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f3b5c">
<title>Kelma</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&family=Amiri:wght@700&display=swap">
<style>
/* Kelma (كلمة, « le mot ») · la tour des mots (18/11) : on trace des mots dans une tour de carreaux de céramique de Nabeul,
   en français, en anglais ou en arabe. D'après le cahier des charges du papa (« jeu de lettres multilingue », principe de la
   grille de mots qui tombe), refait à notre façon : nom, images, sons et niveaux à nous. JavaScript sans compilation.
   Code : kelma/regles.js (règles, lexiques, chercheur de mots, modes, campagne ; testés en Node : docs/kelma/),
   kelma/jeu.js (écrans, doigt, sons, voix, sauvegarde), kelma/lex/ (lexiques : docs/kelma/lexiques.mjs), kelma/img/ (ComfyUI). */
:root{ --nuit:#0f2a44; --bleu:#1f6fd1; --or:#ffc94a; --texte:#fffaf0; --doux:#d9e6f5; --tuile:84px; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html, body{ margin:0; height:100%; overflow:hidden; background:var(--nuit); font-family:Nunito, system-ui, sans-serif; color:var(--texte); user-select:none; -webkit-user-select:none; }
body{ background:#0f2a44 center/cover no-repeat; transition:background-image .4s; }
body::before{ content:''; position:fixed; inset:0; background:linear-gradient(180deg, rgba(10,28,48,.35), rgba(10,28,48,.72)); pointer-events:none; }
button{ font:inherit; cursor:pointer; border:0; color:inherit; }
.ecran{ position:fixed; inset:0; display:none; overflow:auto; z-index:1; }
.ecran.on{ display:block; }
.boite{ max-width:880px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px 40px; }
.haut{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.esp{ flex:1; }
.pill{ background:#00000040; border:2px solid #ffffff2e; border-radius:999px; padding:6px 14px; font-weight:800; min-height:48px; display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--texte); backdrop-filter:blur(4px); }
.pill img{ width:34px; height:34px; border-radius:50%; object-fit:cover; background:#ffffff22; }
h1{ font-family:'Baloo 2', sans-serif; text-align:center; font-size:clamp(48px, 12vw, 84px); line-height:.95; margin:14px 0 0; color:var(--or); text-shadow:0 4px 0 #8a5a00, 0 10px 24px #0008; }
h1 small{ display:block; font-family:Amiri, serif; font-size:.5em; color:#fff; text-shadow:0 3px 10px #000a; }
.sous{ text-align:center; color:var(--doux); font-weight:800; margin:6px 0 14px; }
.langues{ display:flex; gap:8px; justify-content:center; margin:8px 0 14px; flex-wrap:wrap; }
.langues button{ min-height:52px; padding:0 18px; border-radius:16px; background:#ffffff1c; border:2px solid #ffffff33; font-weight:800; font-size:18px; }
.langues button.on{ background:var(--or); color:#3a2600; border-color:var(--or); }
.modes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
.mode{ text-align:left; padding:14px 16px; border-radius:20px; background:#ffffffe8; color:#14324f; box-shadow:0 6px 0 #0005; min-height:110px; display:flex; flex-direction:column; gap:4px; }
.mode b{ font-family:'Baloo 2'; font-size:22px; line-height:1.05; }
.mode .ar{ font-family:Amiri, serif; font-size:20px; color:#1f6fd1; }
.mode small{ color:#40556c; font-weight:700; line-height:1.3; }
.mode.grand{ grid-column:1 / -1; background:linear-gradient(90deg, #ffc94a, #ffe9a8); }
.mode .rec{ margin-top:auto; font-weight:800; color:#8a5a00; }
.titre2{ font-family:'Baloo 2'; font-size:26px; margin:20px 0 8px; text-shadow:0 2px 8px #000a; }
.mondes{ display:grid; gap:12px; }
.monde{ border-radius:20px; overflow:hidden; background:#00000055 center/cover; padding:14px; box-shadow:0 6px 0 #0005; }
.monde h3{ margin:0 0 8px; font-family:'Baloo 2'; font-size:22px; text-shadow:0 2px 8px #000; }
.niveaux{ display:grid; grid-template-columns:repeat(8, minmax(0, 1fr)); gap:8px; }
@media (max-width:620px){ .niveaux{ grid-template-columns:repeat(4, minmax(0, 1fr)); } }
.niv{ aspect-ratio:1; border-radius:16px; background:#fffaf0; color:#14324f; font-family:'Baloo 2'; font-size:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 4px 0 #0006; min-height:56px; }
.niv i{ font-style:normal; font-size:12px; letter-spacing:1px; }
.niv:disabled{ opacity:.45; }
/* le jeu */
#e-jeu{ overflow:hidden; display:none; flex-direction:column; }
#e-jeu.on{ display:flex; }
.hud{ display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 6px; flex-wrap:wrap; position:relative; z-index:2; }
.hud .pill{ min-height:44px; padding:4px 12px; }
.but{ flex:1; min-width:160px; text-align:center; font-weight:800; font-size:16px; line-height:1.15; background:#00000055; border-radius:14px; padding:6px 10px; }
.but .barre{ height:8px; border-radius:4px; background:#ffffff33; margin-top:4px; overflow:hidden; }
.but .barre i{ display:block; height:100%; width:0; background:var(--or); transition:width .3s; }
.apercu{ text-align:center; min-height:56px; font-family:'Baloo 2'; font-size:clamp(26px, 6vw, 40px); letter-spacing:3px; position:relative; z-index:2; text-shadow:0 3px 10px #000a; }
.apercu.ar{ font-family:Amiri, serif; letter-spacing:0; direction:rtl; }
.apercu.bon{ color:#7dffa8; } .apercu.mauvais{ color:#ffb3b3; }
.apercu small{ font-family:Nunito; font-size:16px; letter-spacing:0; color:var(--or); margin-inline-start:10px; }
.zone{ flex:1; position:relative; z-index:2; display:flex; align-items:center; justify-content:center; min-height:0; }
.grille{ position:relative; touch-action:none; border-radius:18px; background:rgba(8,30,55,.55); border:4px solid #e9f2ff55; box-shadow:0 14px 40px #0008, inset 0 0 0 2px #0003; }
.t{ position:absolute; left:0; top:0; width:var(--tuile); height:var(--tuile); padding:3px; transition:transform .28s cubic-bezier(.3,1.3,.6,1), opacity .25s; will-change:transform; }
.t .c{ width:100%; height:100%; border-radius:12px; display:grid; place-items:center; position:relative; overflow:hidden;
  background:url(kelma/img/tuile.webp) center/cover, #f6f1e4; box-shadow:inset 0 -5px 0 #0002, inset 0 0 0 3px #1f6fd1, inset 0 0 0 6px #fff, inset 0 0 0 7px #1f6fd155, 0 3px 0 #0005;
  color:#14324f; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:calc(var(--tuile) * .5); line-height:1; }
.t.ar .c{ font-family:Amiri, serif; font-size:calc(var(--tuile) * .52); padding-bottom:calc(var(--tuile) * .08); }
.t .v{ position:absolute; right:7px; bottom:5px; font-family:Nunito; font-size:calc(var(--tuile) * .17); color:#1f6fd1; }
.t .ic{ position:absolute; left:3px; top:3px; width:42%; height:42%; object-fit:contain; filter:drop-shadow(0 1px 1px #0006); }
.t.dl .c{ box-shadow:inset 0 -5px 0 #0002, inset 0 0 0 3px #2fa86b, inset 0 0 0 6px #fff, 0 3px 0 #0005; }
.t.tl .c{ box-shadow:inset 0 -5px 0 #0002, inset 0 0 0 4px #d4a017, inset 0 0 0 7px #fff, 0 3px 0 #0005; }
.t.dm .c{ box-shadow:inset 0 -5px 0 #0002, inset 0 0 0 4px #d7263d, inset 0 0 0 7px #fff, 0 3px 0 #0005; }
.t.brique .c{ background:url(kelma/img/brique.webp) center/88% no-repeat, #c96f4a; box-shadow:inset 0 0 0 3px #8a3d22, 0 3px 0 #0005; }
.t.sel .c{ background:linear-gradient(#ffe48a, #ffc94a); color:#3a2600; transform:scale(1.06); }
.t.indice .c{ animation:indice 1s ease-in-out infinite; }
@keyframes indice{ 50%{ box-shadow:0 0 0 6px #7dffa8, 0 0 22px #7dffa8; } }
.t.trouve .c{ background:linear-gradient(#bff5d0, #7ee0a4); }
.t.part{ opacity:0; transform:var(--pos) scale(.2) rotate(20deg) !important; }
.t.neuf{ transition:none; }
svg.trait{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
svg.trait polyline{ fill:none; stroke:#ff7a1aaa; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
.bas{ display:flex; gap:8px; justify-content:center; padding:8px 10px calc(10px + env(safe-area-inset-bottom)); position:relative; z-index:2; flex-wrap:wrap; }
.pouv{ min-width:64px; min-height:58px; border-radius:16px; background:#ffffffe8; color:#14324f; font-weight:800; font-size:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 4px 0 #0006; padding:2px 8px; }
.pouv small{ font-size:11px; }
.pouv:disabled{ opacity:.4; }
.cibles{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; position:relative; z-index:2; padding:0 8px; }
.cible{ background:#fffaf0; color:#14324f; border-radius:14px; padding:4px 12px; font-family:'Baloo 2'; font-size:22px; display:flex; align-items:center; gap:6px; box-shadow:0 3px 0 #0006; }
.cible.ar{ font-family:Amiri, serif; direction:rtl; }
.cible.ok{ background:#7ee0a4; text-decoration:line-through; }
.cible span{ font-size:30px; }
.voile{ position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:#0008; padding:16px; }
.carte{ background:#fffaf0; color:#14324f; border-radius:24px; padding:22px; max-width:440px; width:100%; text-align:center; box-shadow:0 20px 60px #000a; }
.carte h2{ font-family:'Baloo 2'; font-size:34px; margin:0; }
.carte .et{ font-size:46px; letter-spacing:6px; }
.carte .mots{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px 0; max-height:30vh; overflow:auto; }
.carte .mots span{ background:#e6effa; border-radius:10px; padding:2px 10px; font-weight:800; }
.gros{ min-height:56px; padding:0 22px; border-radius:16px; background:var(--or); color:#3a2600; font-weight:800; font-size:19px; box-shadow:0 5px 0 #b8860b; margin:6px; }
.gros.b{ background:#1f6fd1; color:#fff; box-shadow:0 5px 0 #0f3b7a; }
.bulle{ position:fixed; left:50%; top:30%; transform:translate(-50%, -50%); z-index:15; font-family:'Baloo 2'; font-size:clamp(30px, 8vw, 54px); color:var(--or); text-shadow:0 4px 0 #8a5a00, 0 8px 20px #000a; pointer-events:none; animation:bulle 1.1s ease-out forwards; white-space:nowrap; }
@keyframes bulle{ from{ opacity:0; transform:translate(-50%, -30%) scale(.6); } 20%{ opacity:1; transform:translate(-50%, -50%) scale(1.1); } to{ opacity:0; transform:translate(-50%, -90%) scale(1); } }
.regl{ display:grid; gap:10px; text-align:left; }
.regl .l{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.regl .l b{ flex:1 1 100%; }
.regl button{ min-height:46px; padding:0 14px; border-radius:12px; background:#e6effa; font-weight:800; }
.regl button.on{ background:#1f6fd1; color:#fff; }
@media (prefers-reduced-motion:reduce){ .t{ transition:none; } .t.indice .c{ animation:none; outline:4px solid #7dffa8; } .bulle{ animation-duration:.01s; } }
</style>
</head>
<body>
<section class="ecran on" id="e-menu"><div class="boite">
  <div class="haut"><a class="pill" href="/">← Accueil</a><span class="esp"></span><button class="pill" id="b-regl" aria-label="Réglages">⚙️</button><button class="pill" id="qui">👤</button></div>
  <h1>Kelma<small>كَلِمَة · la tour des mots</small></h1>
  <p class="sous">Trace des mots dans la tour de céramique : les lettres tombent, la tour fond !</p>
  <div class="langues" id="langues"></div>
  <div class="modes" id="modes"></div>
  <div class="titre2">🗺️ Le voyage des mots</div>
  <div class="mondes" id="mondes"></div>
</div></section>

<section class="ecran" id="e-jeu">
  <div class="hud">
    <button class="pill" id="b-pause" aria-label="Pause">⏸</button>
    <div class="but" id="but"></div>
    <span class="pill" id="score">0</span>
  </div>
  <div class="cibles" id="cibles"></div>
  <div class="apercu" id="apercu" aria-live="polite"></div>
  <div class="zone" id="zone"><div class="grille" id="grille"><svg class="trait" id="trait"><polyline points=""/></svg></div></div>
  <div class="bas" id="bas"></div>
</section>
<div id="voile"></div>
<script src="../famille.js"></script>
<script type="module" src="kelma/jeu.js?v=1"></script>
</body>
</html>
