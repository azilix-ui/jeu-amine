<!-- =====================================================================
  MA HOUMA : le quartier du Jasmin (« houma » = le quartier, en tunisien).
  Un monde miniature libre, sans score ni échec : on déplace la famille et les mascottes, on les habille,
  on manipule les objets et on invente ses histoires. Cahier des charges du papa (11/11), adapté au site :
  page autonome, joueurs de la famille, sauvegarde par joueur gardée sur le serveur (cours « houma »), découvertes dans Progression.
  Tout est piloté par des données : ITEMS (objets), FIXED (meubles), PLACES (lieux), RULES (interactions), DISC (découvertes).
  Pour ajouter un lieu : une entrée dans PLACES (décor, sols, meubles, objets) et sa case sur la carte.
===================================================================== -->
<style>
:root{--blue:#1d6fb8;--blue-d:#134f86;--white:#fdfdf8;--ochre:#e8b566;--ink:#23324a;--sun:#ffc93c;--jas:#2e9e4f;--red:#d83a3a;--bar:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f3f6e;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#top,#bottom{position:fixed;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-left)) 6px max(10px,env(safe-area-inset-right));background:linear-gradient(#1d6fb8,#175f9f);color:#fff}
#top{top:0;height:calc(var(--bar) + env(safe-area-inset-top));padding-top:calc(6px + env(safe-area-inset-top));box-shadow:0 3px 0 #0003}
#bottom{bottom:0;height:calc(84px + env(safe-area-inset-bottom));padding-bottom:calc(6px + env(safe-area-inset-bottom));box-shadow:0 -3px 0 #0003;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
#bottom::-webkit-scrollbar{display:none}
.tb{min-width:50px;height:50px;border-radius:16px;background:#ffffff26;display:grid;place-items:center;font-size:26px;flex:none;padding:0 10px;font-weight:800}
.tb.quit{background:#fff;color:var(--blue-d);font-size:19px;text-decoration:none;display:flex;align-items:center}.tb:active{transform:scale(.94)}.tb:focus-visible,.hd:focus-visible,.pl:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
#title{flex:1;min-width:0;font-weight:800;font-size:clamp(17px,2.6vw,25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
#title small{display:block;font-weight:600;font-size:.62em;opacity:.85}
#stars{font-size:19px}
#who img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.hd{flex:none;width:68px;display:grid;justify-items:center;gap:0;font-weight:800;font-size:13px;line-height:1.1;color:#fff;opacity:.55;transition:opacity .2s,transform .15s}
.hd img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#fff}
.hd.here{opacity:1}.hd.here img{border-color:var(--sun)}.hd:active{transform:scale(.92)}
#barHint{flex:none;font-size:13px;line-height:1.15;max-width:120px;opacity:.9;font-weight:600}
#view{position:fixed;left:0;right:0;top:calc(var(--bar) + env(safe-area-inset-top));bottom:calc(84px + env(safe-area-inset-bottom));overflow:hidden;background:#bfe6ff;touch-action:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
#stage>svg.bg{position:absolute;inset:0;width:1280px;height:720px;display:block}
.e{position:absolute;display:grid;place-items:center;transition:left .16s ease-out,top .2s cubic-bezier(.3,1.5,.6,1),filter .15s}
.e svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.e.i,.e.c{cursor:grab;touch-action:none}
.e.i .em{line-height:1;pointer-events:none;filter:drop-shadow(0 2px 0 #0002)}
.e.drag{transition:none;transform:scale(1.14);filter:drop-shadow(0 14px 8px #0005);cursor:grabbing;z-index:9000!important}
.e.hot{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 10px #ffd84d) drop-shadow(0 0 4px #ffd84d)}
.e.f{cursor:pointer}.e.f.none{pointer-events:none}
.e.hop{animation:hop .45s ease}
@keyframes hop{30%{transform:translateY(-26px) scale(1.04,.96)}60%{transform:translateY(0) scale(.97,1.03)}}
.e.munch{animation:munch .5s ease 2}
@keyframes munch{50%{transform:scale(1.06,.95)}}
.e.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.e.hide{display:none}
.spr{width:100%;height:100%;background-repeat:no-repeat;background-size:calc(var(--n) * 100%) 100%;pointer-events:none}
.spr.an{animation:spr .95s steps(var(--n),jump-none) infinite}
@keyframes spr{from{background-position:0 0}to{background-position:100% 0}}
.e.c .body{position:absolute;inset:0;background-size:200% 100%;background-repeat:no-repeat;pointer-events:none}
.e.c .shade{position:absolute;left:14%;right:14%;bottom:-3px;height:9px;border-radius:50%;background:#0003;z-index:-1}
.e.c.sleep>*{transform:rotate(-90deg)}
.fxp{position:absolute;pointer-events:none;font-size:30px;line-height:1;z-index:9500;animation:rise 1.5s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}to{opacity:0;transform:translate(var(--dx,12px),-90px) scale(1.15)}}
.glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,#ffe9a0cc,#ffe9a000);mix-blend-mode:screen;z-index:8000}
#toast{position:fixed;left:50%;top:calc(var(--bar) + env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:#fff;color:var(--ink);font-weight:800;font-size:clamp(16px,2.2vw,21px);padding:10px 20px;border-radius:999px;box-shadow:0 6px 0 #0002,0 0 0 3px var(--sun);z-index:60;transition:transform .35s cubic-bezier(.3,1.4,.6,1);max-width:92vw;text-align:center;pointer-events:none;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}
/* la carte */
#map{position:absolute;inset:0}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;display:grid;justify-items:center;gap:2px;transform:translate(-50%,-100%);font-weight:800;color:var(--ink)}
.pl .sign{background:#fff;border-radius:14px;padding:2px 12px;font-size:20px;box-shadow:0 4px 0 #0002;white-space:nowrap;border:3px solid var(--blue)}
.pl.soon{filter:saturate(.35) brightness(1.05);opacity:.85}.pl.soon .sign{border-color:#9aa9bd;font-size:16px}
.pl:active{transform:translate(-50%,-100%) scale(.96)}
/* les panneaux */
#veil{position:fixed;inset:0;background:#0b2a4acc;z-index:80;display:none;place-items:center;padding:14px}
#veil.on{display:grid}
#panel{background:var(--white);border-radius:26px;padding:18px 20px;max-width:min(680px,96vw);max-height:90vh;overflow:auto;box-shadow:0 10px 0 #0003;text-align:center}
#panel h2{margin:0 0 6px;font-size:28px;line-height:1.1}#panel p{margin:6px 0;font-size:17px;font-weight:600;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:12px 0;text-align:center}
.dk{border-radius:16px;background:#eef4fb;padding:8px 4px;font-size:13.5px;font-weight:800;line-height:1.15;display:grid;gap:2px;justify-items:center}
.dk b{font-size:34px;line-height:1.1}.dk.no{opacity:.45;filter:grayscale(1)}.dk.no b{filter:blur(3px)}
.pill{display:inline-grid;place-items:center;min-height:52px;padding:0 24px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:20px;box-shadow:0 5px 0 var(--blue-d);margin:6px}
.pill.ghost{background:#e6edf6;color:var(--ink);box-shadow:0 5px 0 #c3cfdf}.pill.red{background:var(--red);box-shadow:0 5px 0 #9b2323}
.pill:active{transform:translateY(3px);box-shadow:none}
@media (max-height:520px){:root{--bar:46px}.tb{min-width:38px;height:36px;font-size:19px;border-radius:12px}#stars{font-size:15px}#who img{width:30px;height:30px}
  #bottom{height:calc(52px + env(safe-area-inset-bottom))}#view{bottom:calc(52px + env(safe-area-inset-bottom))}.hd{width:46px;font-size:0}.hd img{width:40px;height:40px}#barHint{display:none}#title small{display:none}}
@media (max-width:700px){.tb.quit span{display:none}}
@media (max-width:560px){#title small{display:none}#barHint{display:none}.tb{min-width:42px;height:44px;padding:0 6px;font-size:22px}#top{gap:5px}}
@media (prefers-reduced-motion:reduce){.e,.e.hop,.e.munch,.e.pop,.fxp,.spr.an{animation:none;transition:none}}
</style>
</head>
<body>
<div id="top">
  <a class="tb quit" href="../index.html" aria-label="Quitter le jeu et revenir à l'accueil">✕<span>&nbsp;Quitter</span></a>
  <button class="tb" id="bMap" aria-label="La carte du quartier">🗺️</button>
  <div id="title">Ma Houma<small>le quartier du Jasmin</small></div>
  <button class="tb" id="bDisc" aria-label="Mes découvertes"><span id="stars">⭐ 0</span></button>
  <button class="tb" id="bSnd" aria-label="Le son">🔊</button>
  <button class="tb" id="bMenu" aria-label="Réglages">⚙️</button>
  <button class="tb" id="who" aria-label="Changer de joueur">👤</button>
</div>
<div id="view"><div id="stage"></div></div>
<div id="bottom"></div>

<div id="veil"><div id="panel" role="dialog" aria-modal="true"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="zel" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fdfdf8"/><path d="M20 4 26 14 36 20 26 26 20 36 14 26 4 20 14 14Z" fill="#1d6fb8"/><circle cx="20" cy="20" r="4" fill="#ffc93c"/><path d="M0 0h6v6H0zM34 0h6v6h-6zM0 34h6v6H0zM34 34h6v6h-6z" fill="#2e9e4f"/></pattern>
  <pattern id="dam" width="56" height="28" patternUnits="userSpaceOnUse"><rect width="56" height="28" fill="#e9d9b8"/><rect width="28" height="28" fill="#d8c29a"/></pattern>
  <pattern id="ray" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="16" height="6" fill="#d83a3a"/><rect y="9" width="16" height="3" fill="#1d6fb8"/></pattern>
</defs></svg>

<script>
'use strict';
const $ = id => document.getElementById(id);
const W = 1280, H = 720;
const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const calm = () => window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

/* =====================================================================
   SONS (synthé : aucun fichier)
   ===================================================================== */
let AC = null, muted = store.get('houma-muet', false);
function ac(){ if(muted) return null; try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){ AC = null; } return AC; }
function tone(f, d = .12, type = 'sine', v = .12, when = 0, slide){ const a = ac(); if(!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when; o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02); }
function noise(d = .3, v = .06, hp = 1500){ const a = ac(); if(!a) return; const n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0); for(let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); n.buffer = b; const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const g = a.createGain(); g.gain.value = v; n.connect(f).connect(g).connect(a.destination); n.start(); }
const sfx = {
  pick(){ tone(520, .07, 'triangle', .1); }, drop(){ tone(260, .09, 'sine', .14, 0, 150); }, tap(){ tone(700, .05, 'square', .05); },
  open(){ tone(300, .08, 'triangle', .1); tone(450, .1, 'triangle', .1, .07); }, close(){ tone(420, .07, 'triangle', .1); tone(260, .1, 'triangle', .1, .06); },
  water(){ noise(.5, .07, 2500); }, munch(){ noise(.09, .12, 900); setTimeout(() => noise(.09, .12, 900), 190); }, sip(){ tone(500, .25, 'sine', .08, 0, 900); },
  drum(k){ tone(k ? 190 : 95, .16, 'sine', .3, 0, k ? 120 : 55); if(k) noise(.05, .1, 3000); }, meow(){ tone(700, .35, 'sawtooth', .05, 0, 420); },
  bird(){ [2400, 2900, 2500, 3100].forEach((f, i) => tone(f, .09, 'sine', .06, i * .11, f * 1.15)); },
  hop(){ tone(440, .08, 'triangle', .1); tone(660, .1, 'triangle', .1, .08); }, wear(){ tone(600, .07, 'triangle', .1); tone(800, .09, 'triangle', .1, .07); },
  star(){ [660, 880, 990, 1320].forEach((f, i) => tone(f, .16, 'triangle', .12, i * .09)); }, on(){ tone(880, .06, 'sine', .09); }, off(){ tone(440, .06, 'sine', .09); },
  tune(){ [293, 311, 370, 392, 440, 392, 370, 311].forEach((f, i) => tone(f * 2, .2, 'triangle', .07, i * .2)); }
};

/* ---------- la voix (12/11) : le jeu lit à voix haute ses messages, le nom des lieux et des personnages, pour Amine qui ne lit pas encore.
   Voix française du navigateur (gratuite, aucun fichier). Le bouton 🔊 coupe les bruitages et la voix. ---------- */
let frVoice = null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); frVoice = v.find(v => /Denise|Hortense|Julie|Amélie|Amelie|Céline|Google français/i.test(v.name)) || v.find(v => /fr-FR/i.test(v.lang)) || v[0] || null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function say(t){ if(muted || !('speechSynthesis' in window) || !t) return;
  const txt = String(t).replace(/<[^>]+>/g, ' ').replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{FE0F}\u{200D}]/gu, ' ').replace(/\s+/g, ' ').trim(); if(!txt) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'fr-FR'; if(frVoice) u.voice = frVoice; u.rate = .96; u.pitch = 1.05; speechSynthesis.speak(u); }catch(e){} }
function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* =====================================================================
   PERSONNAGES : la famille et les mascottes (têtes = avatars du site, corps dessinés)
   k = taille ; skin = peau ; o = tenue de départ ; pal = couleurs de la tenue de ville
   ===================================================================== */
const AV = '../jeux/avatars/';
const CHARS = [
  { id:'anis', n:'Anis', img:'anis', k:.86, hip:.55 }, { id:'imen', n:'Imen', img:'imen', k:.82, hip:.55 }, { id:'essil', n:'Essil', img:'essil', k:.76, hip:.57 },
  { id:'salma', n:'Salma', img:'salma', k:.66, hip:.6 }, { id:'amine', n:'Amine', img:'amine', k:.56, hip:.63 },
  { id:'nour', n:'Nour', img:'mascotte-nour', k:.58, hip:.62 }, { id:'yasmine', n:'Yasmine', img:'mascotte-yasmine', k:.68, hip:.6 }, { id:'fares', n:'Farès', img:'mascotte-fares', k:.84, hip:.56 }
];
const CH = Object.fromEntries(CHARS.map(c => [c.id, c]));
/* Les corps : les personnages « en vrai » du Jasmin et de Médina Express, vus de face (images fabriquées par docs/houma/build.py
   à partir des planches jeux/jasmin2/, aucun crédit). Une image par personnage et par tenue : à gauche debout, à droite les yeux fermés (pour dormir).
   CORPS[id][tenue] = [largeur, hauteur, tête x, tête haut, tête largeur, cou y, main x, main y] en fractions. */
const CORPS = window.HOUMA_CORPS || {}, gold = '#e3b23c', HK = 286;
const OUTFITS = {
  ville:{ n:'ses habits de tous les jours', col:'#2f6fd6' }, jebba:{ n:'sa jebba', trad:1, col:'#fbf8ee' }, foot:{ n:'sa tenue de foot', col:'#c8102e' },
  astro:{ n:"sa tenue d'astronaute", col:'#e9edf2' }, super:{ n:'sa tenue de super-héros', col:'#5b2a9a' }, or:{ n:'sa tenue en or', col:'#e3b23c' },
  // 12/11 : quatre tenues créées avec ComfyUI sur le PC du papa (FLUX.2 klein : on retouche la tenue, le visage reste)
  pyjama:{ n:'son pyjama', col:'#bfe0ff' }, tablier:{ n:"son tablier d'école", col:'#2f55b8' }, fete:{ n:'sa tenue de fête', trad:1, col:'#c2185b' }, plage:{ n:'sa tenue de plage', col:'#12c8b4' }
};
const metaOf = (id, o) => (CORPS[id] && (CORPS[id][o] || CORPS[id].ville)) || [115, 255, .5, .01, .5, .25, .85, .5];
function sizeOf(id, o){ const M = metaOf(id, o), h = HK * CH[id].k; return { w:h * M[0] / M[1], h, M }; }
/* Les vraies poses assises (en tailleur), faites avec ComfyUI sur le PC du papa : jeux/houma/s-<id>[-<tenue>].webp, repères dans assis.js.
   ASSIS[id][tenue] = [largeur, hauteur, hauteur / debout, tête x, tête largeur, cou y]. S'il n'y en a pas pour une tenue, on garde le personnage debout coupé aux hanches. */
const ASSIS = window.HOUMA_ASSIS || {};
function seatOf(id, o){ const A = ASSIS[id] && ASSIS[id][o]; if(!A) return null; const st = sizeOf(id, o), headSt = st.M[4] * st.w, h0 = st.h * A[2], k = Math.max(.85, Math.min(1.2, headSt / (A[4] * h0 * A[0] / A[1])));   // même taille de tête assis et debout
  const h = h0 * k; return { w:h * A[0] / A[1], h, A }; }
function doll(C, st){
  const o = OUTFITS[st.o] ? st.o : 'ville', { w, h, M } = sizeOf(C.id, o), a = st.acc || [];
  const sit = st.pose === 'sit' || st.pose === 'bath', sleep = st.pose === 'sleep', Z = sit && st.a ? seatOf(C.id, o) : null;
  const cx = Z ? Z.A[3] * Z.w : M[2] * w, top = Z ? 0 : M[3] * h, hw = Z ? Z.A[4] * Z.w : M[4] * w, eye = Z ? Z.A[5] * Z.h * .58 : top + (M[5] * h - top) * .56, u = hw / 80;   // u : l'unité des chapeaux, d'après la largeur de la tête
  const hat = (a.includes('chechia') ? `<g transform="translate(${cx} ${top}) scale(${u})"><path d="M-30 14q30-34 60 0v12h-60z" fill="#b3151f" stroke="#6d0c14" stroke-width="2"/><path d="M24 2q12 6 9 28" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/></g>` : '') +
    (a.includes('paille') ? `<g transform="translate(${cx} ${top}) scale(${u})"><ellipse cx="0" cy="18" rx="64" ry="11" fill="#f1d28a" stroke="#c9a65a" stroke-width="2.5"/><path d="M-30 18q30-42 60 0z" fill="#f1d28a" stroke="#c9a65a" stroke-width="2.5"/><path d="M-28 12h56" stroke="#d83a3a" stroke-width="6"/></g>` : '') +
    (a.includes('lunettes') ? `<g transform="translate(${cx} ${eye}) scale(${u})"><rect x="-27" y="-9" width="24" height="17" rx="8" fill="#15151c"/><rect x="3" y="-9" width="24" height="17" rx="8" fill="#15151c"/><path d="M-4 -3h8M-27 -3h-8M27 -3h8" stroke="#15151c" stroke-width="3"/></g>` : '') +
    (a.includes('machmoum') ? `<g transform="translate(${cx + hw * .5} ${eye + 4 * u}) scale(${u * .8})"><path d="M0 22V2" stroke="#2e9e4f" stroke-width="4"/>${[[-8, -4], [8, -4], [0, -12], [-5, 6], [5, 6]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="#fff" stroke="#e6e0c8" stroke-width="1.2"/>`).join('')}</g>` : '');
  const clip = sit ? `clip-path:inset(0 0 ${((1 - C.hip) * 100).toFixed(1)}% 0);` : '', suf = o === 'ville' ? '' : '-' + o;
  const body = Z ? `<div class="body" style="background-image:url(houma/s-${C.id}${suf}.webp);background-size:100% 100%"></div>` : `<div class="body" style="background-image:url(houma/c-${C.id}${suf}.webp);background-position:${sleep ? '100%' : '0'} 0;${clip}"></div>`;

function surfaces(){

    (f.T.surf || []).forEach(s => { if(!s[3] || open) L.push({ x1:f.x + s[0], x2:f.x + s[1], y:f.y + s[2] }); });
    if(f.T.top && !open) L.push({ x1:f.x + f.T.top[0], x2:f.x + f.T.top[1], y:f.y + f.T.top[2] }); });
  return L;
}

  return { x:Math.max(below.x1, Math.min(below.x2, x)), y:below.y };
}

  const F = PLACES[place].floors.slice().sort((a, b) => d(a) - d(b))[0]; return { x:Math.max(F[0], Math.min(F[1], x)), y:F[2], water:F[3] === 'w' }; }

  allFixed().forEach(f => [['seats', 'sit'], ['bed', 'sleep'], ['bath', 'bath']].forEach(([key2, pose]) => (f.T[key2] || []).forEach((a, i) => {
    const ax = f.x + a[0], ay = f.y + a[1], d = Math.hypot(x - ax, (y - h * (pose === 'sleep' ? .5 : .43)) - ay); const used = Object.values(S.chars).some(c => c.p === place && c.a === f.id + ':' + i);

  if(f.type === 'jasmin'){ if(s === 'f'){ const it = S.items.machmoum; if(it.p || it.h || Object.values(S.chars).some(c => c.acc.includes('machmoum'))){ toast('Tu as déjà un machmoum 🌼'); return; } it.p = place; it.x = f.x + 50; it.y = f.y; drawItem('machmoum'); pulse('machmoum', 'pop'); sfx.star(); S.fx[k] = ''; drawFixed(f); save(); } else toast("Le jasmin a soif : arrose-le avec l'arrosoir 💧"); return; }
  if(f.type === 'citronnier'){ if(s === 'c'){ const it = S.items.citron; if(it.p || it.h){ toast('Tu as déjà un citron 🍋'); return; } it.p = place; it.x = f.x + 56; it.y = f.y; drawItem('citron'); pulse('citron', 'pop'); sfx.star(); S.fx[k] = ''; drawFixed(f); found('citron'); save(); } else toast("Le citronnier a soif : arrose-le avec l'arrosoir 💧"); return; }
  if(f.type === 'tableau'){ const n = T.tap[(T.tap.indexOf(s) + 1) % T.tap.length]; S.fx[k] = n; drawFixed(f); noise(.12, .05, 3000); if(n) found('tableau'); save(); return; }
  if(f.type === 'cloche'){ pulse(f.id, 'hop'); [1320, 1320, 1320].forEach((q, i) => tone(q, .3, 'triangle', .14, i * .22)); fx(f.x, f.y - 100, '🔔'); found('cloche'); return; }
  if(f.type === 'drapeau'){ pulse(f.id, 'hop'); sfx.star(); fx(f.x + 40, f.y - 320, '🇹🇳'); found('drapeau'); return; }
  if(f.type === 'cactus'){ pulse(f.id, 'hop'); sfx.hop(); fx(f.x, f.y - 170, '😄'); return; }
  if(f.type === 'jarre'){ pulse(f.id, 'hop'); const it = S.items.scorpion; if(it.p === place && !it.h){ it.p = ''; drawItem('scorpion'); sfx.close(); toast('Le scorpion retourne se cacher dans la jarre'); } else { it.p = place; it.h = ''; it.x = f.x - 110; it.y = f.y; drawItem('scorpion'); pulse('scorpion', 'pop'); sfx.star(); found('scorpion'); toast('Oh ! Un petit scorpion dormait dans la jarre. Il est gentil 🦂'); } save(); return; }
  if(f.type === 'palmier'){ pulse(f.id, 'hop'); const it = S.items.dattes; if(it.p || it.h){ toast('Tu as déjà des dattes 🌴'); return; } it.p = place; it.x = f.x - 70; it.y = f.y; drawItem('dattes'); pulse('dattes', 'pop'); sfx.star(); found('dattes'); save(); return; }
  if(f.type === 'chateau'){ const n = T.tap[(T.tap.indexOf(s) + 1) % T.tap.length]; S.fx[k] = n; drawFixed(f); pulse(f.id, 'pop'); sfx.drop(); if(n === '2') found('chateau'); save(); return; }
  if(f.type === 'cage'){ sfx.bird(); [0, 1, 2].forEach(i => setTimeout(() => fx(f.x, f.y - 60, '🎵'), i * 200)); found('oiseau'); return; }
  if(!T.tap) return;
  const n = T.tap[(T.tap.indexOf(s) + 1) % T.tap.length]; S.fx[k] = n; drawFixed(f);
  if(T.inside){ (n === 'o' ? sfx.open : sfx.close)(); Object.keys(S.items).forEach(drawItem); if(f.type === 'frigo' && n === 'o') found('frigo'); }
  else if(f.type === 'radio'){ if(n === 'on'){ sfx.tune(); found('radio'); } else sfx.off(); }
  else if(T.fill){ if(n === 'on'){ sfx.water(); if(f.type === 'fontaine') found('fontaine'); } else sfx.off(); }
  else if(f.type === 'baignoire'){ sfx.water(); }
  else { (n === 'on' ? sfx.on : sfx.off)(); if(T.glow && n === 'on') found('lampe'); }
  save();
}
function tapItem(id){ const T = IT(id), it = S.items[id], t = typeOf(id); pulse(id, 'hop'); if(!T.pet && t !== 'darbouka') say(T.n);
  if(t === 'darbouka'){ sfx.drum(0); setTimeout(() => sfx.drum(1), 170); setTimeout(() => sfx.drum(1), 300); fx(it.x, it.y - 60, '🥁'); found('darbouka'); }
  else if(T.pet){ cry(id); fx(it.h ? S.chars[it.h].x : it.x, (it.h ? S.chars[it.h].y - 120 : it.y - 50), '💛'); found(T.d || 'chat'); if(T.alt){ it.s = it.s === 'b' ? '' : 'b'; drawItem(id); save(); } }
  else if(T.toy){ sfx.hop(); } else sfx.tap(); }
function tapChar(id){ const c = S.chars[id]; pulse(id, 'hop'); sfx.hop();
  if(c.acc.length){ takeOff(id, c.acc[c.acc.length - 1]); drawChar(id); save(); } else say(pick(['Coucou, c\'est ', 'Salut ! Moi, c\'est ', 'Bonjour ! Je suis ']) + CH[id].n), fx(c.x, c.y - 230 * CH[id].k, pick(['👋', '😄', '🎉', '💛'])); }
const pick = a => a[Math.floor(Math.random() * a.length)];
function cry(id){ const t = typeOf(id); if(t === 'chatR' || t === 'chat') sfx.meow(); else if(t === 'chevre'){ tone(330, .3, 'sawtooth', .06, 0, 300); tone(340, .25, 'sawtooth', .05, .12, 290); } else if(['cigogne', 'mouette'].includes(t)) sfx.bird(); else if(t === 'grenouille') tone(140, .18, 'square', .06, 0, 220); else sfx.hop(); }

/* ---------- lâcher (drop) ---------- */
function hit(x, y, skip){
  // le personnage, puis l'objet, puis le meuble qui se trouve sous le doigt
  const cs = CHARS.filter(C => C.id !== skip && S.chars[C.id].p === place).map(C => ({ C, c:S.chars[C.id] })).filter(({ C, c }) => { const z = sizeOf(C.id, c.o); return Math.abs(x - c.x) < z.w * .42 + 12 && y < c.y + 16 && y > c.y - z.h - 6; }).sort((a, b) => b.c.y - a.c.y)[0];
  const out = []; if(cs) out.push({ kind:'char', id:cs.C.id });
  const its = Object.keys(S.items).filter(id => id !== skip && S.items[id].p === place && !hidden(S.items[id])).map(id => { const it = S.items[id], T = IT(id), p = it.h ? handOf(it.h) : it; return { id, d:Math.hypot(x - p.x, y - (p.y - T.z / 2)), z:T.z }; }).filter(o => o.d < o.z * .7 + 10).sort((a, b) => a.d - b.d)[0];
  if(its) out.push({ kind:'item', id:its.id });
  allFixed().filter(f => Math.abs(x - f.x) < f.T.w / 2 + 12 && y < f.y + 14 && y > f.y - f.T.h - 14).sort((a, b) => a.T.w * a.T.h - b.T.w * b.T.h).forEach(f => out.push({ kind:'fixed', id:f.id, f }));
  return out;
}
// la première cible sous le doigt pour laquelle une règle existe (un objet posé devant un meuble ne le masque pas)
function aim(id, x, y){ for(const t of hit(x, y, id)){ const r = ruleFor(id, t); if(r) return { t, r }; } return null; }
function ruleFor(id, target){ if(!target) return null; const T = IT(id), it = Object.assign({ id }, S.items[id]);
  const arg = target.kind === 'fixed' ? target.f : target.id;
  return RULES.find(r => r.on === target.kind && r.when(T, it, arg)) || null; }
function dropItem(id, x, y){
  const T = IT(id), it = S.items[id], A = aim(id, x, y), target = A && A.t, rule = A && A.r;
  if(rule){ const r = rule.apply(id, T, target.kind === 'fixed' ? target.f : target.id); if(r !== false && r !== 'keep'){ save(); check(); return; } if(r === 'keep'){ /* l'objet reste où on l'a lâché */ } }
  if(T.home && !rule){ goHome(id); sfx.drop(); return; }
  const l = T.fly ? { x, y:Math.min(H - 30, y + T.z * .55) } : land(x, y + T.z * .3); it.h = ''; it.p = place; it.x = l.x; it.y = l.y; drawItem(id); sfx.drop(); if(T.fly && T.d) found(T.d);
  // posé sur le feu allumé par hasard : même règle
  save(); check();
}
function dropChar(id, x, y){
  const c = S.chars[id], C = CH[id], a = anchorFor(x, y, sizeOf(id, c.o).h);
  if(a){ c.x = a.x; c.y = a.y; c.pose = a.pose; c.a = a.a; const t = a.f.type;
    if(a.pose === 'sleep') found(t === 'transat' ? 'sieste' : 'dodo'); if(t === 'pupitre') found('eleve'); if(t === 'barque'){ found('barque'); sfx.water(); }
    if(t === 'baignoire'){ found('bain'); sfx.water(); if(fxState(a.f.id) !== 'm'){ S.fx[fxKey(a.f.id)] = 'm'; drawFixed(a.f); } } }
  else { const f = floorFor(x, y); c.x = f.x; c.y = f.y; c.a = ''; c.pose = f.water ? 'bath' : ''; if(f.water){ found('baignade'); sfx.water(); fx(c.x, c.y - 20, '💦'); } }
  drawChar(id); sfx.drop(); save(); check();
}
// les découvertes qui dépendent de la scène entière
function check(){ if(!place) return;
  if(place === 'dar'){ const sit = Object.values(S.chars).filter(c => c.p === 'dar' && c.pose === 'sit' && (c.a || '').startsWith('banquette')).length; if(sit >= 3) found('veillee'); } }

/* ---------- le doigt ---------- */
let D = null;   // geste en cours
view.addEventListener('pointerdown', e => {
  if(D) return; const el = place ? e.target.closest('.e') : null, p = pt(e);
  if(!el || el.classList.contains('none')){ D = { pan:1, sx:e.clientX, px:panX, id:e.pointerId }; return; }
  const id = el.dataset.id, ent = ents.get(id); if(!ent) return; e.preventDefault(); ac();
  D = { ent, id, sx:e.clientX, sy:e.clientY, moved:false, pid:e.pointerId, ox:0, oy:0 };
  if(ent.kind !== 'f'){ const r = el.getBoundingClientRect(); D.ox = (e.clientX - (r.left + r.width / 2)) / scale; D.oy = (e.clientY - r.bottom) / scale; }
  try{ view.setPointerCapture(e.pointerId); }catch(_){}
});
view.addEventListener('pointermove', e => {
  if(!D) return;
  if(D.pan){ if(W * scale > view.clientWidth){ panX = D.px + (e.clientX - D.sx); fit(); } return; }
  if(e.pointerId !== D.pid) return;
  if(!D.moved){ if(Math.hypot(e.clientX - D.sx, e.clientY - D.sy) < 9) return; if(D.ent.kind === 'f') return; D.moved = true; D.ent.el.classList.add('drag'); sfx.pick();
    if(D.ent.kind === 'c'){ const c = S.chars[D.id]; c.pose = ''; c.a = ''; drawChar(D.id); D.ent.el.classList.add('drag'); } }
  const p = pt(e), el = D.ent.el, w = el.offsetWidth, h = el.offsetHeight, x = p.x - D.ox, y = p.y - D.oy;
  el.style.left = (x - w / 2) + 'px'; el.style.top = (y - h) + 'px';
  if(D.ent.kind === 'c'){ const c = S.chars[D.id]; c.x = x; c.y = y; Object.entries(S.items).forEach(([iid, it]) => { if(it.h === D.id){ drawItem(iid); ents.get(iid).el.style.zIndex = 9001; } }); }
  // montre où l'objet va agir
  const A = D.ent.kind === 'i' ? aim(D.id, p.x, p.y - IT(D.id).z * .3) : null, hid = A ? A.t.id : null;
  if(D.hot !== hid){ if(D.hot && ents.get(D.hot)) ents.get(D.hot).el.classList.remove('hot'); if(hid) ents.get(hid).el.classList.add('hot'); D.hot = hid; }
});
function endDrag(e){
  if(!D) return; const d = D; D = null; if(d.pan) return; if(e.pointerId !== d.pid){ D = d; return; }
  if(d.hot && ents.get(d.hot)) ents.get(d.hot).el.classList.remove('hot'); d.ent.el.classList.remove('drag');
  if(!d.moved){ if(d.ent.kind === 'f'){ const f = fixedOf(d.id); if(f) tapFixed(f); } else if(d.ent.kind === 'i') tapItem(d.id); else tapChar(d.id); return; }
  const p = pt(e), x = Math.max(20, Math.min(W - 20, p.x - d.ox)), y = Math.max(40, Math.min(H - 6, p.y - d.oy));
  if(d.ent.kind === 'i') dropItem(d.id, x, y - IT(d.id).z * .3); else dropChar(d.id, x, y);
}
view.addEventListener('pointerup', endDrag);
view.addEventListener('pointercancel', e => { if(!D) return; const d = D; D = null; if(d.pan) return; d.ent.el.classList.remove('drag'); if(d.ent.kind === 'i') drawItem(d.id); else { const f = floorFor(S.chars[d.id].x, S.chars[d.id].y); Object.assign(S.chars[d.id], f); drawChar(d.id); } });

/* =====================================================================
   LA CARTE et la navigation
   ===================================================================== */
function mapSVG(){ const house = (x, y, w, h, dome) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fdfdf8" stroke="#c9d6e4" stroke-width="3"/>${dome ? `<path d="M${x + w * .2} ${y}q${w * .3}-${w * .5} ${w * .6} 0z" fill="#fdfdf8" stroke="#c9d6e4" stroke-width="3"/>` : `<rect x="${x - 4}" y="${y - 8}" width="${w + 8}" height="10" fill="#1d6fb8"/>`}<path d="M${x + w / 2 - 14} ${y + h}v-${h * .5}q14-20 28 0v${h * .5}z" fill="#1d6fb8"/><rect x="${x + 10}" y="${y + 14}" width="20" height="24" rx="10" fill="#1d6fb8"/><rect x="${x + w - 30}" y="${y + 14}" width="20" height="24" rx="10" fill="#1d6fb8"/>`;
  const palm = (x, y) => `<path d="M${x} ${y}q6-50 0-90" fill="none" stroke="#8a5a2b" stroke-width="9" stroke-linecap="round"/>${[-60, -30, 0, 30, 60].map(a => `<path d="M${x} ${y - 90}q${a} -34 ${a * 1.6} -4" fill="none" stroke="#2e9e4f" stroke-width="9" stroke-linecap="round"/>`).join('')}`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="#bfe6ff"/><circle cx="1140" cy="80" r="46" fill="#ffd84d"/>
    <rect y="150" width="${W}" height="120" fill="#3aa0d8"/><path d="M0 268q160-30 320 0t320 0 320 0 320 0v460H0z" fill="#f1dfb4"/>
    <path d="M880 190q30-14 60 0l-10 16h-40z" fill="#fdfdf8" stroke="#1d6fb8" stroke-width="3"/><path d="M910 190v-34l22 26z" fill="#d83a3a"/>
    <path d="M100 720q200-260 520-250t560 250z" fill="#e9d2a0"/><path d="M180 720q260-150 470-140t500 140" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-dasharray="2 40" opacity=".7"/>
    ${house(180, 330, 250, 150)}${house(560, 250, 210, 120, 1)}${house(900, 330, 220, 130)}${house(380, 560, 240, 110, 1)}
    <path d="M1010 120h30v140h-30z" fill="#fdfdf8" stroke="#c9d6e4" stroke-width="3"/><path d="M1004 120q21-40 42 0z" fill="#2e9e4f"/><path d="M1025 80v-22" stroke="#e3b23c" stroke-width="4"/>
    ${palm(120, 520)}${palm(820, 470)}${palm(1180, 560)}${palm(700, 690)}
    ${[[470, 318], [800, 250], [1140, 322], [640, 548]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="22" fill="#d6338a"/><circle cx="${p[0] + 22}" cy="${p[1] + 12}" r="16" fill="#e04a9a"/>`).join('')}</svg>`; }
function go(pid){
  saveNow();
  if(pid === 'map'){ place = null; stage.innerHTML = `<div id="map">${mapSVG()}${MAP.map(m => `<button class="pl${m[5] ? '' : ' soon'}" data-p="${m[0]}" style="left:${m[1]}%;top:${m[2]}%"><span style="font-size:64px;line-height:1">${m[4]}</span><span class="sign">${m[3]}${m[5] ? '' : ' 🚧'}</span></button>`).join('')}</div>`;
    $('title').innerHTML = `Ma Houma<small>le quartier du Jasmin · choisis un lieu</small>`; bar(); panX = 0; fit(); if(player) say('Le quartier du Jasmin. Choisis un lieu.'); return; }
  say(PLACES[pid].n + ', ' + PLACES[pid].sub); place = pid; S.seen[pid] = 1; if(Object.keys(PLACES).every(k => S.seen[k])) setTimeout(() => found('voyage'), 800); $('title').innerHTML = `${PLACES[pid].n}<small>${PLACES[pid].sub}</small>`; render(); save(); check();
}
stage.addEventListener('click', e => { const b = e.target.closest('.pl'); if(!b) return; sfx.tap(); if(PLACES[b.dataset.p]) go(b.dataset.p); else toast('Ce lieu est encore en travaux 🚧 Il arrive bientôt !'); });
$('bMap').onclick = () => { sfx.tap(); go('map'); };
$('who').onclick = () => { sfx.tap(); choose(); };
$('bSnd').onclick = () => { muted = !muted; if(muted) hush(); store.set('houma-muet', muted); $('bSnd').textContent = muted ? '🔇' : '🔊'; if(!muted) sfx.tap(); };
$('bSnd').textContent = muted ? '🔇' : '🔊';
function panel(html){ $('panel').innerHTML = html; $('veil').classList.add('on'); const b = $('panel').querySelector('button'); if(b) b.focus(); }
function closePanel(){ $('veil').classList.remove('on'); }
$('veil').addEventListener('click', e => { if(e.target.id === 'veil' || e.target.closest('[data-close]')) closePanel(); });
addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });
$('bDisc').onclick = () => { sfx.tap(); const n = DISC.filter(d => S.disc[d[0]]).length; say(`Tu as trouvé ${n} découverte${n > 1 ? 's' : ''} sur ${DISC.length}. Il n'y a rien à gagner ni à perdre : joue comme tu veux.`);
  panel(`<h2>Mes découvertes ⭐ ${n} / ${DISC.length}</h2><p>Il n'y a rien à gagner ni à perdre : joue comme tu veux. Les étoiles apparaissent quand tu trouves une nouvelle idée.</p>
    <div class="grid">${DISC.map(d => `<div class="dk${S.disc[d[0]] ? '' : ' no'}"><b>${d[1]}</b>${S.disc[d[0]] ? d[2] : '?'}</div>`).join('')}</div><button class="pill" data-close>Continuer</button>`); };
$('bMenu').onclick = () => { sfx.tap();
  panel(`<h2>Réglages</h2><p>Monde de <b>${esc(player || '')}</b>. Tout est enregistré tout seul.</p>
    <button class="pill ghost" id="mTidy">🧹 Tout ranger dans ce lieu</button><br><button class="pill red" id="mReset">🗑️ Recommencer mon monde</button><br><button class="pill" data-close>Retour</button>`);
  $('mTidy').onclick = () => { if(!place){ closePanel(); return; } Object.keys(S.items).forEach(id => { if(HOME[id].p === place){ const h = HOME[id]; Object.assign(S.items[id], { p:h.p, x:h.x, y:h.y, h:'', s:'' }); } }); save(); render(); closePanel(); toast('Tout est rangé 🧹'); };
  $('mReset').onclick = () => panel(`<h2>Recommencer ?</h2><p>Ton monde reviendra comme au début : les personnages, les objets et les tenues. Tes découvertes ⭐ restent.</p><button class="pill red" id="mYes">Oui, recommencer</button><button class="pill ghost" data-close>Non</button>`) || ($('mYes').onclick = () => { const disc = S.disc, seen = S.seen; S = fresh(); S.disc = disc; S.seen = seen; save(); closePanel(); go(place || 'map'); toast('Ton monde est comme neuf ✨'); });
};

/* ---------- démarrage ---------- */
fit();
(async () => { const p = window.Famille && Famille.player(); if(p) await setPlayer(p); else { S = fresh(); go('map'); await choose(); } window.__houma = { get S(){ return S; }, get place(){ return place; }, go, PLACES, CHARS, DISC, save:saveNow, hit, land }; })();
</script>
