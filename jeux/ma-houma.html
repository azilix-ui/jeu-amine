<!-- =====================================================================
  MA HOUMA : le quartier du Jasmin (« houma » = le quartier, en tunisien).
  Un monde miniature libre, sans score ni échec : on déplace la famille et les mascottes, on les habille,
  on manipule les objets et on invente ses histoires. Cahier des charges du papa (11/11), adapté au site :
  page autonome, joueurs de la famille, sauvegarde par joueur gardée sur le serveur (cours « houma »), découvertes dans Progression.
  Tout est piloté par des données : ITEMS (objets), FIXED (meubles), PLACES (lieux), RULES (interactions), DISC (découvertes).
  Pour ajouter un lieu : une entrée dans PLACES (décor, sols, meubles, objets) et sa case sur la carte.
===================================================================== -->
<style>
:root{--blue:#1d6fb8;--blue-d:#134f86;--white:#fdfdf8;--ochre:#e8b566;--ink:#23324a;--sun:#ffc93c;--jas:#2e9e4f;--red:#d83a3a;--bar:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f3f6e;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#top,#bottom{position:fixed;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-left)) 6px max(10px,env(safe-area-inset-right));background:linear-gradient(#1d6fb8,#175f9f);color:#fff}
#top{top:0;height:calc(var(--bar) + env(safe-area-inset-top));padding-top:calc(6px + env(safe-area-inset-top));box-shadow:0 3px 0 #0003}

#bottom::-webkit-scrollbar{display:none}
.tb{min-width:50px;height:50px;border-radius:16px;background:#ffffff26;display:grid;place-items:center;font-size:26px;flex:none;padding:0 10px;font-weight:800}

#title{flex:1;min-width:0;font-weight:800;font-size:clamp(17px,2.6vw,25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}

#stars{font-size:19px}
#who img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.hd{flex:none;width:68px;display:grid;justify-items:center;gap:0;font-weight:800;font-size:13px;line-height:1.1;color:#fff;opacity:.55;transition:opacity .2s,transform .15s}
.hd img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#fff}
.hd.here{opacity:1}.hd.here img{border-color:var(--sun)}.hd:active{transform:scale(.92)}
#barHint{flex:none;font-size:13px;line-height:1.15;max-width:120px;opacity:.9;font-weight:600}
#view{position:fixed;left:0;right:0;top:calc(var(--bar) + env(safe-area-inset-top));bottom:calc(84px + env(safe-area-inset-bottom));overflow:hidden;background:#bfe6ff;touch-action:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
#stage>svg.bg{position:absolute;inset:0;width:1280px;height:720px;display:block}
.e{position:absolute;display:grid;place-items:center;transition:left .16s ease-out,top .2s cubic-bezier(.3,1.5,.6,1),filter .15s}
.e svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.e.i,.e.c{cursor:grab;touch-action:none}
.e.i .em{line-height:1;pointer-events:none;filter:drop-shadow(0 2px 0 #0002)}
.e.drag{transition:none;transform:scale(1.14);filter:drop-shadow(0 14px 8px #0005);cursor:grabbing;z-index:9000!important}
.e.hot{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 10px #ffd84d) drop-shadow(0 0 4px #ffd84d)}

.e.hop{animation:hop .45s ease}

.spr{width:100%;height:100%;background-repeat:no-repeat;background-size:calc(var(--n) * 100%) 100%;pointer-events:none}

@keyframes spr{from{background-position:0 0}to{background-position:100% 0}}

.glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,#ffe9a0cc,#ffe9a000);mix-blend-mode:screen;z-index:8000}

#toast.on{transform:translate(-50%,0);opacity:1}
.bg.room{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}
.mwall{position:absolute;left:0;top:0;width:1280px;height:520px}.mwall.ciel{background:linear-gradient(#8fd0ff,#e6f6ff)}.mwall svg{width:100%;height:100%;display:block}

.porte.g{left:0;border-radius:0 40px 40px 0;border-left:0}.porte.d{right:0;border-radius:40px 0 0 40px;border-right:0}.porte b{font-size:24px}.porte:active{background:var(--sun)}
.e.f .dimg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 7px 5px #0003)}

.cord{position:absolute;left:50%;bottom:100%;width:3px;margin-left:-1.5px;background:#4a4a4a}
.tvon{position:absolute;left:11%;top:1.5%;width:78%;height:51%;border-radius:4px;background:linear-gradient(120deg,#5ad1ff,#ffd84d,#ff6fb5,#7cff9a,#5ad1ff);background-size:400% 400%;animation:tv 3s linear infinite;opacity:.9;pointer-events:none}
@keyframes tv{to{background-position:400% 0}}
.a-balance{animation:swing 1.8s ease-in-out infinite;transform-origin:50% 0}.e.c.a-balance{transform-origin:50% -130px}

@keyframes swing{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}@keyframes rock{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.decolle{animation:decolle 2.6s ease-in forwards}@keyframes decolle{12%{transform:translateY(8px) rotate(-2deg)}24%{transform:translateY(0) rotate(2deg)}100%{transform:translateY(-950px)}}
.boing{animation:boing .42s ease-in-out 4}@keyframes boing{50%{transform:translateY(-120px)}}
.g-salut{animation:wig .35s ease-in-out 4}.g-danse{animation:dance .66s ease-in-out 5}.g-saut{animation:boing .5s ease-in-out 2}.g-bravo{animation:munch .3s ease 5}.g-bisou{animation:hop .5s ease 2}
@keyframes wig{50%{transform:rotate(4deg)}}@keyframes dance{25%{transform:rotate(-6deg) translateY(-8px)}75%{transform:rotate(6deg) translateY(-8px)}}
#selbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:20;display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px);gap:4px;background:#fffffff2;padding:5px;border-radius:18px;box-shadow:0 4px 0 #0003;border:3px solid var(--sun)}

#bulle button{width:calc(50px * var(--u));height:calc(50px * var(--u));font-size:calc(27px * var(--u));line-height:1;border-radius:calc(14px * var(--u));background:#eef4fb;display:grid;place-items:center}

.ktabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.ktab{min-height:48px;padding:0 14px;border-radius:999px;background:#e6edf6;font-weight:800;font-size:16px}.ktab.on{background:var(--blue);color:#fff}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:10px 0}
.kit{background:#eef4fb;border-radius:16px;padding:6px 4px;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:800;line-height:1.1}.kit img{width:84px;height:84px;object-fit:contain}.kit:active{background:var(--sun)}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin:6px 0 12px}.sw{height:66px;border-radius:14px;border:4px solid #fff;box-shadow:0 0 0 2px #c3cfdf}.sw.on{box-shadow:0 0 0 5px var(--sun)}
.tb[hidden]{display:none}
#mpeint{position:absolute;left:0;top:0;width:1280px;height:520px}
body.peinture #bPeint{background:var(--sun)}
#pbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:20;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;max-width:calc(100% - 16px);gap:4px;background:#fffffff2;padding:6px;border-radius:18px;box-shadow:0 4px 0 #0003;border:3px solid var(--sun)}
#pbar button{min-width:46px;height:46px;font-size:22px;border-radius:12px;background:#eef4fb;display:grid;place-items:center;padding:0 6px}#pbar button.on{background:var(--sun)}
#pbar .pc{background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px #9aa}#pbar .pc.on{box-shadow:0 0 0 4px var(--blue)}#pbar .sep{width:6px}#pbar .fini{font-size:17px;font-weight:800;background:var(--blue);color:#fff}
@media (max-height:520px){#pbar button{min-width:38px;height:38px;font-size:18px}}
.kit .tenue{width:84px;height:96px;background-size:200% 100%;background-position:0 0;background-repeat:no-repeat}.kit.on{box-shadow:0 0 0 4px var(--sun)}
@media (max-width:640px){body.inroom #bDisc,body.inroom #bSnd,body.inroom #bMap{display:none}}
/* la carte */
#map{position:absolute;inset:0}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;display:grid;justify-items:center;gap:2px;transform:translate(-50%,-100%);font-weight:800;color:var(--ink)}
.pl .sign{background:#fff;border-radius:14px;padding:2px 12px;font-size:20px;box-shadow:0 4px 0 #0002;white-space:nowrap;border:3px solid var(--blue)}
.pl.soon{filter:saturate(.35) brightness(1.05);opacity:.85}.pl.soon .sign{border-color:#9aa9bd;font-size:16px}
.pl:active{transform:translate(-50%,-100%) scale(.96)}
/* les panneaux */
#veil{position:fixed;inset:0;background:#0b2a4acc;z-index:80;display:none;place-items:center;padding:14px}
#veil.on{display:grid}
#panel{background:var(--white);border-radius:26px;padding:18px 20px;max-width:min(680px,96vw);max-height:90vh;overflow:auto;box-shadow:0 10px 0 #0003;text-align:center}
#panel h2{margin:0 0 6px;font-size:28px;line-height:1.1}#panel p{margin:6px 0;font-size:17px;font-weight:600;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:12px 0;text-align:center}
.dk{border-radius:16px;background:#eef4fb;padding:8px 4px;font-size:13.5px;font-weight:800;line-height:1.15;display:grid;gap:2px;justify-items:center}
.dk b{font-size:34px;line-height:1.1}.dk.no{opacity:.45;filter:grayscale(1)}.dk.no b{filter:blur(3px)}
.pill{display:inline-grid;place-items:center;min-height:52px;padding:0 24px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:20px;box-shadow:0 5px 0 var(--blue-d);margin:6px}
.pill.ghost{background:#e6edf6;color:var(--ink);box-shadow:0 5px 0 #c3cfdf}.pill.red{background:var(--red);box-shadow:0 5px 0 #9b2323}
.pill:active{transform:translateY(3px);box-shadow:none}
@media (max-height:520px){:root{--bar:46px}.tb{min-width:38px;height:36px;font-size:19px;border-radius:12px}#stars{font-size:15px}#who img{width:30px;height:30px}
  #bottom{height:calc(52px + env(safe-area-inset-bottom))}#view{bottom:calc(52px + env(safe-area-inset-bottom))}.hd{width:46px;font-size:0}.hd img{width:40px;height:40px}#barHint{display:none}#title small{display:none}}
@media (max-width:700px){.tb.quit span{display:none}}
@media (max-width:560px){#title small{display:none}#barHint{display:none}.tb{min-width:42px;height:44px;padding:0 6px;font-size:22px}#top{gap:5px}}
@media (prefers-reduced-motion:reduce){.e,.e.hop,.e.munch,.e.pop,.fxp,.spr.an{animation:none;transition:none}}
</style>

<script>
'use strict';
const $ = id => document.getElementById(id);
const W = 1280, H = 720;
const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const calm = () => window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

/* =====================================================================
   SONS (synthé : aucun fichier)
   ===================================================================== */
let AC = null, muted = store.get('houma-muet', false);
function ac(){ if(muted) return null; try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){ AC = null; } return AC; }
function tone(f, d = .12, type = 'sine', v = .12, when = 0, slide){ const a = ac(); if(!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when; o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02); }
function noise(d = .3, v = .06, hp = 1500){ const a = ac(); if(!a) return; const n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0); for(let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); n.buffer = b; const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const g = a.createGain(); g.gain.value = v; n.connect(f).connect(g).connect(a.destination); n.start(); }
const sfx = {
  pick(){ tone(520, .07, 'triangle', .1); }, drop(){ tone(260, .09, 'sine', .14, 0, 150); }, tap(){ tone(700, .05, 'square', .05); },
  open(){ tone(300, .08, 'triangle', .1); tone(450, .1, 'triangle', .1, .07); }, close(){ tone(420, .07, 'triangle', .1); tone(260, .1, 'triangle', .1, .06); },
  water(){ noise(.5, .07, 2500); }, munch(){ noise(.09, .12, 900); setTimeout(() => noise(.09, .12, 900), 190); }, sip(){ tone(500, .25, 'sine', .08, 0, 900); },
  drum(k){ tone(k ? 190 : 95, .16, 'sine', .3, 0, k ? 120 : 55); if(k) noise(.05, .1, 3000); }, meow(){ tone(700, .35, 'sawtooth', .05, 0, 420); },
  bird(){ [2400, 2900, 2500, 3100].forEach((f, i) => tone(f, .09, 'sine', .06, i * .11, f * 1.15)); },
  hop(){ tone(440, .08, 'triangle', .1); tone(660, .1, 'triangle', .1, .08); }, wear(){ tone(600, .07, 'triangle', .1); tone(800, .09, 'triangle', .1, .07); },
  star(){ [660, 880, 990, 1320].forEach((f, i) => tone(f, .16, 'triangle', .12, i * .09)); }, on(){ tone(880, .06, 'sine', .09); }, off(){ tone(440, .06, 'sine', .09); },
  tune(){ [293, 311, 370, 392, 440, 392, 370, 311].forEach((f, i) => tone(f * 2, .2, 'triangle', .07, i * .2)); }
};

const SONS_H = { pick:'prendre', drop:'poser', open:'porte-ouvre', close:'porte-ferme', water:'eau', munch:'croque', sip:'gorgee', meow:'miaou', bird:'oiseau', wear:'habit', star:'etoile' };

  Sons.charger('houma', [...Object.values(SONS_H), 'doum', 'tek', 'amb-souk', 'amb-plage', 'amb-cafe', 'amb-ecole', 'amb-dar']);
  const enr = (nom, vol = .7) => { const A = ac(); return !!(A && Sons.jouer(A, A.destination, nom, vol)); };
  Object.keys(SONS_H).forEach(k => { const f = sfx[k]; sfx[k] = (...a) => { if(!enr(SONS_H[k])) f(...a); }; });

/* ---------- la voix (12/11) : le jeu lit à voix haute ses messages, le nom des lieux et des personnages, pour Amine qui ne lit pas encore.
   Voix française du navigateur (gratuite, aucun fichier). Le bouton 🔊 coupe les bruitages et la voix. ---------- */
let frVoice = null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); frVoice = v.find(v => /Denise|Hortense|Julie|Amélie|Amelie|Céline|Google français/i.test(v.name)) || v.find(v => /fr-FR/i.test(v.lang)) || v[0] || null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function say(t){ if(muted || !('speechSynthesis' in window) || !t) return;
  const txt = String(t).replace(/<[^>]+>/g, ' ').replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{FE0F}\u{200D}]/gu, ' ').replace(/\s+/g, ' ').trim(); if(!txt) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'fr-FR'; if(frVoice) u.voice = frVoice; u.rate = .96; u.pitch = 1.05; speechSynthesis.speak(u); }catch(e){} }
function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }
/* ---------- les vraies voix de la famille (12/11, demandé par le papa) : chacun peut enregistrer son prénom, et le nom des lieux, avec le micro.
   Même service que Nahki Tounsi (amine/voix/api.php : sons gardés hors du site, enregistrement protégé par le mot de passe parent, écoute libre).
   Clés « houma:<id> ». S'il y a un enregistrement, on le joue ; sinon la voix du navigateur lit le texte. ---------- */
const VAPI = '../amine/voix/api.php'; let VOIX = {}, vSetup = false, vPass = '', vAudio = null;
async function loadVoix(){ try{ const r = await fetch(`${VAPI}?action=list&t=${Date.now()}`, { cache:'no-store' }).then(r => r.json()); VOIX = r.voix || {}; vSetup = !!r.setup; }catch(e){} }
const vUrl = k => `${VAPI}?action=play&k=${encodeURIComponent('houma:' + k)}&v=${VOIX['houma:' + k]}`;
function voix(k, force){ if(!VOIX['houma:' + k] || (muted && !force)) return false; try{ hush(); if(vAudio) vAudio.pause(); vAudio = new Audio(vUrl(k)); vAudio.play().catch(() => {}); return true; }catch(e){ return false; } }
async function vPost(action, fields, file){ const fd = new FormData(); fd.append('action', action); fd.append('pass', vPass); Object.entries(fields || {}).forEach(([k, v]) => fd.append(k, v)); if(file) fd.append('audio', file, 'voix');
  const r = await fetch(VAPI, { method:'POST', body:fd }); const j = await r.json().catch(() => ({})); if(!r.ok) throw new Error(j.error || 'Erreur ' + r.status); return j; }

  if(d.ent.kind === 'c'){ const door = doorAt(p.x, p.y); if(door){ moveToRoom('char', d.id, door); return; } }
  if(d.ent.kind === 'i') dropItem(d.id, x, y - IT(d.id).z * .3); else dropChar(d.id, x, y);
}

let vRec = null;
async function voixPanel(msg){
  await loadVoix();
  if(vSetup){ panel(`<h2>🎙️ Les voix de la famille</h2><p>Le mot de passe parent n'existe pas encore. Créez-le d'abord dans « Nahki Tounsi » (espace d'Amine, bouton des parents), puis revenez ici.</p><button class="pill" data-close>Retour</button>`); return; }

    const go2 = async () => { vPass = $('vP').value; try{ await vPost('login'); voixPanel(); }catch(e){ vPass = ''; voixPanel(e.message); } };
    $('vOk').onclick = go2; $('vP').onkeydown = e => { if(e.key === 'Enter') go2(); }; $('vP').focus(); return; }
  panel(`<h2>🎙️ Les voix de la famille</h2><p>Touchez ⏺, dites le prénom (ou une petite phrase, 3 secondes au plus), c'est enregistré tout seul. ▶ pour écouter, 🗑 pour revenir à la voix du jeu.</p>
    <div id="vRows" style="display:grid;gap:8px;text-align:left;margin:10px 0">${VLIST().map(([k, n, img, ic]) => { const has = !!VOIX['houma:' + k];
      return `<div data-k="${k}" style="display:flex;align-items:center;gap:10px;background:#eef4fb;border-radius:16px;padding:6px 10px">${img ? `<img src="${img}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover">` : `<span style="font-size:32px;width:44px;text-align:center">${ic}</span>`}<b style="flex:1;font-size:18px">${n}</b>
        <button class="tb" data-a="rec" aria-label="Enregistrer ${n}" style="background:var(--red);color:#fff">⏺</button><button class="tb" data-a="play" aria-label="Écouter ${n}" style="background:var(--blue);color:#fff" ${has ? '' : 'disabled'}>▶</button><button class="tb" data-a="del" aria-label="Effacer ${n}" style="background:#c3cfdf" ${has ? '' : 'disabled'}>🗑</button></div>`; }).join('')}</div>
    <p id="vMsg" style="min-height:1.4em;font-weight:800">${msg || ''}</p><button class="pill" data-close>Terminé</button>`);
  $('vRows').onclick = async e => { const b = e.target.closest('[data-a]'); if(!b || b.disabled) return; const k = b.closest('[data-k]').dataset.k, m = $('vMsg');
    if(b.dataset.a === 'play'){ voix(k, true); return; }
    if(b.dataset.a === 'del'){ try{ await vPost('delete', { k:'houma:' + k }); voixPanel('Effacé : le jeu reprend sa voix.'); }catch(err){ m.textContent = err.message; } return; }
    if(vRec){ vRec.stop(); return; }
    try{ if(!navigator.mediaDevices || !window.MediaRecorder) throw new Error("Ce navigateur ne permet pas d'enregistrer.");
      const mic = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }), chunks = [], r = new MediaRecorder(mic); vRec = r; hush();
      r.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
      r.onstop = async () => { vRec = null; mic.getTracks().forEach(t => t.stop()); m.textContent = "J'enregistre…";
        try{ await vPost('save', { k:'houma:' + k }, new Blob(chunks, { type:r.mimeType || 'audio/webm' })); await voixPanel('Enregistré ✔ Touchez ▶ pour écouter.'); voix(k, true); }catch(err){ m.textContent = err.message; } };
      b.textContent = '⏹'; m.textContent = '🔴 Parlez maintenant…'; r.start(); setTimeout(() => { if(vRec === r) r.stop(); }, 3000);
    }catch(err){ vRec = null; m.textContent = err.name === 'NotAllowedError' ? "Le micro n'est pas autorisé : acceptez la demande du navigateur." : err.message; } };
}

function decoZ(uid, depth = 0){ const d = S.deco[uid], K = KAT[d.t]; if(!K) return 100;

  const T = { deco:1, uid, t:d.t, K, B, w, h, seats:pts(B.seats), bed:pts(B.bed), bath:pts(B.bath), zz:() => decoZ(uid),
    draw:s => `${K.ou === 'plafond' ? `<i class="cord" style="height:${Math.max(0, d.y - h)}px"></i>` : ''}<img class="dimg${K.cat === 'peint' ? ' peint' : ''}${s === 'on' && B.act ? ' on-' + B.act : ''}" src="${decoRoot}${d.t}.webp" alt="" draggable="false" style="transform:${d.f ? 'scaleX(-1) ' : ''}rotate(${d.r || 0}deg)">${s === 'on' && B.act === 'tele' ? '<i class="tvon"></i>' : ''}` };
  if(B.surf){ const a = fx(B.surf[0]), b = fx(B.surf[1]); T.surf = [[Math.min(a, b), Math.max(a, b), fy(B.surf[2])]]; }
  if(B.glow) T.glow = [fx(B.glow[0]), fy(B.glow[1]), B.glow[2] * Math.min(w, h)];
  if(B.act === 'lumiere' || B.act === 'feu' || B.act === 'tele' || B.act === 'balance' || B.act === 'bascule' || B.act === 'eau' || B.act === 'radio' || B.act === 'bulles') T.tap = ['', 'on'];
  return T; }

  if(!b){ b = document.createElement('div'); b.id = 'selbar'; view.appendChild(b);   // en haut de l’écran (le haut du mur), à taille fixe : ne cache pas les personnages
    b.innerHTML = [['moins', '➖', 'Plus petit'], ['plus', '➕', 'Plus grand'], ['g', '↺', 'Tourner'], ['d', '↻', 'Tourner'], ['flip', '⇋', 'Retourner'], ['copie', '⧉', 'Copier'], ['avant', '⬆️', 'Devant'], ['arriere', '⬇️', 'Derrière'], ['jette', '🗑️', 'Enlever']]
      .map(([k, ic, n]) => `<button data-s="${k}" aria-label="${n}" title="${n}">${ic}</button>`).join('');
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('click', e => { const k = e.target.closest('[data-s]'); if(k) selAct(k.dataset.s); }); }
  b.querySelector('[data-s="jette"]').setAttribute('aria-label', 'Enlever ' + KAT[S.deco[sel].t].n); }
function selAct(k){ const uid = sel, d = S.deco[uid]; if(!d) return; sfx.tap();
  if(k === 'plus' || k === 'moins'){ d.k = Math.max(.35, Math.min(3, d.k * (k === 'plus' ? 1.15 : 1 / 1.15))); }
  else if(k === 'g' || k === 'd'){ d.r = ((d.r || 0) + (k === 'd' ? 15 : -15) + 540) % 360 - 180; }
  else if(k === 'flip'){ d.f = d.f ? 0 : 1; found('miroir'); }
  else if(k === 'avant'){ d.z = (d.z || 0) + 40; }
  else if(k === 'arriere'){ d.z = (d.z || 0) - 40; }
  else if(k === 'copie'){ const n = addDeco(d.t, d.x + 60, d.y); if(n){ Object.assign(S.deco[n], { k:d.k, r:d.r, f:d.f, z:d.z + 1, on:d.on }); save(); render(); select(n); pulse(n, 'pop'); } return; }
  else if(k === 'jette'){ jette(uid); return; }
  refreshDeco(uid); save(); }
function jette(uid){ const d = S.deco[uid]; if(!d) return; Object.values(S.deco).forEach(o => { if(o.on === uid){ o.on = ''; o.y = Math.max(FLOOR_Y[0], Math.min(FLOOR_Y[1], d.y)); } });
  Object.values(S.chars).forEach(c => { if((c.a || '').startsWith(uid + ':')){ c.a = ''; c.pose = ''; c.y = 664; } });
  delete S.deco[uid]; delete FIXED['d:' + uid]; unselect(); sfx.close(); save(); render(); }
function refreshDeco(uid){ FIXED['d:' + uid] = decoDef(uid); const f = fixedOf(uid); if(f) drawFixed(f);
  const e = ents.get(uid); if(e && e.glow){ const g = f.T.glow; if(g){ e.glow.style.cssText = `left:${f.x + g[0] - g[2]}px;top:${f.y + g[1] - g[2]}px;width:${g[2] * 2}px;height:${g[2] * 2}px;display:${S.deco[uid].s === 'on' ? 'block' : 'none'}`; } }
  // ce qui est posé dessus ou assis dessus suit
  Object.entries(S.deco).forEach(([o, od]) => { if(od.on === uid && od.p === place){ const T = FIXED['d:' + uid]; if(T.surf){ od.y = d0(uid) + T.surf[0][2]; } refreshDeco(o); } });
  Object.entries(S.chars).forEach(([cid, c]) => { const a = c.a || ''; if(c.p === place && a.startsWith(uid + ':')){ const T = FIXED['d:' + uid], i = +a.split(':')[1], L = T.seats || T.bed || T.bath; if(L && L[i]){ c.x = S.deco[uid].x + L[i][0]; c.y = S.deco[uid].y + L[i][1]; drawChar(cid); } } });
  if(sel === uid) drawSel(); }
const d0 = uid => S.deco[uid].y;

/* ---------- déplacer un meuble ---------- */
function supportAt(uid, x, y){   // un dessus (table, commode…) sous l'objet lâché
  let best = null; Object.entries(S.deco).forEach(([o, od]) => { if(o === uid || od.p !== place || od.on === uid) return; const T = FIXED['d:' + o] || decoDef(o); if(!T.surf) return;
    const s = T.surf[0], sy = od.y + s[2]; if(x >= od.x + s[0] - 10 && x <= od.x + s[1] + 10 && y > sy - 70 && y < sy + 50){ const dd = Math.abs(y - sy); if(!best || dd < best.dd) best = { o, y:sy, dd }; } });
  return best; }
function dropDeco(uid, x, y){
  const d = S.deco[uid], K = KAT[d.t], T = FIXED['d:' + uid], ox = d.x, oy = d.y;
  const door = doorAt(x, y); if(door && K.ou === 'sol'){ moveToRoom('deco', uid, door); return; }
  d.x = Math.round(Math.max(30, Math.min(W - 30, x))); d.on = '';
  if(K.ou === 'mur') d.y = Math.round(Math.max(T.h + 6, Math.min(WALL_Y + 40, y)));
  else if(K.ou === 'plafond') d.y = Math.round(Math.max(T.h + 4, Math.min(WALL_Y - 40, y)));
  else { const s = T.h < 140 && supportAt(uid, x, y); if(s){ d.y = Math.round(s.y); d.on = s.o; found('poser'); } else d.y = Math.round(Math.max(FLOOR_Y[0], Math.min(FLOOR_Y[1], y))); }
  // ce qui était posé dessus (et les personnages assis) suit le meuble
  const dx = d.x - ox, dy = d.y - oy;
  Object.entries(S.deco).forEach(([o, od]) => { if(od.on === uid){ od.x += dx; od.y += dy; } });
  Object.values(S.chars).forEach(c => { if(c.p === place && (c.a || '').startsWith(uid + ':')){ c.x += dx; c.y += dy; } });
  Object.entries(S.items).forEach(([id, it]) => { if(it.p === place && !it.h && T.surf && Math.abs(it.y - (oy + T.surf[0][2])) < 4 && it.x >= ox + T.surf[0][0] - 6 && it.x <= ox + T.surf[0][1] + 6){ it.x += dx; it.y += dy; } });
  sfx.drop(); save(); render(); select(uid); }
function doorAt(x, y){ if(!isRoom(place) || y < 260) return null; const i = ROOMS.findIndex(r => r[0] === place); if(x < 70) return ROOMS[(i + ROOMS.length - 1) % ROOMS.length][0]; if(x > W - 70) return ROOMS[(i + 1) % ROOMS.length][0]; return null; }
function moveToRoom(kind, id, to){
  const R = ROOMS.find(r => r[0] === to), fromLeft = ROOMS.findIndex(r => r[0] === to) > ROOMS.findIndex(r => r[0] === place);
  if(kind === 'deco'){ const d = S.deco[id]; Object.values(S.deco).forEach(o => { if(o.on === id){ o.p = to; o.x = (fromLeft ? 220 : W - 220) + (o.x - d.x); } }); d.p = to; d.on = ''; d.x = fromLeft ? 220 : W - 220; d.y = Math.max(FLOOR_Y[0], Math.min(FLOOR_Y[1], d.y));
    Object.values(S.chars).forEach(c => { if((c.a || '').startsWith(id + ':')){ c.a = ''; c.pose = ''; c.y = 664; } }); }
  else { const c = S.chars[id]; dropHeld(id, true); c.p = to; c.pose = ''; c.a = ''; c.x = fromLeft ? 180 : W - 180; c.y = 664; Object.values(S.items).forEach(it => { if(it.h === id) it.p = to; }); }
  sfx.open(); toast((kind === 'deco' ? KAT[S.deco[id].t].n : CH[id].n) + ' → ' + R[1].toLowerCase() + ' ' + R[2]); found('demenage'); save(); unselect(); go(to); if(kind === 'deco') select(id); }

/* ---------- pincer pour agrandir, tourner à deux doigts ---------- */
const touches = new Map(); let pinch = null;
function startPinch(uid){ const p = [...touches.values()]; if(p.length < 2) return; const d = S.deco[uid];
  pinch = { uid, k0:d.k, r0:d.r || 0, d0:Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y) || 1, a0:Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x) }; select(uid); }
function movePinch(){ const p = [...touches.values()]; if(!pinch || p.length < 2) return; const d = S.deco[pinch.uid];
  d.k = Math.max(.35, Math.min(3, pinch.k0 * Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y) / pinch.d0));
  let r = pinch.r0 + (Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x) - pinch.a0) * 180 / Math.PI; r = ((r + 540) % 360) - 180; d.r = Math.abs(r) < 6 ? 0 : Math.round(r);   // aimanté droit
  refreshDeco(pinch.uid); }
function endPinch(){ if(!pinch) return; const uid = pinch.uid; pinch = null; found('pincer'); save(); refreshDeco(uid); }

  if(OUTFITS[o].trad) found('trad'); if(o === 'super') found('super'); if(o === 'astro') found('astro'); if(o === 'pyjama') found('pyjama'); if(o === 'tablier') found('tablier'); if(o === 'plage') found('plagiste'); save(); }

/* ---------- peindre sur les murs (13/11) : pinceau, bombe de graffiti, gomme ---------- */
// S.peint[pièce] = [[outil, couleur, épaisseur, x0, y0, x1, y1, …], …] (entiers) ; dessiné sur une toile posée sur le mur, sous les meubles
const PCOULEURS = ['#1d1d1f', '#ffffff', '#e53935', '#ff9800', '#ffd600', '#43a047', '#1e88e5', '#8e24aa', '#ec407a', '#00bcd4', '#795548', '#c9a227'];
let peinture = null;   // { outil:'p'|'b'|'g', c, w } pendant le mode peinture
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // hasard qui redonne toujours les mêmes gouttes
function peintTotal(){ return Object.values(S.peint || {}).reduce((n, L) => n + L.reduce((m, t) => m + t.length, 0), 0); }
function dessinePeint(pid){ const cv = $('mpeint'); if(!cv) return; const g = cv.getContext('2d'); g.clearRect(0, 0, cv.width, cv.height); (S.peint[pid] || []).forEach(t => trait(g, t)); }
function trait(g, t){ const [o, c, w] = t, P = t.slice(3); if(P.length < 2) return;
  g.save(); g.lineCap = g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = c; g.lineWidth = w;
  if(o === 'b'){ g.globalAlpha = .55; g.shadowColor = c; g.shadowBlur = w * .9; }   // la bombe : un trait doux et des petites gouttes
  g.beginPath(); g.moveTo(P[0], P[1]); for(let i = 2; i < P.length; i += 2) g.lineTo(P[i], P[i + 1]); if(P.length === 2) g.lineTo(P[0] + .1, P[1]); g.stroke();
  if(o === 'b'){ g.shadowBlur = 0; g.globalAlpha = .8; for(let i = 0; i < P.length; i += 2){ for(let k = 0; k < 3; k++){ const r = hash(P[i] * 7 + P[i + 1] * 13 + k), a = r * 6.283, d = w * (.7 + hash(i + k * 31) * .9); g.beginPath(); g.arc(P[i] + Math.cos(a) * d, P[i + 1] + Math.sin(a) * d, 1 + r * 1.6, 0, 7); g.fill(); } } }
  g.restore(); }
function modePeinture(on){
  peinture = on ? { outil:'b', c:PCOULEURS[2], w:14 } : null; document.body.classList.toggle('peinture', !!on); unselect(); closeBubble();
  let b = $('pbar'); if(b) b.remove(); if(!on){ save(); return; }
  b = document.createElement('div'); b.id = 'pbar'; view.appendChild(b); b.addEventListener('pointerdown', e => e.stopPropagation());
  const draw = () => { b.innerHTML = `${[['b', '💨', 'Bombe de graffiti'], ['p', '🖌️', 'Pinceau'], ['g', '🧽', 'Gomme']].map(([k, ic, n]) => `<button data-o="${k}" class="${peinture.outil === k ? 'on' : ''}" aria-label="${n}">${ic}</button>`).join('')}
    <span class="sep"></span>${PCOULEURS.map(c => `<button data-c="${c}" class="pc${peinture.c === c ? ' on' : ''}" style="--c:${c}" aria-label="Couleur"></button>`).join('')}<span class="sep"></span>
    ${[[6, '•'], [14, '●'], [28, '⬤']].map(([w, ic]) => `<button data-w="${w}" class="${peinture.w === w ? 'on' : ''}" aria-label="Épaisseur">${ic}</button>`).join('')}<span class="sep"></span>
    <button data-a="annule" aria-label="Annuler">↩️</button><button data-a="efface" aria-label="Tout effacer">🗑️</button><button data-a="fini" class="fini" aria-label="Fini">✔️ Fini</button>`; };
  draw(); b.onclick = e => { const t = e.target.closest('button'); if(!t) return; sfx.tap();
    if(t.dataset.o) peinture.outil = t.dataset.o; if(t.dataset.c){ peinture.c = t.dataset.c; if(peinture.outil === 'g') peinture.outil = 'b'; } if(t.dataset.w) peinture.w = +t.dataset.w;
    if(t.dataset.a === 'annule'){ (S.peint[place] || []).pop(); dessinePeint(place); save(); }
    if(t.dataset.a === 'efface'){ if((S.peint[place] || []).length && confirm('Effacer tous les dessins de ce mur ?')){ S.peint[place] = []; dessinePeint(place); save(); } }
    if(t.dataset.a === 'fini'){ modePeinture(false); return; } draw(); };
  toast('Dessine sur le mur avec ton doigt ! 🎨'); }
// le doigt sur le mur pendant le mode peinture
let enTrait = null;
function peintDown(p){ if(!peinture || p.y > WALL_Y + 4) return false; const L = S.peint[place] = S.peint[place] || [];
  if(peinture.outil === 'g'){ gomme(p); enTrait = { gomme:1 }; return true; }
  if(peintTotal() > 12000){ toast('Le mur est plein de dessins ! Gomme un peu ou efface 🗑️'); return true; }
  enTrait = [peinture.outil, peinture.c, peinture.w, Math.round(p.x), Math.round(p.y)]; L.push(enTrait); found('graffeur'); dessinePeint(place); return true; }
function peintMove(p){ if(!enTrait) return; if(enTrait.gomme){ gomme(p); return; } const n = enTrait.length, x = Math.round(p.x), y = Math.round(Math.min(WALL_Y, p.y));
  if(Math.hypot(x - enTrait[n - 2], y - enTrait[n - 1]) < 5) return; enTrait.push(x, y); const cv = $('mpeint'); if(cv) trait(cv.getContext('2d'), [enTrait[0], enTrait[1], enTrait[2], enTrait[n - 2], enTrait[n - 1], x, y]); }
function peintUp(){ if(!enTrait) return; enTrait = null; dessinePeint(place); save(); }
function gomme(p){ const L = S.peint[place] || [], r = 22; const i = L.findIndex(t => { for(let k = 3; k < t.length; k += 2) if(Math.hypot(t[k] - p.x, t[k + 1] - p.y) < r + t[2] / 2) return true; return false; });
  if(i >= 0){ L.splice(i, 1); dessinePeint(place); sfx.tap(); } }

/* ---------- les gestes des personnages ---------- */
const GESTES = [['salut', '👋', 'Coucou'], ['danse', '💃', 'Danser'], ['saut', '🦘', 'Sauter'], ['bravo', '👏', 'Bravo'], ['dodo', '😴', 'Dormir'], ['bisou', '😘', 'Un bisou']];

const GFR = { salut:0, danse:1, saut:3, bravo:4 };
const geste = {};   // geste en cours (pas enregistré) : geste[id] = { k, t0, fr }

  b.addEventListener('pointerdown', e => e.stopPropagation()); b.onclick = e => { const g = e.target.closest('[data-g]'); if(!g) return; closeBubble(); if(g.dataset.g === 'enlever'){ takeOff(cid, c.acc[c.acc.length - 1]); drawChar(cid); save(); } else faire(cid, g.dataset.g); };
  clearTimeout(bubble.t); bubble.t = setTimeout(closeBubble, 5000); }
function closeBubble(){ const b = $('bulle'); if(b) b.remove(); }
function faire(cid, k){
  const c = S.chars[cid], at = e => fx(c.x, c.y - sizeOf(cid, c.o).h - 10, e); found('geste');
  if(k === 'dodo'){ c.pose = 'sleep'; c.a = ''; drawChar(cid); at('💤'); tone(300, .8, 'sine', .05, 0, 200); save(); return; }
  if(c.pose === 'sleep' || c.pose === 'sit' || c.pose === 'bath'){ c.pose = ''; c.a = ''; }
  geste[cid] = { k, t0:Date.now() }; drawChar(cid); const el = decoEl(cid); if(el){ el.classList.remove('g-salut', 'g-danse', 'g-saut', 'g-bravo', 'g-bisou'); void el.offsetWidth; el.classList.add('g-' + k); }
  if(k === 'salut'){ voix(cid) || say(pick(['Coucou !', 'Salut !', 'Bonjour !'])); at('👋'); }
  if(k === 'danse'){ sfx.tune(); [0, 1, 2].forEach(i => setTimeout(() => at(pick(['🎵', '🎶', '✨'])), i * 600)); found('danse'); }
  if(k === 'saut'){ tone(330, .2, 'square', .06, 0, 700); at('⭐'); }
  if(k === 'bravo'){ [0, 1, 2, 3].forEach(i => setTimeout(() => noise(.06, .12, 2500), i * 180)); at('👏'); }
  if(k === 'bisou'){ tone(1200, .15, 'sine', .07, 0, 1600); at('💋'); setTimeout(() => at('💕'), 300); }
  const dur = k === 'danse' ? 3600 : 1800, t0 = geste[cid].t0;
  if(k === 'danse'){ const tick = () => { if(!geste[cid] || geste[cid].t0 !== t0) return; geste[cid].fr = geste[cid].fr === 1 ? 2 : 1; drawChar(cid); setTimeout(tick, 330); }; tick(); }
  setTimeout(() => { if(geste[cid] && geste[cid].t0 === t0){ delete geste[cid]; const e2 = decoEl(cid); if(e2) e2.classList.remove('g-' + k); drawChar(cid); } }, dur); }
// image du geste (si elle existe pour ce personnage et cette tenue) : remplace le corps debout
function gesteBody(cid){ const g = geste[cid]; if(!g || !(g.k in GFR)) return null; const c = S.chars[cid], o = OUTFITS[c.o] ? c.o : 'ville', G = GMETA[cid] && GMETA[cid][o]; if(!G) return null;
  const st = sizeOf(cid, o), h = st.h * G[3], w = h * G[0] / G[1], fr = g.k === 'danse' ? (g.fr || 1) : GFR[g.k];
  return { w, h, fx:G[2], gy:G[4] || 1, html:`<div class="body" style="background-image:url(houma/g-${cid}${o === 'ville' ? '' : '-' + o}.webp);background-size:500% 100%;background-position:${fr * 25}% 0"></div><i class="shade"></i>` }; }
