<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Les bruitages</title>
<style>
  body{ margin:0; font:16px/1.4 system-ui, sans-serif; background:#fbf6ec; color:#2a1f1a; }
  main{ max-width:760px; margin:0 auto; padding:16px; }
  h1{ font-size:26px; margin:8px 0 4px; } p{ margin:4px 0 14px; color:#5b4a3f; }
  h2{ font-size:18px; margin:22px 0 8px; }
  .s{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px; border-radius:12px; background:#fff; margin:6px 0; box-shadow:0 1px 3px #0001; }
  .s b{ flex:1 1 180px; } .s small{ display:block; font-weight:400; color:#7a685b; }
  button{ min-width:52px; min-height:48px; border:0; border-radius:10px; background:#efe3cf; font:inherit; font-weight:700; cursor:pointer; }
  button.on{ background:#0f766e; color:#fff; }
  a{ color:#0f766e; }
</style>
</head>
<body>
<main>
  <a href="../../index.html">← Accueil</a>
  <h1>Les bruitages du Jasmin et de Ma Houma</h1>
  <p>Chaque son existe en 4 versions. La version en vert est celle du jeu. Si une autre vous plaît plus, dites simplement à Claude « pièce 3 » ou « miaou 2 ».</p>
  <div id="liste"></div>
</main>
<script>
const NOMS = { saut:'saut', atterrir:'atterrissage', piece:'pièce', gemme:'gemme', brique:'brique cassée', bonus:'bonus', ecrase:'ennemi écrasé', aie:'aïe', feu:'boule de feu', ressort:'ressort', lampe:'lampe magique', boss:'boss', portail:'portail', plouf:'plouf', chute:'chute lourde', victoire:'victoire',
  prendre:'prendre', poser:'poser', 'porte-ouvre':'ouvrir', 'porte-ferme':'fermer', eau:'eau', croque:'croque', gorgee:'gorgée', doum:'darbouka doum', tek:'darbouka tek', miaou:'miaou', oiseau:'oiseau', habit:'habit', etoile:'étoile',
  'amb-souk':'ambiance souk', 'amb-plage':'ambiance plage', 'amb-cafe':'ambiance café', 'amb-ecole':'ambiance école', 'amb-dar':'ambiance maison' };
let a = null;
fetch('choix.json?' + Date.now()).then(r => r.json()).then(C => {
  const L = document.getElementById('liste'); let jeu = '';
  Object.keys(C).forEach(k => {
    const [g, ...r] = k.split('-'), n = r.join('-');
    if(g !== jeu){ jeu = g; L.insertAdjacentHTML('beforeend', `<h2>${g === 'jasmin' ? 'La Légende du Jasmin' : 'Ma Houma'}</h2>`); }
    L.insertAdjacentHTML('beforeend', `<div class="s"><b>${NOMS[n] || n}</b>${[1, 2, 3, 4].map(i => `<button class="${C[k] === i ? 'on' : ''}" data-f="variantes/${k}-${i}.mp3">${i}</button>`).join('')}</div>`);
  });
  L.onclick = e => { const b = e.target.closest('button'); if(!b) return; if(a) a.pause(); a = new Audio(b.dataset.f); a.play(); };
});
</script>
</body>
</html>
