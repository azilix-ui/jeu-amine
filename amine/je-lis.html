<style>
/* Je lis ! (13/11/2026) : Amine (5 ans, grande section) apprend à lire avec la méthode des sons, comme à l'école.
   4 étapes : les voyelles, les sons qui chantent (consonnes), les syllabes (M + A = MA), les premiers mots (dont les prénoms de la famille).
   Tout est dit à voix haute : voix de l'appareil (français) en attendant des voix enregistrées (lire/voix/<id>.mp3 si le fichier existe).
   La police Andika est faite pour les enfants qui apprennent à lire (a et g comme à l'école).
   Sauvegarde « amine-lecture » {stars:{etape:n}, best:{etape:n}, tickets, rounds, t}, cours « amine-lecture » (tickets pour la Boutique du savoir). */
:root{ --ciel:#1b3a5c; --panel:rgba(255,255,255,.96); --ink:#1b1533; --gold:#ffd23f; --mint:#3ddc97; --pink:#ff5fa8; --sky:#5cc8f5; --orange:#ff9a3d; --bad:#ff6b6b; --shadow:0 7px 0 rgba(0,0,0,.25);
  --lettre:'Andika','Baloo 2',Nunito,sans-serif }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:Nunito,system-ui,sans-serif;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(1200px 700px at 50% 120%,#3f8fb8 0,transparent 60%),linear-gradient(180deg,#14284a,#1b3a5c 55%,#2b5f86)}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;background:none}
h1,h2{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;margin:0;line-height:1.05}
#nuages{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#nuages i{position:absolute;font-style:normal;opacity:.18;animation:vole linear infinite}
@keyframes vole{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));gap:14px}
.scr.on{display:flex}
.haut{display:flex;align-items:center;gap:10px}
.rond{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.25);border:3px solid #fff4;font-size:26px;display:grid;place-items:center;box-shadow:var(--shadow);flex:none;text-decoration:none;color:#fff}
.rond:active,.carte:active,.choix:active,.go:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.etoiles{margin-left:auto;background:rgba(0,0,0,.25);border-radius:999px;padding:8px 16px;font-size:22px}
/* menu */
#menu h1{font-size:clamp(46px,11vw,84px);text-align:center;text-shadow:0 5px 0 rgba(0,0,0,.25)}
#menu h1 span{color:var(--gold)}
#menu .sous{text-align:center;margin:-6px 0 0;font-size:20px;color:#d5ecff}
.cartes{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:center;max-width:900px;width:100%;margin:0 auto}
@media (max-width:560px){.cartes{grid-template-columns:1fr}}
.carte{background:var(--c);border-radius:28px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);text-align:left;min-height:112px;position:relative}
.carte .lg{font-family:var(--lettre);font-weight:700;font-size:44px;background:#fff;color:var(--c);width:84px;height:84px;border-radius:22px;display:grid;place-items:center;flex:none;line-height:1}
.carte b{font-size:24px;display:block;line-height:1.1}.carte small{font-size:18px;opacity:.95}
/* jeu */
#jeu .barre{flex:1;display:flex;gap:6px}.barre i{flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.25)}.barre i.ok{background:var(--mint)}.barre i.la{background:var(--gold)}
.tableau{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px);min-height:0}
.consigne{background:var(--panel);color:var(--ink);border-radius:26px;padding:14px 22px;font-size:clamp(20px,4vw,28px);text-align:center;box-shadow:var(--shadow);max-width:760px;display:flex;align-items:center;gap:12px}
.consigne .hp{font-size:30px;flex:none}
.modele{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.img{font-size:clamp(70px,16vw,130px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.img img{width:clamp(90px,20vw,150px);height:clamp(90px,20vw,150px);border-radius:50%;object-fit:cover;border:5px solid #fff}
.mot{font-family:var(--lettre);font-weight:700;font-size:clamp(46px,11vw,96px);letter-spacing:2px;display:flex;gap:6px;align-items:baseline}
.mot button{padding:0 8px;border-radius:16px;background:rgba(255,255,255,.12)}
.mot .s0{color:#ffd23f}.mot .s1{color:#7fe3ff}.mot .s2{color:#ffa3cf}
.fusion{display:flex;align-items:center;gap:clamp(8px,2vw,22px);font-family:var(--lettre);font-weight:700;font-size:clamp(56px,13vw,110px)}
.fusion .l{background:#fff;color:var(--ink);border-radius:22px;padding:0 22px;box-shadow:var(--shadow);transition:transform .6s}
.fusion .plus{opacity:.8;font-size:.6em}
.fusion.colle .l1{transform:translateX(30%)}.fusion.colle .l2{transform:translateX(-30%)}
.choixs{display:flex;gap:clamp(10px,2.4vw,18px);flex-wrap:wrap;justify-content:center;max-width:900px}
.choix{background:#fff;color:var(--ink);border-radius:26px;min-width:clamp(110px,22vw,170px);min-height:clamp(100px,18vh,150px);padding:10px 18px;box-shadow:var(--shadow);display:grid;place-items:center;font-family:var(--lettre);font-weight:700;font-size:clamp(46px,10vw,84px);line-height:1}
.choix.em{font-family:inherit;font-size:clamp(56px,12vw,96px)}
.choix.non{background:#ffd3d3;animation:non .4s}.choix.oui{background:#bff5d6;transform:scale(1.08)}
@keyframes non{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.choix:disabled{opacity:.45}
.minus .l,.minus .choix:not(.em),.minus .mot{text-transform:lowercase}
/* fin */
#fin{align-items:center;justify-content:center;text-align:center}
#fin .gros{font-size:110px;line-height:1}
#fin h2{font-size:clamp(40px,9vw,64px)}
#fin p{font-size:24px;margin:0;color:#d5ecff}
.go{background:var(--mint);color:#0d2a1d;border-radius:24px;padding:16px 36px;font-size:28px;box-shadow:0 7px 0 #1f9e66}
.reglage{display:flex;gap:8px;justify-content:center;align-items:center;font-size:18px;color:#d5ecff}
.reglage button{background:rgba(0,0,0,.25);border-radius:999px;padding:8px 16px;min-height:48px}.reglage button.on{background:var(--gold);color:#3a2600}

.voixback{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.75);display:grid;place-items:center;padding:16px}
.voixbox{background:#fff;color:var(--ink);border-radius:30px;padding:22px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.voixbox h2{text-align:center;font-size:32px}
.vx{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border-radius:22px;background:#eef4fb;text-align:left;min-height:72px}
.vx .ic{font-size:40px}.vx b{display:block;font-size:22px}.vx small{font-size:16px;color:#4b5b72;font-weight:600}
.vx.on{background:#fff2c4;outline:4px solid var(--gold)}
.vx.non{opacity:.45}
#fete{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fete i{position:absolute;top:-60px;font-style:normal;animation:tombe 2.2s ease-in forwards}
@keyframes tombe{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#nuages i,#fete i{animation:none;display:none}}
</style>
</head>
<body>
<div id="nuages" aria-hidden="true"></div>
<div id="fete" aria-hidden="true"></div>

<section class="scr on" id="menu">
  <div class="haut"><a class="rond" href="./" aria-label="Retour aux jeux d'Amine">←</a><span class="etoiles" id="mEt">⭐ 0</span></div>
  <h1>Je lis<span> !</span></h1>
  <p class="sous">Les sons, les syllabes, puis les premiers mots.</p>
  <div class="cartes" id="cartes"></div>
  <div class="reglage"><span>Lettres :</span><button data-casse="maj" type="button">MAJUSCULES</button><button data-casse="min" type="button">minuscules</button><button id="bVoix" type="button">🔊 La voix</button></div>
</section>

<section class="scr" id="jeu">
  <div class="haut"><button class="rond" id="retour" type="button" aria-label="Retour au menu">←</button><div class="barre" id="barre"></div><button class="rond" id="redis" type="button" aria-label="Réécouter">🔊</button></div>
  <div class="tableau" id="tableau"></div>
</section>

<div class="voixback" id="voixBox" hidden><div class="voixbox" role="dialog" aria-modal="true" aria-label="Choisir la voix"><h2>Qui lit avec Amine ?</h2><div id="voixListe"></div><button class="go" id="voixOk" type="button">C'est parti !</button></div></div>

<section class="scr" id="fin">
  <div class="gros" id="fGros">⭐</div>
  <h2 id="fTitre">Bravo Amine !</h2>
  <p id="fTexte"></p>
  <button class="go" id="fOk" type="button">Encore !</button>
  <button class="rond" id="fMenu" type="button" style="margin-top:6px" aria-label="Menu">☰</button>
</section>

<script src="../famille.js"></script>
<script src="lire/voix.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'amine-lecture', PLAYER = 'Amine', TOUR = 6;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const mele = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- les mots et les images ---------- */
// voyelles : [lettre, son à dire, [image, mot]…]
const VOY = [['A', 'a', [['🍍', 'ananas'], ['✈️', 'avion'], ['🐝', 'abeille']]], ['É', 'é', [['🐘', 'éléphant'], ['🏫', 'école'], ['⭐', 'étoile']]], ['I', 'i', [['🏝️', 'île'], ['🦎', 'iguane']]],
             ['O', 'o', [['🍊', 'orange'], ['🦴', 'os'], ['🐋', 'orque']]], ['U', 'u', [['🏭', 'usine']]], ['Y', 'i grec', [['🪀', 'yoyo']]]];
// consonnes : [lettre, son « qui chante » à dire, [image, mot]…]
const CONS = [['M', 'mmmmm', [['🏍️', 'moto'], ['🏠', 'maison'], ['✋', 'main'], ['🐑', 'mouton']]], ['L', 'llllll', [['🌙', 'lune'], ['🦁', 'lion'], ['🐰', 'lapin'], ['🥛', 'lait']]],
  ['R', 'rrrrrr', [['🤖', 'robot'], ['🦊', 'renard'], ['🌹', 'rose'], ['🤴', 'roi']]], ['S', 'sssssss', [['🐍', 'serpent'], ['☀️', 'soleil'], ['🎄', 'sapin'], ['🥗', 'salade']]],
  ['F', 'ffffff', [['🚀', 'fusée'], ['🌸', 'fleur'], ['🍓', 'fraise'], ['🔥', 'feu']]], ['N', 'nnnnnn', [['👃', 'nez'], ['🪺', 'nid'], ['☁️', 'nuage']]],
  ['V', 'vvvvvv', [['🐄', 'vache'], ['🚲', 'vélo'], ['🚗', 'voiture']]], ['CH', 'chhhhh', [['🐱', 'chat'], ['🐶', 'chien'], ['🎩', 'chapeau']]],
  ['P', 'pe', [['🍎', 'pomme'], ['🐟', 'poisson'], ['🦋', 'papillon']]], ['T', 'te', [['🐢', 'tortue'], ['🍅', 'tomate'], ['🚂', 'train']]], ['B', 'be', [['🎈', 'ballon'], ['⛵', 'bateau'], ['🍌', 'banane']]]];
const SYLC = ['M', 'L', 'R', 'S', 'F', 'P', 'T', 'N', 'V'], SYLV = ['A', 'I', 'O', 'U', 'É'];
// mots : syllabes, image (emoji, ou avatar de la famille), mot à dire
const MOTS = [[['PA', 'PA'], '👨', 'papa'], [['MA', 'MAN'], '👩', 'maman'], [['MO', 'TO'], '🏍️', 'moto'], [['LA', 'MA'], '🦙', 'lama'], [['VÉ', 'LO'], '🚲', 'vélo'],
  [['RO', 'BOT'], '🤖', 'robot'], [['TO', 'MA', 'TE'], '🍅', 'tomate'], [['SA', 'LA', 'DE'], '🥗', 'salade'], [['BA', 'NA', 'NE'], '🍌', 'banane'], [['LI', 'MA', 'CE'], '🐌', 'limace'],
  [['PI', 'RA', 'TE'], '🏴‍☠️', 'pirate'], [['LU', 'NE'], '🌙', 'lune'], [['MI', 'NOU'], '🐱', 'minou'],
  [['A', 'MI', 'NE'], '@amine', 'Amine'], [['SAL', 'MA'], '@salma', 'Salma'], [['ES', 'SIL'], '@essil', 'Essil'], [['I', 'MEN'], '@imen', 'Imen'], [['A', 'NIS'], '@anis', 'Anis']];
const ETAPES = [
  { id:'voy', nom:'Les voyelles', lg:'A', c:'#ff5fa8', dit:'Les voyelles' },
  { id:'cons', nom:'Les sons qui chantent', lg:'M', c:'#ff9a3d', dit:'Les sons qui chantent' },
  { id:'syl', nom:'Les syllabes', lg:'MA', c:'#3ddc97', dit:'Les syllabes' },
  { id:'mot', nom:'Mes premiers mots', lg:'PAPA', c:'#5cc8f5', dit:'Mes premiers mots' } ];

/* ---------- sauvegarde ---------- */
let S = { v:1, t:0, stars:{}, best:{}, tickets:0, rounds:0, casse:'maj' };
try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && typeof d === 'object') S = Object.assign(S, d); }catch(e){}
function save(){ S.t = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const total = () => Object.values(S.stars).reduce((a, b) => a + (+b || 0), 0);

/* ---------- la voix ----------
   Des voix enregistrées avec ElevenLabs (lire/voix/<voix>/<clé>.mp3, la liste est dans lire/voix.js), une phrase courte par fichier,
   enchaînées une par une. Réglage ⚙️ : choisir la voix (Lulu, Papi Olivier, Jon le conteur) ou la voix de la tablette.
   Sans fichier pour une phrase : la voix française de la tablette. */
const VOIX = [{ id:'lulu', nom:'Lulu', desc:'joyeuse, comme dans un dessin animé', ic:'🧚' }, { id:'olivier', nom:'Papi Olivier', desc:'un grand-père rigolo', ic:'👴' }, { id:'jon', nom:'Jon le conteur', desc:'douce et calme', ic:'📚' }, { id:'tablette', nom:'La voix de la tablette', desc:'toujours disponible', ic:'📱' }];
const cle = t => String(t).toLowerCase().replace(/é/g, 'ee').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
const DISPO = window.LIRE_VOIX || {};
if(!S.voix || !VOIX.some(v => v.id === S.voix)) S.voix = DISPO.lulu ? 'lulu' : 'tablette';
let VTAB = null;
function choisitVoix(){ const v = (window.speechSynthesis && speechSynthesis.getVoices && speechSynthesis.getVoices()) || []; const fr = v.filter(x => /^fr/i.test(x.lang)); VTAB = fr.find(x => /Amélie|Audrey|Marie|Google français|Denise|Thomas/i.test(x.name)) || fr.find(x => /FR/.test(x.lang)) || fr[0] || null; }
if(window.speechSynthesis){ choisitVoix(); speechSynthesis.onvoiceschanged = choisitVoix; }
let file = [], dernier = [], joueur = null, jeton = 0;
const cache = {};
function fichier(t){ const k = cle(t), v = S.voix; return v !== 'tablette' && DISPO[v] && DISPO[v].includes(k) ? `lire/voix/${v}/${k}.mp3?v=1` : null; }
function precharge(liste){ liste.forEach(t => { const f = fichier(t); if(f && !cache[f]){ const a = new Audio(); a.preload = 'auto'; a.src = f; cache[f] = a; } }); }
function stop(){ jeton++; file = []; if(joueur){ try{ joueur.pause(); }catch(e){} joueur.onended = joueur.onerror = null; joueur = null; } try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} }
function parle(liste, garde){
  if(garde !== false) dernier = liste.slice();
  stop(); file = liste.slice(); precharge(file); const j = jeton;
  setTimeout(() => { if(j === jeton) suivant(j); }, 80);   // laisser la voix précédente s'arrêter vraiment (sinon la suivante était coupée)
}
function suivant(j){
  if(j !== jeton) return;
  const t = file.shift(); if(t === undefined) return;
  const f = fichier(t), fin = () => { if(j === jeton) setTimeout(() => suivant(j), 120); };
  if(f){
    const a = cache[f] || new Audio(f); cache[f] = a; joueur = a; a.currentTime = 0;
    a.onended = fin; a.onerror = () => { tts(t, fin); };
    const p = a.play(); if(p && p.catch) p.catch(() => tts(t, fin));
    return;
  }
  tts(t, fin);
}
// la voix de la tablette, avec un garde-fou : si elle ne dit rien (onend jamais appelé), on passe à la suite
function tts(t, fin){
  if(!window.speechSynthesis){ fin(); return; }
  try{
    const u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; if(VTAB) u.voice = VTAB; u.rate = /^[a-zé]{1,3}$|^([a-z])\1+$|h{3,}/i.test(t) ? .7 : .9; u.pitch = 1.05;
    let fait = false; const ok = () => { if(fait) return; fait = true; clearTimeout(g); fin(); };
    const g = setTimeout(ok, 1500 + t.length * 110);
    u.onend = ok; u.onerror = ok;
    speechSynthesis.speak(u);
    if(speechSynthesis.paused) speechSynthesis.resume();
  }catch(e){ fin(); }
}
// petits sons
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === 'suspended') AC.resume(); return AC; }
function ton(f, d = .15, type = 'triangle', vol = .14, when = 0){ if(!audio()) return; const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); }
const sfx = { oui(){ [523, 659, 784].forEach((f, k) => ton(f, .2, 'triangle', .14, k * .08)); }, non(){ ton(220, .22, 'sawtooth', .06); }, tape(){ ton(660, .06, 'triangle', .08); } };

/* ---------- décor ---------- */
(function(){ const n = $('nuages'); for(let i = 0; i < 7; i++){ const c = document.createElement('i'); c.textContent = '☁️'; c.style.top = (4 + i * 12) + '%'; c.style.fontSize = (60 + Math.random() * 70) + 'px'; c.style.animationDuration = (40 + Math.random() * 40) + 's'; c.style.animationDelay = (-Math.random() * 60) + 's'; n.appendChild(c); } })();
function fete(){ const F = $('fete'); for(let i = 0; i < 28; i++){ const s = document.createElement('i'); s.textContent = pick(['⭐', '✨', '📖', '🌟', '🎉']); s.style.left = Math.random() * 100 + 'vw'; s.style.fontSize = 24 + Math.random() * 30 + 'px'; s.style.animationDelay = Math.random() * .6 + 's'; F.appendChild(s); setTimeout(() => s.remove(), 3200); } }

/* ---------- écrans ---------- */
function ecran(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
function casse(){ document.body.classList.toggle('minus', S.casse === 'min'); document.querySelectorAll('[data-casse]').forEach(b => b.classList.toggle('on', b.dataset.casse === S.casse)); }
function menu(dire){
  ecran('menu'); $('mEt').textContent = '⭐ ' + total(); casse();
  $('cartes').innerHTML = ETAPES.map((e, i) => `<button class="carte" data-e="${i}" style="--c:${e.c}" type="button"><span class="lg" style="font-size:${e.lg.length > 2 ? 26 : e.lg.length > 1 ? 38 : 48}px">${e.lg}</span><span><b>${i + 1}. ${e.nom}</b><small>${'⭐'.repeat(Math.min(5, S.stars[e.id] || 0)) || '☆ à découvrir'}${(S.stars[e.id] || 0) > 5 ? ' ×' + S.stars[e.id] : ''}</small></span></button>`).join('');
  $('cartes').querySelectorAll('.carte').forEach(b => b.onclick = () => { audio(); sfx.tape(); joue(+b.dataset.e); });
  if(dire) parle(['Je lis ! Choisis un jeu.']);
}
function menuVoix(){
  $('voixListe').innerHTML = VOIX.map(v => { const ok = v.id === 'tablette' || DISPO[v.id]; return `<button class="vx${v.id === S.voix ? ' on' : ''}${ok ? '' : ' non'}" data-v="${v.id}" type="button"><span class="ic">${v.ic}</span><span><b>${v.nom}</b><small>${ok ? v.desc : 'bientôt'}</small></span></button>`; }).join('');
  $('voixListe').querySelectorAll('.vx').forEach(b => b.onclick = () => { const v = b.dataset.v; if(v !== 'tablette' && !DISPO[v]) return; S.voix = v; save(); sfx.tape(); menuVoix(); parle(['Bonjour Amine !', 'On lit ensemble ?']); });
  $('voixBox').hidden = false;
}
$('bVoix').onclick = () => { audio(); menuVoix(); };
$('voixOk').onclick = () => { $('voixBox').hidden = true; stop(); };
document.querySelectorAll('[data-casse]').forEach(b => b.onclick = () => { S.casse = b.dataset.casse; save(); casse(); sfx.tape(); });

/* ---------- les questions ---------- */
const imgHTML = i => i[0] === '@' ? `<img src="/jeux/avatars/${i.slice(1)}.webp" alt="">` : i;
function question(e){
  if(e === 'voy'){
    const [L, son, ims] = pick(VOY), [im, mot] = pick(ims);
    if(Math.random() < .5) return { consigne:'Touche la lettre ' + L, dit:['Touche la lettre', son], modele:'', choix:mele([L].concat(mele(VOY.map(v => v[0]).filter(x => x !== L)).slice(0, 2))), bonne:L, apres:[son, 'comme', mot] };
    return { consigne:'Quelle lettre on entend au début ?', dit:[mot, 'Quelle lettre on entend au début de ce mot ?'], modele:`<div class="modele"><span class="img">${im}</span></div>`, choix:mele([L].concat(mele(VOY.map(v => v[0]).filter(x => x !== L)).slice(0, 2))), bonne:L, apres:[son, 'comme', mot] };
  }
  if(e === 'cons'){
    const [L, son, ims] = pick(CONS), [im, mot] = pick(ims), autres = mele(CONS.filter(c => c[0] !== L)).slice(0, 2).map(c => pick(c[2]));
    if(Math.random() < .5) return { consigne:'Quel mot commence par ' + L + ' ?', dit:['Écoute :', son, 'Quel mot commence par ce son ?'], modele:`<div class="fusion"><span class="l">${L}</span></div>`, choix:mele([[im, mot]].concat(autres)).map(x => x[0]), em:true, bonne:im, apres:[mot, 'commence par', son] };
    return { consigne:'Par quelle lettre commence ce mot ?', dit:[mot, 'Par quelle lettre commence ce mot ?'], modele:`<div class="modele"><span class="img">${im}</span></div>`, choix:mele([L].concat(mele(CONS.map(c => c[0]).filter(x => x !== L)).slice(0, 2))), bonne:L, apres:[mot, 'commence par', son] };
  }
  if(e === 'syl'){
    const c = pick(SYLC), v = pick(c === 'V' || c === 'F' ? ['A', 'I', 'O', 'É'] : SYLV), sy = c + v, lu = sy.toLowerCase();
    const autres = mele(SYLC.flatMap(x => SYLV.map(y => x + y)).filter(x => x !== sy && (x[0] === c || x.slice(1) === v))).slice(0, 2);
    if(Math.random() < .45) return { fusion:[c, v], consigne:c + ' et ' + v + ', ça fait…', dit:[CONS.find(x => x[0] === c)[1], 'et', VOY.find(x => x[0] === v)[1], 'ça fait…'], choix:mele([sy].concat(autres)), bonne:sy, apres:[lu] };
    return { consigne:'Touche la syllabe que tu entends', dit:['Touche la syllabe que tu entends :', lu], modele:'', choix:mele([sy].concat(autres)), bonne:sy, apres:[lu] };
  }
  // mots : lis le mot (syllabe par syllabe), trouve l'image
  const m = pick(MOTS), autres = mele(MOTS.filter(x => x !== m && (x[1][0] === '@') === (m[1][0] === '@'))).slice(0, 2);
  return { mot:m[0], consigne:'Lis le mot, puis touche la bonne image', dit:['Lis le mot, puis touche la bonne image.'], choix:mele([m].concat(autres)).map(x => x[1]), em:true, img:true, bonne:m[1], apres:m[0].map(x => x.toLowerCase()).concat([m[2]]) };
}

/* ---------- une partie ---------- */
let E = 0, k = 0, bons = 0, Q = null, essais = 0;
function joue(i){ E = i; k = 0; bons = 0; ecran('jeu'); casse(); suivante(); }
function barre(){ $('barre').innerHTML = Array.from({ length:TOUR }, (_, i) => `<i class="${i < k ? 'ok' : i === k ? 'la' : ''}"></i>`).join(''); }
function suivante(){
  Q = question(ETAPES[E].id); essais = 0; barre();
  const T = $('tableau');
  let h = `<div class="consigne"><span class="hp" aria-hidden="true">🔊</span><span>${Q.consigne}</span></div>`;
  if(Q.fusion) h += `<div class="fusion" id="fus"><span class="l l1">${Q.fusion[0]}</span><span class="plus">+</span><span class="l l2">${Q.fusion[1]}</span></div>`;
  else if(Q.mot) h += `<div class="mot">${Q.mot.map((s, i) => `<button type="button" class="s${i % 3}" data-s="${s.toLowerCase()}">${s}</button>`).join('')}</div>`;
  else h += Q.modele;
  h += `<div class="choixs">${Q.choix.map(c => `<button type="button" class="choix${Q.em ? ' em' : ''}" data-c="${c}">${Q.img ? imgHTML(c) : c}</button>`).join('')}</div>`;
  T.innerHTML = h;
  if(Q.img) T.querySelectorAll('.choix img').forEach(im => { im.style.cssText = 'width:clamp(80px,17vw,130px);height:clamp(80px,17vw,130px);border-radius:50%;object-fit:cover'; });
  T.querySelector('.consigne').onclick = () => parle(dernier, false);
  T.querySelectorAll('.mot button').forEach(b => b.onclick = () => { sfx.tape(); parle([b.dataset.s], false); });
  T.querySelectorAll('.choix').forEach(b => b.onclick = () => repond(b));
  parle(Q.dit);
  if(Q.fusion) setTimeout(() => { const f = $('fus'); if(f) f.classList.add('colle'); }, 1600);
}
function repond(b){
  audio();
  if(b.dataset.c === Q.bonne){
    b.classList.add('oui'); sfx.oui(); if(!essais) bons++;
    document.querySelectorAll('.choix').forEach(x => x.disabled = x !== b);
    parle(Q.apres.concat([pick(['Bravo !', 'Super !', 'Oui !', 'Bien joué !'])]));
    setTimeout(() => { k++; k < TOUR ? suivante() : fin(); }, 2600);
  } else {
    essais++; b.classList.add('non'); b.disabled = true; sfx.non();
    parle(['Essaie encore !'].concat(Q.dit.length > 1 ? Q.dit.slice(-2) : Q.dit), false);
  }
}
function fin(){
  const e = ETAPES[E], gagne = bons >= TOUR - 1; S.rounds++;
  S.best[e.id] = Math.max(S.best[e.id] || 0, bons);
  if(gagne){ S.stars[e.id] = (S.stars[e.id] || 0) + 1; S.tickets = (S.tickets || 0) + 2; }
  save(); ecran('fin');
  $('fGros').textContent = gagne ? '⭐' : '💪';
  $('fTitre').textContent = gagne ? 'Bravo Amine !' : 'Bien essayé, Amine !';
  $('fTexte').textContent = bons + ' bonnes réponses sur ' + TOUR + (gagne ? ' du premier coup : une étoile ⭐ et 2 tickets 🎟️ !' : '. Encore une fois pour gagner l\'étoile ?');
  if(gagne) fete();
  parle([gagne ? 'Bravo Amine ! Tu gagnes une étoile !' : 'Bien essayé ! On recommence ?']);
}
$('fOk').onclick = () => { sfx.tape(); joue(E); };
$('fMenu').onclick = () => menu(false);
$('retour').onclick = () => { stop(); menu(false); };
$('redis').onclick = () => parle(dernier, false);
menu(false);
document.addEventListener('pointerdown', function premier(){ document.removeEventListener('pointerdown', premier); audio(); }, { once:true });
if(window.Famille){
  Famille.load('amine-lecture', PLAYER).then(d => { const r = d && d[KEY]; if(r && (r.t || 0) > (S.t || 0)){ S = Object.assign(S, r); save(); menu(false); } });
  Famille.track('amine-lecture', PLAYER, [KEY]);
}
</script>
</body>
