<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missaoui">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/site.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14102b">
<title>La Planète des Nombres</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%91%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* La Planète des Nombres : Amine (5 ans, grande section) joue avec les nombres de 0 à 60 chez les aliens.
   Cinq jeux, tout est dit à voix haute (voix de Julian, Higgsfield) : compter, reconnaître un nombre,
   le nombre d'après ou d'avant, le plus grand ou le plus petit, donner le bon nombre d'étoiles.
   Images (aliens, soucoupe, décor) : Higgsfield. Sauvegarde : « amine-nombres » (tablette + serveur). */
:root{ --night:#14102b; --panel:rgba(28,22,66,.9); --ink:#fff; --mist:#c9c2ee; --gold:#ffd23f; --mint:#3ddc97; --pink:#ff5fa8; --sky:#5cc8f5; --bad:#ff6b6b; --shadow:0 7px 0 rgba(0,0,0,.35) }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;background:none}
h1,h2{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;margin:0;line-height:1.05}
body::before{content:"";position:fixed;inset:0;background:#14102b url(nombres/fond.webp) center/cover}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#sky i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.scr.on{display:flex}
.round{width:60px;height:60px;border-radius:50%;background:var(--panel);border:3px solid #fff3;font-size:26px;display:grid;place-items:center;box-shadow:var(--shadow);flex:none;text-decoration:none;color:#fff}
.round:active,.card:active,.num:active,.go:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
/* accueil */
#home{align-items:center;justify-content:flex-end;gap:14px;background:#14102b url(nombres/titre.webp) center/cover;padding-bottom:max(26px,env(safe-area-inset-bottom))}
#home::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,43,.55) 0%,rgba(20,16,43,0) 34%,rgba(20,16,43,0) 62%,rgba(20,16,43,.8) 100%)}
#home > *{position:relative}
#home h1{position:absolute;top:max(70px,12vh);left:0;right:0;text-align:center;font-size:clamp(40px,9vw,92px);text-shadow:0 5px 0 #3b1d8a,0 12px 30px #000a}
#home h1 span{color:var(--gold)}
#home .corner{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px}
.go{min-width:min(420px,84vw);min-height:92px;border-radius:46px;background:var(--mint);color:#07301f;font-family:"Baloo 2";font-size:clamp(30px,6vw,44px);box-shadow:0 10px 0 #1c8a5c;display:flex;align-items:center;justify-content:center;gap:14px;animation:pulse 1.6s ease-in-out infinite}
.go:active{box-shadow:0 4px 0 #1c8a5c}
@keyframes pulse{50%{transform:scale(1.05)}}
/* menu */
.top{display:flex;align-items:center;gap:10px;min-height:64px;flex:none}
.top h2{flex:1;min-width:0;font-size:clamp(22px,4.6vw,36px);text-shadow:0 3px 0 #0006;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{background:var(--panel);border-radius:30px;padding:8px 16px;font-size:24px;border:3px solid #fff3;font-family:"Baloo 2";flex:none}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:16px;align-content:safe center;overflow:auto;padding:10px 2px;max-width:1100px;width:100%;margin:0 auto}
.card{position:relative;border-radius:30px;background:var(--panel);border:4px solid var(--c);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;min-height:116px}
.card img{width:92px;height:92px;object-fit:contain;flex:none;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px #0006)}
.card:nth-child(2n) img{animation-delay:-1.2s}
.card b{display:block;font-family:"Baloo 2";font-size:25px;line-height:1.05}
.card small{display:block;font-size:22px;margin-top:4px;color:var(--gold)}
.card em{font-style:normal;font-size:34px;position:absolute;right:12px;top:8px}
@keyframes bob{50%{transform:translateY(-9px) rotate(2deg)}}
.lvl{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.lvl span{font-size:18px;color:var(--mist)}
.lvl button{min-width:58px;height:52px;border-radius:18px;background:var(--panel);border:3px solid #fff3;font-family:"Baloo 2";font-size:24px}
.lvl button.on{background:var(--gold);color:#3a2a00;border-color:#fff}
/* jeu */
.dots{display:flex;gap:8px;flex:1;justify-content:center}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff3;border:3px solid #fff5}
.dots i.ok{background:var(--mint)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--gold);transform:scale(1.25)}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#ask{flex:none;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:6px 0 4px;min-height:104px;align-items:center}
.num{min-width:112px;height:96px;padding:0 18px;border-radius:30px;background:#fff;color:#1c1640;font-family:"Baloo 2";font-size:60px;line-height:1;box-shadow:0 8px 0 #9aa0d8;display:grid;place-items:center;animation:pop .35s cubic-bezier(.2,1.6,.4,1) backwards}
.num:nth-child(2){animation-delay:.07s}.num:nth-child(3){animation-delay:.14s}.num:nth-child(4){animation-delay:.21s}
.num.right{background:var(--mint);box-shadow:0 8px 0 #1c8a5c;animation:yes .6s}
.num.wrong{background:#ffd0d0;animation:no .4s;opacity:.55}
@keyframes pop{from{transform:scale(0)}}
@keyframes yes{30%{transform:scale(1.25) rotate(-4deg)}60%{transform:scale(1.1) rotate(3deg)}}
@keyframes no{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.bubble{background:#fff;color:#1c1640;border-radius:28px;padding:6px 26px;font-family:"Baloo 2";font-size:clamp(54px,11vh,96px);line-height:1.1;box-shadow:0 8px 0 #0004;position:relative}
.hint{font-size:clamp(18px,3.2vw,26px);text-shadow:0 2px 0 #0008;text-align:center;margin:0}
/* compter */
.field{display:flex;flex-wrap:wrap;gap:1.4vmin;align-items:center;justify-content:center;max-width:min(980px,100%);max-height:100%;overflow:hidden;padding:4px}
.al{position:relative;width:var(--s);height:var(--s);animation:bob 2.2s ease-in-out infinite;animation-delay:var(--d);flex:none}
.al img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 5px #0007);pointer-events:none}
.al.hit img{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 6px 5px #0007)}
.al.hit{animation:hop .5s}
.al u{position:absolute;right:-4%;top:-6%;min-width:44%;height:44%;border-radius:50%;background:var(--gold);color:#3a2a00;font-family:"Baloo 2";font-size:calc(var(--s) * .26);display:grid;place-items:center;text-decoration:none;border:3px solid #fff;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes hop{35%{transform:translateY(-22%) scale(1.12)}}
/* soucoupes */
.ufos{display:flex;flex-wrap:wrap;gap:3vmin 4vmin;justify-content:center;align-items:center;max-width:1000px}
.ufo{position:relative;width:clamp(150px,26vmin,250px);aspect-ratio:1.9;background:url(nombres/ufo.webp) center/contain no-repeat;animation:fly 3s ease-in-out infinite,in .6s cubic-bezier(.2,1.2,.4,1) backwards;animation-delay:var(--d),var(--e);filter:drop-shadow(0 12px 10px #0008)}
.ufo b{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-family:"Baloo 2";font-size:clamp(44px,9vmin,84px);line-height:1;color:#0b1d4a;text-shadow:0 0 3px #fff,0 0 8px #fff,0 2px 0 #fff}
.ufo.right{animation:win .9s forwards}.ufo.wrong{animation:no .4s;opacity:.4}
@keyframes fly{50%{transform:translateY(-14px) rotate(-2deg)}}
@keyframes in{from{transform:translateX(120vw) rotate(20deg)}}
@keyframes win{30%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1.15)}}
/* suite */
.train{display:flex;align-items:center;gap:clamp(8px,2vw,22px);flex-wrap:wrap;justify-content:center}
.train .bubble.q{background:var(--gold);min-width:1.6em;text-align:center;animation:pulse 1.2s ease-in-out infinite}
.train .arrow{font-size:clamp(34px,7vh,60px)}
.train img{width:clamp(90px,20vh,170px);animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 6px 5px #0007)}
/* comparer */
.duel{display:flex;gap:clamp(8px,4vw,60px);align-items:flex-end;justify-content:center}
.duel .bubble{font-size:clamp(40px,min(11vh,13vw),96px);padding:4px clamp(10px,3vw,26px)}
.holder{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .4s cubic-bezier(.2,1.6,.4,1) backwards}
.holder:nth-child(2){animation-delay:.1s}.holder:nth-child(3){animation-delay:.2s}
.holder img{width:clamp(84px,min(24vh,26vw),210px);animation:bob 2.3s ease-in-out infinite;animation-delay:var(--d);filter:drop-shadow(0 6px 5px #0007);pointer-events:none}
.holder.right .bubble{background:var(--mint)}.holder.right img{animation:hop .5s 2}
.holder.wrong{opacity:.45}.holder.wrong .bubble{background:#ffd0d0}
/* donner des étoiles */
.feed{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;width:min(1000px,100%);max-height:100%}
.eater{display:flex;flex-direction:column;align-items:center;gap:6px}
.eater img{width:clamp(110px,24vh,200px);animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 6px 5px #0007)}
.eater.yum img{animation:hop .45s 3}
.plates{display:flex;flex-direction:column;gap:10px;min-width:0}
.plate,.tray{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;border-radius:26px;padding:10px;min-height:86px}
.plate{background:rgba(255,255,255,.16);border:4px dashed #fff8}
.tray{background:var(--panel);border:3px solid #fff3}
.st{width:clamp(44px,8vmin,62px);height:clamp(44px,8vmin,62px);font-size:clamp(34px,6.6vmin,50px);line-height:1;display:grid;place-items:center;animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
.okbtn{min-width:150px;height:92px;border-radius:30px;background:var(--mint);color:#07301f;font-size:50px;box-shadow:0 8px 0 #1c8a5c;display:grid;place-items:center}
.okbtn:active{transform:translateY(4px);box-shadow:0 4px 0 #1c8a5c}
/* fin de manche */
#end{align-items:center;justify-content:center;gap:16px;text-align:center}
#end h2{font-size:clamp(40px,9vw,80px);text-shadow:0 5px 0 #3b1d8a}
#end p{margin:0;font-size:clamp(34px,8vw,64px)}
#end .rocket{font-size:clamp(90px,22vh,170px);animation:shake .25s linear infinite}
#end.launch .rocket{animation:launch 1.6s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes shake{50%{transform:translate(2px,-2px) rotate(-43deg)}0%,100%{transform:rotate(-45deg)}}
@keyframes launch{0%{transform:rotate(-45deg)}100%{transform:translateY(-120vh) rotate(-45deg) scale(.6)}}
#end .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#end .go{min-width:230px;animation:none;font-size:30px;min-height:80px}
#end .go.alt{background:var(--sky);box-shadow:0 10px 0 #2a7fb4;color:#06243a}
#party{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
#party i{position:absolute;font-style:normal;top:-50px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(118vh) rotate(600deg)}}
@media (orientation:portrait){ .feed{grid-template-columns:1fr} .eater{flex-direction:row;justify-content:center} .card{min-height:98px} .card img{width:74px;height:74px} }
@media (max-height:520px){ .num{height:72px;font-size:46px;min-width:92px} #ask{min-height:80px} .round{width:50px;height:50px;font-size:22px} .top{min-height:54px} }
@media (prefers-reduced-motion:reduce){ .go,.card img,.al,.ufo,.holder img,.eater img,.train img,#sky i{animation:none} }
</style>
</head>
<body>
<div id="sky"></div>

<section id="home" class="scr on">
  <div class="corner"><a class="round" href="./" aria-label="Retour aux jeux d'Amine">←</a></div>
  <h1>La Planète <span>des Nombres</span></h1>
  <button class="go" id="play"><span aria-hidden="true">🚀</span> Jouer</button>
</section>

<section id="menu" class="scr">
  <div class="top"><button class="round" id="mBack" aria-label="Retour">←</button><h2>Choisis un jeu</h2><button class="round" id="mSay" aria-label="Répéter la consigne">🔊</button><span class="stars" id="mStars">⭐ 0</span></div>
  <div class="cards" id="cards"></div>
  <div class="lvl" id="lvl" aria-label="Pour les parents : jusqu'à quel nombre"></div>
</section>

<section id="game" class="scr">
  <div class="top"><button class="round" id="gBack" aria-label="Retour aux jeux">←</button><div class="dots" id="dots"></div><button class="round" id="gSay" aria-label="Répéter la consigne">🔊</button></div>
  <div id="stage"></div>
  <div id="ask"></div>
</section>

<section id="end" class="scr">
  <h2 id="eTitle">Bravo !</h2>
  <div class="rocket" aria-hidden="true">🚀</div>
  <p id="eStars"></p>
  <div class="row"><button class="go" id="eAgain">🔁 Encore</button><button class="go alt" id="eMenu">🪐 Autre jeu</button></div>
</section>
<div id="party"></div>

<script src="../famille.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'amine-nombres', PLAYER = 'Amine';
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ALIENS = ['a1', 'a2', 'a3', 'a4', 'a5', 'a6'], alien = k => `nombres/${k}.webp`;
const GAMES = [
  { id:'compte', name:'Compte les aliens', img:'a2', c:'#b06cff', say:['compte'] },
  { id:'trouve', name:'Trouve le nombre', img:'a4', c:'#5cc8f5', say:['trouve'] },
  { id:'suite',  name:'Le nombre d\'après', img:'a3', c:'#ff9a3d', say:['apres'] },
  { id:'grand',  name:'Le plus grand', img:'a6', c:'#ffd23f', say:['grand'] },
  { id:'donne',  name:'Donne des étoiles', img:'a5', c:'#ff5fa8', say:['donne'] } ];
const ROUND = 5;

/* ---------- sauvegarde ---------- */
let S = { v:1, t:0, max:50, wins:0, stars:{}, rounds:0 };
try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && typeof d === 'object') S = Object.assign(S, d); }catch(e){}
S.stars = S.stars || {}; if(![10, 20, 30, 40, 50, 60].includes(S.max)) S.max = 50;
function save(){ S.t = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const total = () => Object.values(S.stars).reduce((a, b) => a + (+b || 0), 0);

/* ---------- voix (fichiers mp3) et petits sons ---------- */
let AC = null, cur = null, queue = [], lastSay = [];
function audio(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .15, type = 'sine', vol = .15, slide = 0, when = 0){ if(!audio()) return; const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t + d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0008, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .03); }
const sfx = { tap(){ tone(620, .07, 'triangle', .1); }, blip(i){ tone(392 * Math.pow(1.06, i % 14), .14, 'sine', .16, 1.3); }, yes(){ [523, 659, 784, 1047].forEach((f, k) => tone(f, .22, 'triangle', .14, 1, k * .08)); }, no(){ tone(220, .2, 'sawtooth', .07, .6); }, zap(){ tone(300, .5, 'sine', .12, 4); tone(900, .4, 'triangle', .05, .3, .1); } };
function stopVoice(){ queue = []; if(cur){ cur.onended = cur.onerror = null; try{ cur.pause(); }catch(e){} cur = null; } }
function next(){ const n = queue.shift(); if(n === undefined){ cur = null; return; } cur = new Audio(`nombres/voix/${n}.mp3?v=1`); cur.onended = cur.onerror = next; cur.play().catch(() => { cur = null; queue = []; }); }
// dit une suite de petits fichiers : say(['trouve', 27]) = « Trouve le nombre… vingt-sept »
function say(list, remember){ stopVoice(); if(remember) lastSay = list.slice(); queue = list.map(String); next(); }
function sayAfter(list, ms){ setTimeout(() => say(list), ms); }

/* ---------- décor ---------- */
(function(){ const k = $('sky'); for(let i = 0; i < 46; i++){ const s = document.createElement('i'); s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 62 + '%'; s.style.animationDelay = -Math.random() * 3 + 's'; const z = 2 + Math.random() * 5; s.style.width = s.style.height = z + 'px'; k.appendChild(s); } })();
function party(n = 30, E = ['⭐', '✨', '🌟', '💫', '🪐']){ const P = $('party'); for(let i = 0; i < n; i++){ const s = document.createElement('i'); s.textContent = E[i % E.length]; s.style.left = Math.random() * 100 + 'vw'; s.style.fontSize = 20 + Math.random() * 30 + 'px'; s.style.animationDuration = 1.8 + Math.random() * 2 + 's'; s.style.animationDelay = Math.random() * .6 + 's'; P.appendChild(s); setTimeout(() => s.remove(), 5000); } }

/* ---------- écrans ---------- */
let scr = 'home';
function go(name){ scr = name; document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === name)); }
function showMenu(first){
  go('menu'); $('mStars').textContent = '⭐ ' + total();
  $('cards').innerHTML = GAMES.map(g => `<button class="card" data-g="${g.id}" style="--c:${g.c}"><img src="${alien(g.img)}" alt=""><div><b>${g.name}</b><small>${'⭐'.repeat(Math.min(5, S.stars[g.id] || 0)) || '☆'}${(S.stars[g.id] || 0) > 5 ? ' ' + S.stars[g.id] : ''}</small></div></button>`).join('');
  $('lvl').innerHTML = '<span>Jusqu\'à</span>' + [10, 20, 30, 40, 50, 60].map(n => `<button data-m="${n}" class="${n === S.max ? 'on' : ''}" aria-label="Jusqu'à ${n}">${n}</button>`).join('');
  say(first ? ['accueil'] : [], true); if(!first) lastSay = ['accueil'];
}
$('play').onclick = () => { audio(); sfx.zap(); showMenu(true); };
$('mBack').onclick = () => { sfx.tap(); stopVoice(); go('home'); };
$('mSay').onclick = () => say(lastSay.length ? lastSay : ['accueil']);
$('gSay').onclick = () => say(lastSay);
$('lvl').onclick = e => { const b = e.target.closest('[data-m]'); if(!b) return; S.max = +b.dataset.m; S.wins = 0; save(); sfx.tap(); showMenuQuiet(); say([S.max]); };
function showMenuQuiet(){ const l = lastSay; showMenu(false); lastSay = l; }
$('cards').onclick = e => { const b = e.target.closest('[data-g]'); if(b){ sfx.tap(); startGame(b.dataset.g); } };
$('gBack').onclick = () => { sfx.tap(); stopVoice(); clearTimeout(nextT); showMenu(false); };

/* ---------- une manche : 5 questions ---------- */
let G = null, nextT = null;
function startGame(id){ G = { id, i:0, res:[], q:null }; go('game'); ask(); }
function dots(){ $('dots').innerHTML = Array.from({ length:ROUND }, (_, k) => `<i class="${k < G.res.length ? (G.res[k] ? 'ok' : 'no') : k === G.i ? 'cur' : ''}"></i>`).join(''); }
function ask(){ dots(); $('stage').innerHTML = ''; $('ask').innerHTML = ''; G.tries = 0; G.locked = false; MAKE[G.id](); }
// fin d'une question : ok = trouvé du premier coup
function done(ok, delay = 1500){ G.locked = true; G.res.push(ok); dots(); clearTimeout(nextT); nextT = setTimeout(() => { G.i++; if(G.i >= ROUND) endRound(); else ask(); }, delay); }
function good(n){ sfx.yes(); party(14); say([pick(['bravo1', 'bravo2', 'bravo3', 'bravo4'])].concat(n === undefined ? [] : [n])); }
// réponses à choisir parmi des nombres
function choices(nums, right, opt = {}){
  const box = $('ask'); box.innerHTML = nums.map(n => `<button class="num" data-n="${n}">${n}</button>`).join('');
  box.onclick = e => { const b = e.target.closest('[data-n]'); if(!b || G.locked || b.classList.contains('wrong')) return; audio(); const n = +b.dataset.n;
    if(n === right){ b.classList.add('right'); if(opt.onRight) opt.onRight(); good(right); done(G.tries === 0, 1900); }
    else { G.tries++; b.classList.add('wrong'); sfx.no(); if(G.tries >= 2){ const r = box.querySelector(`[data-n="${right}"]`); r.classList.add('right'); if(opt.onRight) opt.onRight(); say(['rep', right]); done(false, 2600); } else say(['encore']); } };
}
// des nombres proches du bon, pour que le choix demande de bien regarder
function around(n, k, max){
  const set = new Set([n]), cand = shuffle([n - 1, n + 1, n - 2, n + 2, n - 10, n + 10, n >= 10 ? (n % 10) * 10 + Math.floor(n / 10) : -1, n + 3, n - 3, n + 11, n - 9]).filter(x => x >= 0 && x <= Math.max(max, 10) && x !== n);
  for(const c of cand){ if(set.size >= k) break; set.add(c); }
  while(set.size < k) set.add(rnd(0, Math.max(max, 10)));
  return shuffle([...set]);
}
// un nombre à travailler : surtout dans la dizaine la plus haute, un peu en dessous pour réviser
function target(lo = 0){ const M = S.max; return Math.random() < .65 ? rnd(Math.max(lo, M - 10), M) : rnd(lo, M); }

const MAKE = {
  /* 1. Compter des aliens : chaque alien touché reçoit son numéro, dit à voix haute */
  compte(){
    const cap = Math.min(S.max, 20), n = S.max <= 10 ? rnd(1, 10) : rnd(Math.max(3, cap - 12), cap), size = n <= 4 ? 26 : n <= 8 ? 20 : n <= 12 ? 16 : 12.5;
    $('stage').innerHTML = `<div class="field" id="field">${Array.from({ length:n }, () => `<button class="al" style="--s:min(${size}vmin,${size * .95}vh);--d:${-Math.random() * 2}s"><img src="${alien(pick(ALIENS))}" alt=""></button>`).join('')}</div>`;
    let c = 0; $('field').onclick = e => { const a = e.target.closest('.al'); if(!a || a.classList.contains('hit') || G.locked) return; audio(); c++; a.classList.add('hit'); a.insertAdjacentHTML('beforeend', `<u>${c}</u>`); sfx.blip(c); say([c]); };
    say(['compte', 'combien'], true);
    choices(around(n, 3, cap), n, { onRight(){ document.querySelectorAll('#field .al').forEach((a, k) => setTimeout(() => a.classList.add('hit'), k * 40)); } });
  },
  /* 2. Reconnaître un nombre entendu : la bonne soucoupe */
  trouve(){
    const n = target(), k = S.max <= 10 ? 3 : 4, nums = around(n, k, S.max);
    $('stage').innerHTML = `<div class="ufos" id="ufos">${nums.map((x, i) => `<button class="ufo" data-n="${x}" style="--d:${-i * .7}s;--e:${i * .12}s" aria-label="${x}"><b>${x}</b></button>`).join('')}</div><p class="hint">Écoute bien, puis touche la bonne soucoupe 🔊</p>`;
    say(['trouve', n], true); sfx.zap();
    $('ufos').onclick = e => { const b = e.target.closest('.ufo'); if(!b || G.locked || b.classList.contains('wrong')) return; audio();
      if(+b.dataset.n === n){ b.classList.add('right'); good(n); done(G.tries === 0, 1900); }
      else { G.tries++; b.classList.add('wrong'); sfx.no(); if(G.tries >= 2){ $('ufos').querySelector(`[data-n="${n}"]`).classList.add('right'); say(['rep', n]); done(false, 2600); } else say(['encore', 'trouve', n]); } };
  },
  /* 3. La suite des nombres : celui d'après, celui d'avant */
  suite(){
    const after = S.max <= 10 || Math.random() < .65, n = after ? Math.min(target(0), S.max - 1) : Math.max(1, target(1)), r = after ? n + 1 : n - 1, a = alien(pick(ALIENS));
    $('stage').innerHTML = `<div class="train">${after ? `<span class="bubble">${n}</span><span class="arrow">➡️</span><span class="bubble q">?</span>` : `<span class="bubble q">?</span><span class="arrow">➡️</span><span class="bubble">${n}</span>`}<img src="${a}" alt=""></div>`;
    say([after ? 'apres' : 'avant', n], true);
    choices(around(r, 3, S.max), r, { onRight(){ const q = document.querySelector('.train .q'); q.textContent = r; q.classList.remove('q'); q.style.background = 'var(--mint)'; } });
  },
  /* 4. Comparer : le plus grand (ou le plus petit) */
  grand(){
    const k = S.max <= 10 ? 2 : pick([2, 3, 3]), big = S.max <= 10 || Math.random() < .7, set = new Set(); while(set.size < k) set.add(Math.random() < .5 ? target() : rnd(0, S.max));
    const nums = [...set], r = big ? Math.max(...nums) : Math.min(...nums), al = shuffle(ALIENS);
    $('stage').innerHTML = `<div class="duel" id="duel">${nums.map((x, i) => `<button class="holder" data-n="${x}" aria-label="${x}"><span class="bubble">${x}</span><img src="${alien(al[i])}" alt="" style="--d:${-i * .8}s"></button>`).join('')}</div>`;
    say([big ? 'grand' : 'petit'], true);
    $('duel').onclick = e => { const b = e.target.closest('.holder'); if(!b || G.locked || b.classList.contains('wrong')) return; audio();
      if(+b.dataset.n === r){ b.classList.add('right'); good(r); done(G.tries === 0, 1900); }
      else { G.tries++; b.classList.add('wrong'); sfx.no(); if(G.tries >= 2 || k === 2){ $('duel').querySelector(`[data-n="${r}"]`).classList.add('right'); say(['rep', r]); done(false, 2600); } else say(['encore']); } };
  },
  /* 5. Donner le bon nombre d'étoiles : on compte en donnant */
  donne(){
    const cap = Math.min(S.max, 20), n = S.max <= 10 ? rnd(1, 10) : rnd(Math.max(3, cap - 12), cap), extra = rnd(2, 5), a = alien(pick(ALIENS));
    $('stage').innerHTML = `<div class="feed"><div class="eater" id="eater"><span class="bubble">${n}</span><img src="${a}" alt=""></div><div class="plates"><div class="plate" id="plate" aria-label="Les étoiles données"></div><div class="tray" id="tray" aria-label="Les étoiles à donner">${'<button class="st">⭐</button>'.repeat(n + extra)}</div></div></div>`;
    $('ask').innerHTML = '<button class="okbtn" id="okb" aria-label="J\'ai fini">✔</button>'; $('ask').onclick = null;
    say(['donne', n], true); setTimeout(() => { if(G && G.id === 'donne' && !G.locked && !$('plate').children.length) say(['fini']); }, 9000);
    const count = () => $('plate').children.length;
    $('tray').onclick = e => { const s = e.target.closest('.st'); if(!s || G.locked) return; audio(); $('plate').appendChild(s); sfx.blip(count()); say([count()]); };
    $('plate').onclick = e => { const s = e.target.closest('.st'); if(!s || G.locked) return; audio(); $('tray').appendChild(s); sfx.tap(); say([count()]); };
    $('okb').onclick = () => { if(G.locked) return; audio(); const c = count();
      if(c === n){ $('eater').classList.add('yum'); good(n); done(G.tries === 0, 2100); }
      else { G.tries++; sfx.no(); if(G.tries >= 3){ while(count() > n) $('tray').appendChild($('plate').lastChild); while(count() < n) $('plate').appendChild($('tray').lastChild); say(['rep', n]); done(false, 2800); } else say(c > n ? ['trop'] : ['encore', 'donne', n]); } };
  }
};

/* ---------- fin de manche : une étoile si 4 bonnes réponses sur 5 du premier coup ---------- */
function endRound(){
  const okN = G.res.filter(Boolean).length, win = okN >= 4, E = $('end'); go('end'); E.classList.remove('launch');
  S.rounds = (S.rounds || 0) + 1; let up = false;
  if(win){ S.stars[G.id] = (S.stars[G.id] || 0) + 1; S.wins = (S.wins || 0) + 1; if(S.wins >= 3 && S.max < 60){ S.max += 10; S.wins = 0; up = true; } }
  save();
  $('eTitle').textContent = win ? (up ? 'Niveau suivant !' : 'Bravo !') : 'Presque !';
  $('eStars').textContent = Array.from({ length:ROUND }, (_, k) => G.res[k] ? '🟢' : '🔴').join(' ') + (win ? '  →  ⭐' : '');
  if(win){ party(50); sfx.zap(); setTimeout(() => E.classList.add('launch'), 500); say(up ? ['niveau'] : ['etoile']); } else say(['encore']);
}
$('eAgain').onclick = () => { sfx.tap(); startGame(G.id); };
$('eMenu').onclick = () => { sfx.tap(); showMenu(false); };

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if(document.hidden) stopVoice(); });
if(window.Famille) Famille.track('amine-nombres', PLAYER, [KEY]);
window.__nb = { get S(){ return S; }, get G(){ return G; }, startGame };
</script>
