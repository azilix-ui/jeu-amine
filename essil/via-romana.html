<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Via Romana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,700;0,800;1,400&display=swap">
<style>
/* Layout: single column (max 860px). Home = a route of stops (units); unit = grid of activities; activity = top bar + question card + answers. */
/* Via Romana: weathered stone, Pompeian red, lapis blue, bronze. Inscriptional capitals for display. Single deliberate light look. */
:root{
  --bg:#e7e5e0; --surface:#f8f7f4; --ink:#2a2420; --muted:#6a6158; --line:#d2ccc2;
  --accent:#9b2226; --accent-ink:#ffffff; --accent2:#1d3b6e; --gold:#b8892b;
  --ok:#3a7437; --ok-soft:#e1eedc; --bad:#b3261e; --bad-soft:#f6dedb;
  --m:#1d3b6e; --f:#9b2226; --n:#3a7437; --sel:#e3e8f2; --card-back:#f1eee8;
  --display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:6px; color-scheme:light;
}
body{background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:6px 6px}
.brand{display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--accent);border-bottom:1px solid var(--line);padding-block:14px}
.spqr{margin:0;color:var(--gold);font-family:var(--display);font-weight:700;letter-spacing:.3em}
.brand h1{font-size:clamp(36px,7vw,60px);font-weight:700;letter-spacing:.06em;color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.route{gap:0}
.route li{position:relative;padding-left:28px;padding-block:6px}
.route li::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(#b9b1a4 0 10px,#cfc8bc 10px 14px);border-radius:2px}
.stop{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);box-shadow:0 2px 0 #0000000f}
.stop:hover{border-left-color:var(--gold)}
.stop-tag{font-family:var(--display);color:var(--accent);letter-spacing:.18em}
.stop-main b{font-weight:700;letter-spacing:.02em}
.stop-prog{color:var(--muted)}
.stop.is-next{box-shadow:0 0 0 3px var(--gold)}
.stop.is-done .stop-prog{color:var(--ok)}
.uhead .stop-tag{font-family:var(--display);color:var(--accent)}
.uhead h2,.lex h2,.res h2{color:var(--accent);font-weight:700}
.prompt{font-weight:700}
.prompt.sm i{font-family:var(--display);font-style:normal;color:var(--accent2)}
.mode b{letter-spacing:.02em}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
small{color:var(--muted)}
.icon{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.btn{border-radius:var(--r);padding:12px 18px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.good{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* header */
.hdr{display:flex;flex-direction:column;gap:14px}
.who{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.who>div{flex:1;min-width:0}
.lvl{font-family:var(--display);font-weight:700;font-size:20px}
.xpbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.nexthint{margin:0;color:var(--muted)}
.nexthint b{color:var(--ink)}
.foot{font-size:14px;color:var(--muted);margin:8px 0 0}

/* route */
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;position:relative}
.stop{width:100%;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ic tag prog" "ic main prog";column-gap:14px;align-items:center;text-align:left;padding:12px 16px;border-radius:var(--r)}
.stop-ic{grid-area:ic;font-size:30px}
.stop-tag{grid-area:tag;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.stop-main{grid-area:main;display:flex;flex-direction:column;min-width:0}
.stop-main b{font-family:var(--display);font-size:21px;line-height:1.15}
.stop-prog{grid-area:prog;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* unit */
.back{align-self:flex-start;font-weight:700;color:var(--muted);padding:6px 0}
.uhead{display:flex;flex-direction:column;gap:4px}
.uhead h2{font-size:clamp(28px,5vw,40px)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mode{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic name" "ic desc" "ic st";column-gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode.first{border:2px solid var(--accent)}
.mode-ic{grid-area:ic;font-size:28px}
.mode b{grid-area:name;font-family:var(--display);font-size:19px}
.mode small{grid-area:desc}
.mstars{grid-area:st;color:var(--gold);letter-spacing:2px;margin-top:4px}

/* game */
.gtop{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.pts{font-weight:700;font-variant-numeric:tabular-nums}
.combo{min-width:58px;font-weight:800;color:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.kicker{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prompt{font-family:var(--display);font-size:clamp(28px,5.5vw,44px);line-height:1.15;overflow-wrap:anywhere}
.prompt.sm{font-family:var(--body);font-size:clamp(19px,3vw,24px);font-weight:700}
.prompt i{font-style:italic}
.sub{color:var(--muted)}
.say{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;background:var(--bg)}
.pron{color:var(--accent2)}
.blank{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.opts.fixed{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;font-weight:700;font-size:18px;min-width:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt kbd{font-family:var(--body);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent2)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.opts.fixed .opt{justify-content:center;font-family:var(--display);font-size:24px}
.art-m{color:var(--m)}.art-f{color:var(--f)}.art-n{color:var(--n)}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.fb{display:flex;flex-direction:column;gap:12px;align-items:center;min-height:10px}
.fbmsg{width:100%;box-sizing:border-box;border-radius:var(--r);padding:12px 16px;font-weight:700;text-align:center}
.fbmsg p{font-weight:400;margin:6px 0 0}
.fbmsg.good{background:var(--ok-soft);color:var(--ok)}
.fbmsg.oops{background:var(--bad-soft);color:var(--ink)}
.typein{display:flex;gap:10px}
.typein input{flex:1;min-width:0;font:inherit;font-size:22px;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.chars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ch{width:46px;height:42px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:700}

/* flashcards */
.flipwrap{perspective:1200px}
.flip{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .45s}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box}
.face.back{transform:rotateY(180deg);background:var(--card-back)}
.face b{font-family:var(--display);font-size:clamp(26px,5vw,40px);line-height:1.15;overflow-wrap:anywhere;text-align:center}
.face em{font-style:normal;color:var(--muted);font-size:14px}
.face small{text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.left{text-align:center;color:var(--muted);margin:0}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;font-weight:700;min-height:56px;overflow-wrap:anywhere}
.mt.l{font-family:var(--display);font-size:19px}
.mt.sel{border-color:var(--accent2);background:var(--sel)}
.mt.done{opacity:.25;border-style:dashed}
.mt.bad{border-color:var(--bad);animation:shake .35s}
.kick2{margin:0;text-align:center;color:var(--muted)}
.kick2 span{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* lexicon */
.lex{display:flex;flex-direction:column;gap:16px}
.lex h2{font-size:clamp(26px,4.5vw,36px)}
.note{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:14px 16px;max-width:70ch}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.tw{font-family:var(--display);font-weight:700;font-size:18px}
.g-m{color:var(--m)}.g-f,.g-pl{color:var(--f)}.g-n{color:var(--n)}
.mini{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.tbl h3{font-size:20px;margin-bottom:6px}
.tbl h3 small{font-family:var(--body);font-size:15px;font-weight:400}
.tbl td b{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:15px}

/* results */
.res{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 18px}
.res-st{font-size:48px;color:var(--gold);letter-spacing:6px}
.dim{color:var(--line)}
.res h2{font-size:clamp(26px,5vw,36px)}
.lvlup{background:var(--gold);color:#1b1b1b;border-radius:99px;padding:8px 18px;font-weight:800}
.miss{width:100%;max-width:560px;text-align:left}
.miss h3{font-size:18px;margin-bottom:6px}
.miss ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:520px){.opts.fixed .opt{font-size:20px;padding:12px 6px}.match{gap:8px}.mt{padding:10px 8px;font-size:15px}.mt.l{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function lv(){if(synth)voices=synth.getVoices()}
if(synth){lv();synth.onvoiceschanged=lv}
function voice(){for(const p of C.voiceLangs){const l=voices.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase()));const n=l.find(v=>/google|natural|online|premium|enhanced/i.test(v.name));if(n||l[0])return n||l[0]}return null}
function speak(t,rate){if(!audioOn||!synth||!t)return;synth.cancel();const u=new SpeechSynthesisUtterance(t);const v=voice();if(v)u.voice=v;u.lang=C.voiceLangs[0];u.rate=rate||C.rate;synth.speak(u)}
function hush(){if(synth)synth.cancel()}
let ac;
function actx(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();return ac}
function tone(f,t0,d,type="sine",g=.12,f2){const a=actx();if(!a||!audioOn)return;const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);gn.gain.setValueAtTime(g,a.currentTime+t0);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(gn).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
const sfx={good(){tone(660,0,.12);tone(990,.09,.2)},bad(){tone(220,0,.22,"triangle",.12,150)},flip(){tone(500,0,.06,"triangle",.08,720)},combo(){tone(1320,0,.12,"triangle",.08)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.28,"triangle",.12))},tap(){tone(700,0,.05,"triangle",.06)}};

/* ===== confetti ===== */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n=140){if(reduce)return;cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*6+4,c:C.confetti[i%C.confetti.length],a:Math.random()*6,l:130});if(!raf)stepC()}
function stepC(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.42;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});parts=parts.filter(p=>p.l>0&&p.y<cv.height+20);raf=parts.length?requestAnimationFrame(stepC):(cx.clearRect(0,0,cv.width,cv.height),null)}

/* ===== data prep ===== */
const stripArt=t=>t.replace(/^(der|die|das)\s+/i,"");
C.units.forEach((u,ui)=>{u.idx=ui;u.cards=(u.cards||[]).map(c=>{const[t,fr,o={}]=c;const base=o.key||(C.lemma?t.split(",")[0].trim():t);return{t,fr,g:o.g,say:o.say||base.replace(/\s*\(.*?\)\s*/g," ").trim(),ans:[base,...(o.alt||[])],noun:o.g?stripArt(t):null}})});
const missH=c=>`<b>${esc(c.t)}</b> — ${esc(c.fr)}`;

/* ===== navigation ===== */
let keyH=null,timers=[];
document.addEventListener("keydown",e=>{if(keyH)keyH(e)});
function nav(fn){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];keyH=null;hush();fn();window.scrollTo(0,0)}

const MODES={
  lex:u=>true,
  flash:u=>u.cards.length>=4,
  qcm:u=>u.cards.length>=4,
  type:u=>u.cards.length>=4,
  match:u=>u.cards.length>=6,
  article:u=>u.cards.filter(c=>c.g).length>=5,
  conj:u=>!!u.conj,
  decl:u=>!!u.decl,
  quiz:u=>!!u.quiz,
  roman:u=>!!u.roman,
};
const avail=u=>Object.keys(MODES).filter(k=>MODES[k](u));
const scored=u=>avail(u).filter(k=>k!=="lex");
const doneCount=u=>scored(u).filter(k=>store.best[u.id+":"+k]).length;

   ${u.conj?`<div class="tables">${u.conj.map(v=>`<div class="tbl"><h3>${esc(v.inf)} <small>${esc(v.fr)}</small></h3><table>${v.forms.map((f,p)=>`<tr><td><small>${esc(C.pronouns[p])}</small></td><td>${hl(f,v.stem)}</td></tr>`).join("")}</table></div>`).join("")}</div>`:""}
   ${u.decl?`<div class="tables">${u.decl.map(d=>`<div class="tbl"><h3>${esc(d.lemma)}</h3><div class="tblwrap"><table><tr><th>cas</th><th>singulier</th><th>pluriel</th></tr>${cases.map((cs,i)=>`<tr><td><small>${cs}</small></td><td>${hl(d.sg[i],d.stem)}</td><td>${hl(d.pl[i],d.stem)}</td></tr>`).join("")}</table></div></div>`).join("")}</div>`:""}

/* ===== session ===== */
function session(u,mode,total){
  return{u,mode,total,n:0,right:0,pts:0,combo:0,missed:[],
    mark(ok,miss,assisted){this.n++;if(ok){this.right++;if(assisted){this.combo=0;this.pts+=5}else{this.combo++;this.pts+=10+2*Math.min(this.combo,5);if(this.combo>=3)sfx.combo()}sfx.good()}else{this.combo=0;sfx.bad();if(miss&&!this.missed.includes(miss))this.missed.push(miss)}upd(this)}};
}
function upd(S){const pg=$("#pg"),pt=$("#pts"),cb=$("#cb");if(pg)pg.style.width=Math.min(100,S.n/S.total*100)+"%";if(pt)pt.textContent=S.pts;if(cb)cb.textContent=S.combo>=2?`×${Math.min(S.combo,5)} 🔥`:""}
function stage(S,html){
  app.innerHTML=`<div class="gtop"><button class="icon" id="quit" aria-label="Quitter">✕</button><div class="prog"><i id="pg"></i></div><span class="pts">⭐ <b id="pts">0</b></span><span class="combo" id="cb"></span></div>${html}`;
  $("#quit").onclick=()=>nav(()=>unitView(S.u));upd(S);
}
function results(S,replay){
  const acc=S.total?S.right/S.total:1,st=acc>=.9?3:acc>=.7?2:1;
  const key=S.u.id+":"+S.mode,before=level(store.xp).cur;
  store.best[key]=Math.max(store.best[key]||0,st);store.xp+=S.pts;save();
  const after=level(store.xp).cur;
  sfx.win();if(st===3)confetti();
  app.innerHTML=`<div class="res"><div class="res-st">${"★".repeat(st)}<span class="dim">${"★".repeat(3-st)}</span></div>
    <h2>${esc(C.resTitles[st-1])}</h2><p style="margin:0">${S.right} / ${S.total} réussies · <b>+${S.pts} XP</b>${S.extra?"<br>"+S.extra:""}</p>
    ${after!==before?`<div class="lvlup">Nouveau grade : ${esc(after[1])} !</div>`:""}
    ${S.missed.length?`<div class="miss"><h3>À revoir</h3><ul>${S.missed.map(m=>`<li>${m}</li>`).join("")}</ul></div>`:`<p style="margin:0">Aucune erreur. ${esc(C.perfect)}</p>`}
    <div class="row"><button class="btn primary" id="ag">↻ Rejouer</button><button class="btn" id="un">Autres épreuves</button></div></div>`;
  $("#ag").onclick=()=>nav(replay);$("#un").onclick=()=>nav(()=>unitView(S.u));
  keyH=e=>{if(e.key==="Enter")nav(replay)};
}

/* ===== choice runner ===== */
function runChoice(u,mode,gen){
  const qs=gen(),S=session(u,mode,qs.length);let i=0;
  function show(){
    const q=qs[i];let done=false;
    const opts=q.fixed?q.options:shuffle(q.options);
    stage(S,`<div class="qcard">${q.kicker?`<div class="kicker">${q.kicker}</div>`:""}<div class="prompt${q.small?" sm":""}">${q.prompt}</div>${q.sub?`<div class="sub">${q.sub}</div>`:""}${q.say?`<button class="say" id="say">🔊 Écouter</button>`:""}</div>
     <div class="opts${q.fixed?" fixed":""}">${opts.map((o,k)=>`<button class="opt ${q.cls?q.cls[o]||"":""}" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>`);
    if(q.say){$("#say").onclick=()=>speak(q.say);if(q.autoSay)speak(q.say)}
    const btns=[...app.querySelectorAll(".opt")];
    let go=()=>{};
    const choose=k=>{if(done)return;done=true;const ok=opts[k]===q.correct;
      btns.forEach((b,j)=>{b.disabled=true;if(opts[j]===q.correct)b.classList.add("ok")});if(!ok)btns[k].classList.add("bad");
      S.mark(ok,q.miss);if(q.after)speak(q.after);
      $("#fb").innerHTML=`<div class="fbmsg ${ok?"good":"oops"}">${ok?esc(pick(C.praise)):"La bonne réponse : "+esc(q.correct)}${q.explain?`<p>${q.explain}</p>`:""}</div><button class="btn primary" id="nx">Suivant →</button>`;
      go=()=>{i++;nav(()=>{}) ;i<qs.length?show():results(S,()=>runChoice(u,mode,gen))};
      $("#nx").onclick=go;$("#nx").focus({preventScroll:true});
      if(ok&&!q.explain)timers.push(setTimeout(go,q.after?1300:850));
    };
    btns.forEach((b,k)=>b.onclick=()=>choose(k));
    keyH=e=>{if(!done&&/^[1-9]$/.test(e.key)&&+e.key<=btns.length)choose(+e.key-1)};
  }
  show();
}

/* ===== typing runner ===== */
function runType(u,mode,gen){
  const qs=gen(),S=session(u,mode,qs.length);let i=0;
  function show(){
    const c=qs[i];let done=false,hints=0;
    stage(S,`<div class="qcard"><div class="kicker">${C.typeKicker}</div><div class="prompt">${esc(c.fr)}</div></div>
     <form class="typein" id="tf" autocomplete="off"><input id="ti" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Ta réponse" placeholder="${esc(C.typePh)}"><button class="btn primary" type="submit">Valider</button></form>
     ${C.chars.length?`<div class="chars">${C.chars.map(ch=>`<button type="button" class="ch" data-c="${ch}">${ch}</button>`).join("")}</div>`:""}
     <div class="row"><button class="btn ghost" id="hint" type="button">💡 Indice</button><button class="btn ghost" id="skip" type="button">Je ne sais pas</button></div>
     <div class="fb" id="fb"></div>`);
    const inp=$("#ti");inp.focus();
    app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{if(done)return;const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.setRangeText(b.dataset.c,s,e,"end");inp.focus()});
    $("#hint").onclick=()=>{if(done)return;hints++;const a=c.ans[0];inp.value=a.slice(0,Math.min(a.length-1,hints*2));inp.focus()};
    const go=()=>{i++;nav(()=>{});i<qs.length?show():results(S,()=>runType(u,mode,gen))};
    const check=val=>{
      if(done)return;done=true;
      const n=norm(val);const ok=n.length>0&&c.ans.some(a=>norm(a)===n);let tip="";
      if(ok&&C.caseTip){const ty=val.trim().replace(/[.!?]+$/,""),ta=c.ans[0].replace(/[.!?]+$/,"");if(ty!==ta&&ty.toLowerCase()===ta.toLowerCase())tip=C.caseTip}
      if(ok&&C.chars.length&&/[äöüß]/i.test(c.ans[0])&&!/[äöüß]/i.test(val))tip=(tip?tip+" ":"")+"Astuce : utilise les boutons ä ö ü ß.";
      if(!ok&&c.noun&&norm(val)===norm(c.noun))tip="Presque ! Il manque l'article : on apprend toujours le nom avec der, die ou das.";
      S.mark(ok,missH(c),hints>0);inp.disabled=true;speak(c.say);
      $("#fb").innerHTML=`<div class="fbmsg ${ok?"good":"oops"}">${ok?esc(pick(C.praise))+(c.ans[0]!==val.trim()?` · ${esc(c.t)}`:""):"La bonne réponse : "+esc(c.t)}${tip?`<p>${tip}</p>`:""}</div><button class="btn primary" id="nx">Suivant →</button>`;
      $("#nx").onclick=go;timers.push(setTimeout(()=>{keyH=e=>{if(e.key==="Enter"){e.preventDefault();go()}}},50));
    };
    $("#tf").onsubmit=e=>{e.preventDefault();check(inp.value)};
    $("#skip").onclick=()=>check("");
  }
  show();
}

/* ===== flashcards ===== */
function flash(u,dirArg){
  let dir=dirArg||"t";const total=u.cards.length;let queue=shuffle(u.cards);const known=new Set(u.cards);
  const S=session(u,"flash",total);
  function show(){
    if(!queue.length){S.right=known.size;S.n=total;results(S,()=>flash(u,dir));return}
    const c=queue[0];let flipped=false;
    const fT=dir==="t"?c.t:c.fr,bT=dir==="t"?c.fr:c.t;
    stage(S,`<div class="flipwrap"><button class="flip" id="fc" aria-label="Retourner la carte"><span class="face front"><small>${dir==="t"?C.langLabel:"français"}</small><b>${esc(fT)}</b><em>Touche la carte (ou Espace) pour la retourner</em></span><span class="face back"><small>${dir==="t"?"français":C.langLabel}</small><b>${esc(bT)}</b></span></button></div>
      <div class="row" id="judge" style="visibility:hidden"><button class="btn bad" id="no">✗ À revoir (←)</button><button class="btn good" id="yes">✓ Je savais (→)</button></div>
      <div class="row"><button class="btn ghost" id="dir">⇄ Sens : ${dir==="t"?C.langShort+" → FR":"FR → "+C.langShort}</button><button class="btn ghost" id="sy">🔊 Écouter</button></div>
      <p class="left">${queue.length} carte${queue.length>1?"s":""} restante${queue.length>1?"s":""}</p>`);
    S.n=total-queue.length;upd(S);
    if(dir==="t")speak(c.say);
    const flip=()=>{flipped=!flipped;$("#fc").classList.toggle("on",flipped);$("#judge").style.visibility="visible";sfx.flip();if(dir!=="t"&&flipped)speak(c.say)};
    const yes=()=>{if(!flipped)return;queue.shift();if(known.has(c))S.pts+=4;upd(S);show()};
    const no=()=>{if(!flipped)return;known.delete(c);const m=missH(c);if(!S.missed.includes(m))S.missed.push(m);queue.shift();queue.splice(Math.min(3,queue.length),0,c);sfx.bad();show()};
    $("#fc").onclick=flip;$("#yes").onclick=yes;$("#no").onclick=no;
    $("#sy").onclick=()=>speak(c.say);
    $("#dir").onclick=()=>nav(()=>flash(u,dir==="t"?"f":"t"));
    keyH=e=>{if(e.key===" "){e.preventDefault();flip()}else if(e.key==="ArrowRight")yes();else if(e.key==="ArrowLeft")no()};
  }
  show();
}

/* ===== match ===== */
function match(u){
  const set=shuffle(u.cards).slice(0,6),S=session(u,"match",set.length);let sel=null,found=0,errs=0;const t0=performance.now();
  const L=shuffle(set),R=shuffle(set);
  stage(S,`<p class="kick2">Associe chaque mot à sa traduction · <span id="clock">0 s</span></p>
    <div class="match"><div class="col">${L.map(c=>`<button class="mt l" data-i="${set.indexOf(c)}" data-s="l">${esc(c.t)}</button>`).join("")}</div>
    <div class="col">${R.map(c=>`<button class="mt r" data-i="${set.indexOf(c)}" data-s="r">${esc(c.fr)}</button>`).join("")}</div></div>`);
  timers.push(setInterval(()=>{const k=$("#clock");if(k)k.textContent=Math.round((performance.now()-t0)/1000)+" s"},500));
  app.querySelectorAll(".mt").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done"))return;
    const side=b.dataset.s,i=+b.dataset.i;
    if(side==="l")speak(set[i].say);
    if(!sel||sel.side===side){if(sel)sel.el.classList.remove("sel");sel={side,i,el:b};b.classList.add("sel");return}
    if(sel.i===i){[sel.el,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true});found++;S.mark(true);S.n=found;upd(S);
      if(found===set.length){const sec=Math.round((performance.now()-t0)/1000);const k=u.id;const rec=store.times[k];const isRec=!rec||sec<rec;if(isRec)store.times[k]=sec;save();
        S.total=set.length+errs;S.right=found;S.extra=`Temps : ${sec} s${isRec?" · nouveau record !":` · record : ${rec} s`}`;timers.push(setTimeout(()=>results(S,()=>match(u)),500))}}
    else{errs++;const li=sel.side==="l"?sel.i:i;S.mark(false,missH(set[li]));S.n=found;upd(S);const a=sel.el;[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("bad")});timers.push(setTimeout(()=>{a.classList.remove("bad");b.classList.remove("bad")},400))}
    sel=null;
  });
}

/* ===== generators ===== */
function genQcm(u){const cs=shuffle(u.cards).slice(0,Math.min(10,u.cards.length));
  return cs.map((c,i)=>{const o=shuffle(u.cards.filter(x=>x!==c));
    if(i%2===0)return{kicker:C.qcmA,prompt:esc(c.t),say:c.say,autoSay:true,options:uniq([c.fr,...o.map(x=>x.fr)]).slice(0,4),correct:c.fr,miss:missH(c)};
    return{kicker:C.qcmB,prompt:esc(c.fr),options:uniq([c.t,...o.map(x=>x.t)]).slice(0,4),correct:c.t,after:c.say,miss:missH(c)}})}
function genType(u){return shuffle(u.cards).slice(0,Math.min(8,u.cards.length))}
function genArticle(u){const A={m:"der",f:"die",n:"das",pl:"die"};
  return shuffle(u.cards.filter(c=>c.g)).slice(0,10).map(c=>({kicker:"Quel article ?",prompt:esc(c.noun),sub:esc(c.fr),options:["der","die","das"],fixed:true,cls:{der:"art-m",die:"art-f",das:"art-n"},correct:A[c.g],after:c.t,explain:c.g==="pl"?"C'est un pluriel : au pluriel, l'article est toujours <b>die</b>.":"",miss:missH(c)}))}
function genConj(u){const seen=new Set(),out=[];let guard=0;
  while(out.length<10&&guard++<200){const v=pick(u.conj),p=Math.random()*6|0,k=v.inf+p;if(seen.has(k))continue;seen.add(k);const correct=v.forms[p];
    let pool=uniq([correct,...shuffle(v.forms)]);if(pool.length<4)pool=uniq([...pool,...shuffle(u.conj.flatMap(x=>x.forms))]);
    out.push({kicker:`${esc(v.inf)} — ${esc(v.fr)}`,prompt:`<span class="pron">${esc(C.pronouns[p])}</span> <span class="blank">…</span>`,options:pool.slice(0,4),correct,after:(C.pronSay?C.pronSay[p]+" ":"")+correct,miss:`<b>${esc(C.pronouns[p])} → ${esc(correct)}</b> (${esc(v.inf)})`})}
  return out}
function genDecl(u){const out=[],seen=new Set();let guard=0;
  const lab=(n,c)=>`${C.cases[c]} ${n==="sg"?"singulier":"pluriel"}`;
  while(out.length<10&&guard++<300){const d=pick(u.decl),num=Math.random()<.5?"sg":"pl",ci=Math.random()*6|0,k=d.lemma+num+ci;if(seen.has(k))continue;seen.add(k);
    const form=d[num][ci],all=[...d.sg,...d.pl],cnt=all.filter(x=>x===form).length,name=d.lemma.split(",")[0];
    if(Math.random()<.4&&cnt===1){const labels=[];["sg","pl"].forEach(n=>[0,1,2,3,4,5].forEach(c=>{if(d[n][c]!==form)labels.push(lab(n,c))}));
      out.push({kicker:"Quel est le cas ?",prompt:`<i>${esc(form)}</i>`,sub:esc(d.lemma),options:[lab(num,ci),...shuffle(labels).slice(0,3)],correct:lab(num,ci),after:form,miss:`<i>${esc(form)}</i> = ${lab(num,ci)}`})}
    else out.push({kicker:esc(d.lemma),prompt:`${esc(name)} → <span class="pron">${lab(num,ci)}</span>`,small:true,options:uniq([form,...shuffle(all)]).slice(0,4),correct:form,after:form,miss:`${esc(name)}, ${lab(num,ci)} : <b>${esc(form)}</b>`})}
  return out}
function genQuiz(u){return shuffle(u.quiz).slice(0,10).map(q=>({kicker:q.k||"Défi",prompt:q.q,small:true,options:uniq([q.a,...q.w]),correct:q.a,explain:q.ex||"",after:q.say||"",miss:`${q.q} → <b>${esc(q.a)}</b>`}))}
function toRoman(n){const m=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let s="";for(const[v,r]of m)while(n>=v){s+=r;n-=v}return s}
function genRoman(){const out=[],years=[2026,1789,1515,800,476,1492,1999,2012,1610,1914];
  for(let i=0;i<10;i++){const r=Math.random();const n=r<.6?1+(Math.random()*49|0):r<.85?51+(Math.random()*450|0):pick(years);
    const near=uniq([n+1,n-1,n+4,n-4,n+5,n-5,n+9,n-9,n+10,n-10,n+40,n-40,n+90,n+100,n-100,n+1000].filter(x=>x>0&&x!==n));
    const d=shuffle(near).slice(0,3);
    if(i%2===0)out.push({kicker:"Écris en chiffres romains",prompt:String(n),options:[toRoman(n),...d.map(toRoman)],correct:toRoman(n),miss:`${n} = <b>${toRoman(n)}</b>`});
    else out.push({kicker:"Combien vaut ce nombre ?",prompt:toRoman(n),options:[String(n),...d.map(String)],correct:String(n),miss:`${toRoman(n)} = <b>${n}</b>`})}
  return out}

const RUN={
  lex:lexique,flash:u=>flash(u),match,
  qcm:u=>runChoice(u,"qcm",()=>genQcm(u)),
  type:u=>runType(u,"type",()=>genType(u)),
  article:u=>runChoice(u,"article",()=>genArticle(u)),
  conj:u=>runChoice(u,"conj",()=>genConj(u)),
  decl:u=>runChoice(u,"decl",()=>genDecl(u)),
  quiz:u=>runChoice(u,"quiz",()=>genQuiz(u)),
  roman:u=>runChoice(u,"roman",genRoman),
};
home();
</script>
