<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<title>Progression · Famille Missaoui</title>

<style>
[hidden]{display:none!important}
/* Tableau de bord des parents : une carte par enfant (couleur de son espace), le plus récent en haut. */
.login{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;max-width:520px}
.login h2{font-family:var(--display);font-size:26px;margin:0}
.login p{margin:0;color:var(--soft)}
.login form{display:flex;gap:10px;flex-wrap:wrap}
.login input{flex:1 1 200px;min-width:0;font:inherit;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.login button,.tool{font:inherit;font-weight:800;border:0;border-radius:14px;padding:10px 18px;background:var(--essil);color:#fff;cursor:pointer}
.tool{background:var(--surface);color:var(--ink);border:2px solid var(--line);padding:8px 14px;font-weight:700}
.msg{font-weight:700;color:var(--essil-2);min-height:1.2em}
.board{display:flex;flex-direction:column;gap:22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--soft);font-size:15px}
.child{background:var(--surface);border:2px solid var(--line);border-radius:28px;overflow:hidden}
.child>header{background:var(--c);color:#fff;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.child>header h2{font-family:var(--display);font-weight:800;font-size:36px;margin:0;line-height:1}
.child>header span{opacity:.85;font-weight:700}
.child.essil{--c:var(--essil-card)}.child.salma{--c:var(--salma-card)}.child.amine{--c:var(--amine-card)}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;padding:18px}
.subject{border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.subject h3{margin:0;font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:8px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--bg);border-radius:14px;padding:8px 12px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--soft);font-weight:700;font-size:13px}
.kpi .up{color:var(--salma);font-weight:800;font-size:14px}
.grade{font-weight:800}
.meter{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c, var(--essil));border-radius:999px}
.units{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;margin:0}
.units dt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.units dd{margin:0;font-variant-numeric:tabular-nums;color:var(--soft);font-weight:700;text-align:right}
.units dd .st{color:#e0a800;letter-spacing:1px}
.none{color:var(--soft);font-size:15px;margin:0}
.when{font-size:14px;color:var(--soft);margin:0}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--soft);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-size:26px;margin:0}
.mrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mrow label{font-weight:700;display:inline-flex;gap:8px;align-items:center}
.danger{font:inherit;font-weight:800;border:0;border-radius:14px;padding:10px 16px;background:#d7263d;color:#fff;cursor:pointer;min-height:44px}
.mini{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:4px 10px;cursor:pointer;min-height:36px}
.gain{color:var(--salma);font-weight:800}
.vhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--essil);border-color:var(--essil);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
.chip b{font-family:var(--display)}
.vtable td{font-size:14px}
.vtable td.ip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--soft)}
.vtable tr.fam td:first-child{border-left:4px solid var(--salma)}
.flag{font-size:18px;margin-right:4px}
/* tableau de bord : onglets, tuiles de chiffres, graphique, activités */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px;margin:0 -4px;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 6px 18px rgba(20,30,60,.08);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font:inherit;font-weight:800;border:0;background:none;color:var(--soft);border-radius:14px;padding:10px 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.tabs button span{font-size:19px}
.tabs button[aria-selected="true"]{background:var(--essil);color:#fff}
.tabs button:focus-visible,.seg button:focus-visible,.mini:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.bar .grow{flex:1}
.pane{display:flex;flex-direction:column;gap:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border:2px solid var(--line);border-top:6px solid var(--t,var(--essil));border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-weight:800;font-size:15px}
.tile small{color:var(--soft);font-weight:700;font-size:13px}
.tiles.small .tile{border-top-width:2px;background:var(--bg);border-color:transparent;padding:10px 14px}
.tiles.small .tile b{font-size:28px}
.tiles.small{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;font-size:15px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--soft);font-size:12px;font-family:var(--body);font-weight:700}
.chart .tot{fill:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.kcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;border-top:8px solid var(--t)}
.kcard header{display:flex;gap:12px;align-items:center}
.kcard img{border-radius:50%;object-fit:cover;border:3px solid var(--t)}
.kcard h3{margin:0;font-family:var(--display);font-size:26px;line-height:1}
.kcard small{color:var(--soft);font-weight:700;font-size:13px}
.kcard .mini{align-self:flex-start;margin-top:auto}
.seg.big button{display:inline-flex;align-items:center;gap:8px;font-size:17px;padding:6px 16px 6px 8px;border-radius:999px;min-height:48px}
.seg.big img{border-radius:50%;object-fit:cover}
.atable tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
.atable .zero{color:var(--line)}
.barcell{width:34%;min-width:110px}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px}
.stack i{display:block;min-width:3px}
.day{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day h3{margin:0;font-family:var(--display);font-size:18px}
.day h3::first-letter{text-transform:uppercase}
.drow{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:start;border-left:5px solid var(--t);padding-left:10px}
.drow>b{padding-top:6px}
.drow .dn{color:var(--soft);font-weight:700;font-size:14px;padding-top:7px;white-space:nowrap}
.chip small{color:var(--soft);font-weight:700}
.chip.win{background:var(--salma-soft);color:var(--salma)}
.search{font:inherit;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
h3.sub{margin:6px 0 0;font-family:var(--display)}
@media (max-width:560px){ .tabs button{padding:8px 12px;font-size:15px} .tile b{font-size:32px} .drow{grid-template-columns:1fr auto} .drow .chips{grid-column:1/-1;grid-row:2} }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="./">← Famille Missaoui</a>
  <header class="top">
    <h1>Progression<span class="dot">.</span></h1>
    <p class="lead">Le tableau de bord des parents : ce que font Essil, Salma et Amine, où ils en sont, et qui visite le site.</p>
  </header>
  <section id="login" class="login" hidden></section>
  <section id="board" class="board" hidden></section>
  <p class="lead" style="font-size:.9rem;margin-top:28px">Anciennes versions gardées en ligne : <a href="jeux/legende-du-jasmin.html">La Légende du Jasmin, première version (héros dessinés)</a>. Les progrès sont les mêmes dans les deux.</p>
</main>
<script>
'use strict';
const API = 'api/famille.php';
const CFG = {"essil-deutsch": {"units": [["ich", "🙋‍♀️", "Das bin ich"], ["steckbrief", "🪪", "Er heißt Mike"], ["laender", "🗺️", "Länder & Hauptstädte"], ["wetter", "⛅", "Datum & Wetter"], ["fehler", "🔎", "Fehlerjagd"], ["hallo", "👋", "Hallo!"], ["verben", "⚙️", "Verben: sein & haben"], ["zahlen", "🔢", "Zahlen"], ["zeit", "📅", "Tage & Monate"], ["familie", "🐶", "Familie & Tiere"], ["schule", "🎒", "Schule"], ["freizeit", "⚽", "Freizeit"], ["essen", "🥨", "Essen & Trinken"], ["farben", "👕", "Farben & Kleidung"]], "levels": [[0, "Anfängerin · débutante"], [300, "Entdeckerin · exploratrice"], [800, "Reisende · voyageuse"], [1600, "Kennerin · connaisseuse"], [2800, "Profi · pro"], [4500, "Expertin · experte"], [7000, "Deutsch-Star"]]}, "essil-latin": {"units": [["salve", "👋", "Salve !"], ["familia", "🏠", "Familia"], ["roma", "🏛️", "Roma"], ["decl1", "🌹", "1re déclinaison"], ["decl2", "🛡️", "2e déclinaison"], ["verba", "⚔️", "Verba"], ["versio", "🔍", "Versio"], ["dei", "⚡", "Dei & mythi"], ["numeri", "🔢", "Numeri"], ["heres", "🔗", "Hereditas"]], "levels": [[0, "Tiro · recrue"], [300, "Miles · soldat"], [800, "Signifer · porte-enseigne"], [1600, "Centurio · centurion"], [2800, "Tribunus · tribun"], [4500, "Consul · consul"], [7000, "Imperator · général triomphant"]]}, "salma-english": {"themes": [["animals", "Animals", "Les animaux", "🐶"], ["colors", "Colours", "Les couleurs", "🎨"], ["numbers", "Numbers", "Les nombres", "🔢"], ["fruits", "Fruits", "Les fruits", "🍓"], ["family", "Family", "La famille", "👨‍👩‍👧"], ["hello", "Hello!", "Se présenter", "👋"], ["days", "Days", "Les jours", "📅"], ["months", "Months", "Les mois", "🗓️"]]}};
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pass = null;
try{ pass = sessionStorage.getItem('famille-pass') || localStorage.getItem('nahki-pass'); }catch(e){}

async function post(fields){
  const fd = new FormData(); for(const [k,v] of Object.entries(fields)) fd.append(k, v);
  const r = await fetch(API, {method:'POST', body:fd});
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error(j.error || 'Erreur du serveur (' + r.status + ')'); e.status = r.status; throw e; }
  return j;
}
function ago(iso){
  if(!iso) return 'jamais';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if(s < 90) return "à l'instant";
  if(s < 3600) return 'il y a ' + Math.round(s/60) + ' min';
  if(s < 86400) return 'il y a ' + Math.round(s/3600) + ' h';
  const d = Math.round(s/86400);
  return d === 1 ? 'hier' : 'il y a ' + d + ' jours';
}
const fmtDate = iso => new Date(iso).toLocaleString('fr-FR', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

/* ---------- Connexion ---------- */
async function start(){
  if(pass){ try{ return show(await post({action:'summary', pass})); }catch(e){ if(e.status !== 403 && e.status !== 409) return loginForm(e.message); pass = null; } }
  let setup = false;
  try{ setup = (await (await fetch(API + '?action=auth', {cache:'no-store'})).json()).setup; }catch(e){}
  loginForm('', setup);
}
function loginForm(msg, setup){
  const box = $('#login'); box.hidden = false; $('#board').hidden = true;
  box.innerHTML = setup
    ? '<h2>Choisis le mot de passe parent</h2><p>C\'est le même que pour enregistrer ta voix dans Nahki Tounsi. 6 caractères minimum.</p><form id="f"><input type="password" id="p1" placeholder="Mot de passe" autocomplete="new-password"><input type="password" id="p2" placeholder="Encore une fois" autocomplete="new-password"><button>Créer</button></form><div class="msg" id="m"></div>'
    : '<h2>Mot de passe parent</h2><p>Le même que pour enregistrer ta voix dans Nahki Tounsi.</p><form id="f"><input type="password" id="p1" placeholder="Mot de passe" autocomplete="current-password"><button>Voir la progression</button></form><div class="msg" id="m"></div>';
  $('#m').textContent = msg || '';
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const a = $('#p1').value;
    try{
      if(setup){
        if(a.length < 6) return $('#m').textContent = 'Au moins 6 caractères.';
        if(a !== $('#p2').value) return $('#m').textContent = 'Les deux mots de passe ne sont pas pareils.';
        await post({action:'setup', newpass:a});
      }
      const data = await post({action:'summary', pass:a});
      pass = a; try{ sessionStorage.setItem('famille-pass', a); }catch(err){}
      show(data);
    }catch(err){ $('#m').textContent = err.message; }
  };
}

/* ---------- Calculs ---------- */
const metric = {
  'essil-deutsch': d => (d['essil-deutsch'] || {}).xp || 0,
  'essil-latin':   d => (d['essil-latin'] || {}).xp || 0,
  'salma-english': d => Object.values(d['salma-stars'] || {}).reduce((a,b) => a + (+b || 0), 0),
  'salma-cheval': d => Object.entries((d['salma-cheval'] || {}).stars || {}).filter(([k]) => k !== 'grandprix').length,
  'salma-maths': d => Object.values((d['salma-maths'] || {}).stars || {}).reduce((a,b) => a + (+b || 0), 0),
  'amine-halloween': d => +d['amine-bonbons'] || 0,
  'amine-tounsi':  d => +d['amine-tounsi-etoiles'] || 0
};
function weekGain(S, player, course, current){
  const h = S.history.filter(x => x.player.toLowerCase() === player.toLowerCase() && x.course === course);
  if(!h.length) return null;
  const limit = Date.now() - 7*86400000;
  let base = null;
  for(const x of h){ if(Date.parse(x.created) <= limit) base = x; }
  if(!base) base = h[0];
  const v = current - metric[course](base.data || {});
  return v > 0 ? v : 0;
}
function prog(S, player, course){ return S.progress.find(p => p.player.toLowerCase() === player.toLowerCase() && p.course === course); }
function kpi(value, label, gain, unit){ return '<div class="kpi"><b>' + value + '</b><small>' + label + '</small>' + (gain ? ' <span class="up">+' + gain + (unit ? ' ' + unit : '') + ' cette semaine</span>' : '') + '</div>'; }

function courseCard(S, player, course, title, icon){
  const p = prog(S, player, course);
  if(!p) return '<div class="subject"><h3>' + icon + ' ' + title + '</h3><p class="none">Pas encore commencé (ou pas encore ouvert depuis la mise en place du suivi).</p></div>';
  const d = p.data || {}, cfg = CFG[course], st = d[course] || {};
  const xp = st.xp || 0, best = st.best || {};
  let cur = cfg.levels[0], next = null;
  cfg.levels.forEach((l, i) => { if(xp >= l[0]){ cur = l; next = cfg.levels[i+1] || null; } });
  const pct = next ? Math.round((xp - cur[0]) / (next[0] - cur[0]) * 100) : 100;
  const done = Object.keys(best).length, stars = Object.values(best).reduce((a,b) => a + b, 0);
  const per = {}; for(const [k,v] of Object.entries(best)){ const u = k.split(':')[0]; (per[u] = per[u] || {n:0, s:0}); per[u].n++; per[u].s += v; }
  const units = cfg.units.filter(u => per[u[0]]).map(u => '<dt>' + u[1] + ' ' + esc(u[2]) + '</dt><dd>' + per[u[0]].n + ' épreuve' + (per[u[0]].n > 1 ? 's' : '') + ' · <span class="st">' + '★'.repeat(Math.round(per[u[0]].s / per[u[0]].n)) + '</span></dd>').join('');
  return '<div class="subject"><h3>' + icon + ' ' + title + '</h3>' +
    '<div class="kpis">' + kpi(xp, 'XP', weekGain(S, player, course, xp), 'XP') + kpi(done, 'épreuves réussies') + kpi(stars, 'étoiles') + '</div>' +
    '<div><span class="grade">' + esc(cur[1]) + '</span>' + (next ? ' <span class="when">→ ' + esc(next[1]) + ' à ' + next[0] + ' XP</span>' : '') + '<div class="meter" style="margin-top:6px"><i style="width:' + pct + '%"></i></div></div>' +
    (units ? '<dl class="units">' + units + '</dl>' : '<p class="none">Aucune épreuve terminée pour l\'instant.</p>') +
    '<p class="when">Dernière activité : ' + ago(p.updated) + '</p></div>';
}
function salmaCard(S){
  const p = prog(S, 'Salma', 'salma-english');
  if(!p) return '<div class="subject"><h3>🦉 English Garden</h3><p class="none">Pas encore commencé (ou pas encore ouvert depuis la mise en place du suivi).</p></div>';
  const stars = p.data['salma-stars'] || {}, total = metric['salma-english'](p.data);
  const rows = CFG['salma-english'].themes.map(t => {
    const s = Object.entries(stars).filter(([k]) => k.startsWith(t[0] + '-')).reduce((a,[,v]) => a + v, 0);
    return '<dt>' + t[3] + ' ' + esc(t[1]) + ' <span class="when">(' + esc(t[2]) + ')</span></dt><dd>' + (s ? '<span class="st">★</span> ' + s : '—') + '</dd>';
  }).join('');
  return '<div class="subject"><h3>🦉 English Garden</h3><div class="kpis">' + kpi(total, 'étoiles', weekGain(S, 'Salma', 'salma-english', total), '★') + kpi(Object.keys(stars).length, 'activités réussies') + '</div><dl class="units">' + rows + '</dl><p class="when">Dernière activité : ' + ago(p.updated) + '</p></div>';
}
const MATHS = [['echauffement','🌱','Échauffement'],['secret','🔑','Le secret de la retenue'],['pasapas','👣','Pas à pas'],['atoi','🌻','À toi de jouer'],['centaines','🌳','Les centaines'],['double','🌈','Double retenue'],['zero','🕳️','Le piège du zéro'],['problemes','🧺','Petits problèmes']];
function mathsCard(S){
  const p = prog(S, 'Salma', 'salma-maths');
  if(!p) return '<div class="subject"><h3>➖ Jardin des Nombres</h3><p class="none">Pas encore commencé.</p></div>';
  const m = p.data['salma-maths'] || {}, st = m.stars || {}, done = m.done || {}, total = metric['salma-maths'](p.data);

// un résumé court de l'état d'un cours, pour le suivre dans le temps
function brief(course, d){
  if(metric[course]) return { n:metric[course](d || {}), t:metric[course](d || {}) + ' ' + (UNIT[course] || '★') };
  const parts = []; let n = 0;
  for(const v of Object.values(d || {})){ if(!v || typeof v !== 'object') continue;
    if(v.stars){ const st = Object.values(v.stars).reduce((a, b) => a + (+b || 0), 0); parts.push('★ ' + st); n += st; }
    if(v.tickets){ parts.push('🎟️ ' + v.tickets); n += v.tickets; }
    if(v.total){ parts.push('🪙 ' + v.total); n += v.total; }
    if(Array.isArray(v.skins)) parts.push(v.skins.length + ' skins');
    if(v.wins !== undefined){ parts.push(v.wins + ' victoires'); n += v.wins; }
    if(v.games !== undefined && v.wins === undefined) parts.push(v.games + ' parties');
    if(v.done && typeof v.done === 'object'){ const k = Object.keys(v.done).length; parts.push(k + ' terminé' + (k > 1 ? 's' : '')); n += k; }
    if(v.skin && v.skin.name) parts.push('serpent créé');
  }
  return { n, t:parts.join(' · ') || 'commencé' };
}

function bindManage(){
  const sec = $('#manage'); if(!sec) return;
  const redraw = () => { sec.outerHTML = manageHTML(lastS); bindManage(); };
  sec.querySelectorAll('#mWhoSeg button').forEach(b => b.onclick = () => { mWho = b.dataset.n; mCourse = null; redraw(); });
  sec.querySelectorAll('#mCourseSeg button').forEach(b => b.onclick = () => { mCourse = b.dataset.c; redraw(); });
  const run = async (fields, question) => {
    if(!confirm(question)) return;
    const msg = $('#mMsg'); msg.textContent = 'En cours…';
    try{ await post(Object.assign({ action:'reset', pass, player:mWho, course:mCourse }, fields)); lastS = await post({ action:'summary', pass }); show(lastS); $('#mMsg').textContent = '✔ C\'est fait. La tablette de ' + mWho + ' se mettra à jour à sa prochaine visite du cours.'; }
    catch(e){ msg.textContent = e.message; }

  sec.querySelectorAll('[data-back]').forEach(b => b.onclick = () => run({ history:b.dataset.back }, 'Remettre « ' + (CNAME[mCourse] || mCourse) + ' » de ' + mWho + ' dans l\'état du ' + b.dataset.when + ' ?\n\nTout ce qui a été fait après sera oublié.'));

const mem = { get(k, d){ try{ return sessionStorage.getItem(k) || d; }catch(e){ return d; } }, set(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} } };
let tab = mem.get('prog-tab', 'vue'), kid = mem.get('prog-kid', 'Salma'), aKid = 'Tous', vdays = +mem.get('prog-days', 7) || 7;

// les progrès enregistrés, un par un : qui, quel cours, quand, combien de gagné depuis l'état d'avant
function gains(S){
  const by = {}, out = [];
  S.history.forEach(x => { if(x.course !== 'profil') (by[x.player.toLowerCase() + '|' + x.course] = by[x.player.toLowerCase() + '|' + x.course] || []).push(x); });
  Object.values(by).forEach(h => h.forEach((x, i) => { const n = brief(x.course, x.data).n, g = i ? n - brief(x.course, h[i - 1].data).n : 0; out.push({ player:x.player, course:x.course, ts:Date.parse(x.created) / 1000, gain:g, first:i === 0, t:brief(x.course, x.data).t }); }));
  return out.sort((a, b) => b.ts - a.ts);
}
function vLabel2(r){ return r.game === 'ludo3d' ? '🎲 Ludo · victoires' : r.game === 'grimpeglace' ? '❄️ Grimpe-Glace · ' + (r.variant === 'etages' ? 'étages' : 'score') : r.game === 'jasmin' ? '🌼 Jasmin · ' + r.variant.replace('monde', 'monde ') : r.game === 'serpent3d' ? '🐉 Légendes · ' + r.variant : '🐍 ' + vLabel(r.variant); }
const tile = (n, label, sub, col) => '<div class="tile"' + (col ? ' style="--t:' + col + '"' : '') + '><b>' + n + '</b><span>' + label + '</span>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>';

/* --- 📊 Vue d'ensemble --- */
function chartHTML(V){
  const hourly = vdays === 1, N = hourly ? 24 : Math.min(vdays, 30), now = Date.now() / 1000, slots = [];
  for(let i = N - 1; i >= 0; i--){ const t = now - i * (hourly ? 3600 : 86400); slots.push({ k:hourly ? dayKey(t) + ' ' + new Date(t * 1000).toLocaleTimeString('fr-FR', { timeZone:'Europe/Paris', hour:'2-digit' }) : dayKey(t), t, n:{ Essil:0, Salma:0, Amine:0 } }); }
  const idx = Object.fromEntries(slots.map((s, i) => [s.k, i]));
  V.forEach(v => { const k = kidOf(v.player); if(!k) return; const key = hourly ? dayKey(v.ts) + ' ' + new Date(v.ts * 1000).toLocaleTimeString('fr-FR', { timeZone:'Europe/Paris', hour:'2-digit' }) : dayKey(v.ts); if(idx[key] !== undefined) slots[idx[key]].n[k]++; });
  const max = Math.max(4, ...slots.map(s => s.n.Essil + s.n.Salma + s.n.Amine)), W = 720, H = 210, L = 30, B = 26, T = 14, bw = (W - L - 6) / N, ph = H - B - T;
  const step = Math.ceil(max / 4), ticks = [0, 1, 2, 3, 4].map(i => i * step).filter(v => v <= max + step - 1);
  const top = ticks[ticks.length - 1] || max, y = v => T + ph - v / top * ph;
  let g = ticks.map(v => '<line x1="' + L + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gl"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" class="ax" text-anchor="end">' + v + '</text>').join('');
  slots.forEach((s, i) => { let acc = 0; const x = L + i * bw + bw * .14, w = bw * .72, tot = s.n.Essil + s.n.Salma + s.n.Amine;
    const lab = hourly ? s.k.slice(-4).trim() : new Date(s.t * 1000).toLocaleDateString('fr-FR', { timeZone:'Europe/Paris', day:'numeric', month:N > 10 ? 'numeric' : 'short' });
    KIDS.forEach(k => { const n = s.n[k]; if(!n) return; const h = n / top * ph; acc += n; g += '<rect x="' + x.toFixed(1) + '" y="' + (y(acc)).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(1, h - 1.5).toFixed(1) + '" rx="3" fill="' + KCOL[k] + '"><title>' + k + ' : ' + n + ' · ' + lab + '</title></rect>'; });
    if(tot && N <= 16) g += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y(tot) - 4).toFixed(1) + '" class="ax tot" text-anchor="middle">' + tot + '</text>';
    if(N <= 10 || i % Math.ceil(N / 8) === 0 || i === N - 1) g += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" class="ax" text-anchor="middle">' + lab + '</text>'; });
  return '<div class="legend">' + KIDS.map(k => '<span><i style="background:' + KCOL[k] + '"></i>' + k + '</span>').join('') + '</div><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Pages ouvertes par les enfants, ' + (hourly ? 'heure par heure' : 'jour par jour') + '">' + g + '</svg>';
}

/* --- 📅 Activités des enfants : combien de fois chaque page, puis jour par jour --- */
function activiteHTML(S){
  if(!VIS) return '<section class="panel"><h2>Activités des enfants</h2>' + waitV() + '</section>';
  const V = period().filter(v => kidOf(v.player)), cols = aKid === 'Tous' ? KIDS : [aKid], by = {};
  V.forEach(v => { const k = kidOf(v.player); if(!cols.includes(k)) return; const r = by[v.page] = by[v.page] || { Essil:0, Salma:0, Amine:0, n:0 }; r[k]++; r.n++; });
  const rows = Object.entries(by).sort((a, b) => b[1].n - a[1].n), max = Math.max(1, ...rows.map(r => r[1].n)), tot = c => rows.reduce((a, r) => a + r[1][c], 0);
  const table = rows.length ? '<div class="table-wrap"><table class="atable"><thead><tr><th>Page</th>' + cols.map(c => '<th class="n">' + c + '</th>').join('') + (cols.length > 1 ? '<th class="n">Total</th>' : '') + '<th></th></tr></thead><tbody>' +
      rows.map(([pg, r]) => '<tr><td>' + esc(pageName(pg)) + '</td>' + cols.map(c => '<td class="n">' + (r[c] || '<span class="zero">·</span>') + '</td>').join('') + (cols.length > 1 ? '<td class="n">' + r.n + '</td>' : '') +
        '<td class="barcell"><span class="stack" style="width:' + Math.max(3, r.n / max * 100) + '%">' + cols.map(c => r[c] ? '<i style="flex:' + r[c] + ';background:' + KCOL[c] + '"></i>' : '').join('') + '</span></td></tr>').join('') +
      '</tbody><tfoot><tr><td>Total</td>' + cols.map(c => '<td class="n">' + tot(c) + '</td>').join('') + (cols.length > 1 ? '<td class="n">' + rows.reduce((a, r) => a + r[1].n, 0) + '</td>' : '') + '<td></td></tr></tfoot></table></div>'
    : '<p class="none">Aucune page ouverte ' + periodLabel() + '.</p>';
  // jour par jour
  const G = gains(S).filter(g => g.ts >= since() && g.gain > 0 && cols.includes(kidOf(g.player))), days = {};
  V.forEach(v => { const k = kidOf(v.player); if(!cols.includes(k)) return; const d = days[dayKey(v.ts)] = days[dayKey(v.ts)] || {}; const kk = d[k] = d[k] || { pages:{}, gains:[] }; const pg = kk.pages[v.page] = kk.pages[v.page] || { n:0, a:v.ts, b:v.ts }; pg.n++; pg.a = Math.min(pg.a, v.ts); pg.b = Math.max(pg.b, v.ts); });
  G.forEach(g => { const k = kidOf(g.player), d = days[dayKey(g.ts)] = days[dayKey(g.ts)] || {}; (d[k] = d[k] || { pages:{}, gains:[] }).gains.push(g); });
  const list = Object.keys(days).sort().reverse().slice(0, 62).map(dk => '<div class="day"><h3>' + dayLabel(dk) + '</h3>' + cols.filter(k => days[dk][k]).map(k => { const x = days[dk][k], n = Object.values(x.pages).reduce((a, p) => a + p.n, 0), gc = {}; x.gains.forEach(g => gc[g.course] = (gc[g.course] || 0) + g.gain);
      return '<div class="drow" style="--t:' + KCOL[k] + '"><b>' + k + '</b><div class="chips">' + Object.entries(x.pages).sort((a, b) => a[1].a - b[1].a).map(([pg, o]) => '<span class="chip">' + esc(pageName(pg)) + (o.n > 1 ? ' <b>× ' + o.n + '</b>' : '') + ' <small>' + hm(o.a) + (o.b - o.a > 300 ? ' → ' + hm(o.b) : '') + '</small></span>').join('') +
        Object.entries(gc).map(([c, g]) => '<span class="chip win">' + (CNAME[c] || c) + ' <b>+' + g + '</b></span>').join('') + '</div><span class="dn">' + (n ? plural(n, 'page', 'pages') : '') + '</span></div>'; }).join('') + '</div>').join('');
  return '<section class="panel"><div class="vhead"><h2>Activités des enfants</h2><span class="seg" id="aKid">' + ['Tous'].concat(KIDS).map(k => '<button data-k="' + k + '" aria-pressed="' + (k === aKid) + '">' + k + '</button>').join('') + '</span></div>' +
    '<p class="when">Nombre de fois où chaque page a été ouverte ' + periodLabel() + ', avec le prénom choisi sur la tablette.</p>' + table + '</section>' +
    '<section class="panel"><h2>Jour par jour</h2>' + (list || '<p class="none">Rien ' + periodLabel() + '.</p>') + '<p class="when">Une page est comptée au plus une fois toutes les 10 minutes. Les pastilles vertes sont les progrès enregistrés ce jour-là (étoiles, XP, dessins finis…).</p></section>';

  const others = S.players.map(p => p.name).filter(n => !['essil','salma','amine'].includes(n.toLowerCase()));
  const serp = S.best.filter(x => x.game === 'serpentin'), variants = [...new Set(serp.map(x => x.variant))].sort();
  const top = n => Math.max(...serp.filter(x => x.player === n).map(x => +x.best)), names = [...new Set(serp.map(x => x.player))].sort((a, b) => top(b) - top(a));
  return '<section class="panel"><h2>🏆 Serpentin : les records de tout le monde</h2>' + (variants.length
      ? '<div class="table-wrap"><table><thead><tr><th>Joueur</th>' + variants.map(v => '<th>' + vLabel(v) + '</th>').join('') + '</tr></thead><tbody>' +
        names.map(n => '<tr><td>' + esc(n) + '</td>' + variants.map(v => { const r = serp.find(x => x.player === n && x.variant === v); return '<td class="n">' + (r ? r.best : '—') + '</td>'; }).join('') + '</tr>').join('') + '</tbody></table></div>'
      : '<p class="none">Aucune partie enregistrée pour l\'instant.</p>') +
      (others.length ? '<p class="when">Autres joueurs : ' + others.map(esc).join(', ') + '</p>' : '') + '</section>' +
    '<section class="panel"><h2>🕒 Dernières parties</h2>' + (S.recent.length
      ? '<div class="table-wrap"><table><thead><tr><th>Quand</th><th>Joueur</th><th>Jeu</th><th>Score</th></tr></thead><tbody>' +
        S.recent.map(r => '<tr><td>' + fmtDate(r.created) + '</td><td>' + esc(r.player) + '</td><td>' + vLabel2(r) + '</td><td class="n">' + r.score + '</td></tr>').join('') + '</tbody></table></div>'
      : '<p class="none">Rien pour l\'instant.</p>') + '</section>';
}

/* --- 🌍 Journal des visites : adresse IP, lieu, appareil, page --- */
function journalHTML(){
  if(!VIS) return '<section class="panel"><h2>🌍 Journal des visites</h2>' + waitV() + '</section>';
  const isFam = v => FAM.includes(String(v.player || '').toLowerCase()), famIP = new Set(VIS.filter(isFam).map(v => v.ip));
  const q = jQuery.trim().toLowerCase(), place = v => '<span class="flag">' + flag(v.cc) + '</span>' + esc(v.country || '?') + (v.city ? ' · ' + esc(v.city) : '');
  const text = v => [pageName(v.page), v.player, v.ip, v.country, v.city, v.isp, device(v.ua || '', v.screen), v.ref].join(' ').toLowerCase();
  const V = period().filter(v => (jFilter === 'tous' || (jFilter === 'famille') === famIP.has(v.ip)) && (!q || text(v).includes(q)));
  const head = '<div class="vhead"><h2>🌍 Journal des visites</h2><span class="seg" id="jSeg">' + [['tous', 'Tout le monde'], ['famille', 'La famille'], ['autres', 'Les autres']].map(f => '<button data-f="' + f[0] + '" aria-pressed="' + (f[0] === jFilter) + '">' + f[1] + '</button>').join('') + '</span></div>' +
    '<input class="search" id="jQ" type="search" placeholder="Chercher : une page, un prénom, une adresse IP, une ville…" value="' + esc(jQuery) + '" aria-label="Chercher dans le journal">';
  if(!V.length) return '<section class="panel" id="visits">' + head + '<p class="none">Aucune visite ne correspond ' + periodLabel() + '.</p></section>';
  const ips = new Set(V.map(v => v.ip)), byC = {}; V.forEach(v => { const k = (v.cc || '') + '|' + (v.country || 'Inconnu'); byC[k] = (byC[k] || 0) + 1; });
  const who = {}; V.forEach(v => { const w = who[v.ip] || (who[v.ip] = { ip:v.ip, cc:v.cc, country:v.country, city:v.city, isp:v.isp, n:0, last:v.ts, first:v.ts, players:new Set(), dev:device(v.ua || '', v.screen) }); w.n++; w.first = Math.min(w.first, v.ts); w.last = Math.max(w.last, v.ts); if(v.player) w.players.add(v.player); });
  const W = Object.values(who).sort((a, b) => b.last - a.last);
  const fmt = t => new Date(t * 1000).toLocaleString('fr-FR', { timeZone:'Europe/Paris', weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  return '<section class="panel" id="visits">' + head +
    '<div class="tiles small">' + tile(V.length, 'pages ouvertes') + tile(ips.size, 'adresses IP') + tile(V.filter(v => v.app).length, 'depuis l\'appli installée') + tile(Object.keys(byC).length, 'pays') + '</div>' +
    '<div class="chips">' + Object.entries(byC).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([k, n]) => { const [cc, c] = k.split('|'); return '<span class="chip">' + flag(cc) + ' ' + esc(c) + ' · <b>' + n + '</b></span>'; }).join('') + '</div>' +
    '<h3 class="sub">Les visiteurs (un par adresse IP)</h3><div class="table-wrap"><table class="vtable"><thead><tr><th>Dernière visite</th><th>Lieu</th><th>Adresse IP</th><th>Fournisseur</th><th>Appareil</th><th>Prénoms</th><th class="n">Pages</th></tr></thead><tbody>' +
      W.slice(0, 80).map(w => '<tr class="' + (famIP.has(w.ip) ? 'fam' : '') + '"><td>' + fmt(w.last) + '</td><td>' + place(w) + '</td><td class="ip">' + esc(w.ip) + '</td><td>' + esc(w.isp || '') + '</td><td>' + esc(w.dev) + '</td><td>' + esc([...w.players].join(', ') || '—') + '</td><td class="n">' + w.n + '</td></tr>').join('') + '</tbody></table></div>' +
    '<h3 class="sub">Toutes les pages ouvertes' + (V.length > 400 ? ' (les 400 dernières)' : '') + '</h3><div class="table-wrap"><table class="vtable"><thead><tr><th>Heure (Paris)</th><th>Page</th><th>Prénom</th><th>Lieu</th><th>Adresse IP</th><th>Appareil</th><th>Venu de</th></tr></thead><tbody>' +
      V.slice(0, 400).map(v => '<tr class="' + (famIP.has(v.ip) ? 'fam' : '') + '"><td>' + fmt(v.ts) + '</td><td>' + esc(pageName(v.page)) + (v.app ? ' 📱' : '') + '</td><td>' + esc(v.player || '—') + '</td><td>' + place(v) + '</td><td class="ip">' + esc(v.ip) + '</td><td>' + esc(device(v.ua || '', v.screen)) + (v.screen ? ' <small style="color:var(--soft)">' + esc(v.screen) + '</small>' : '') + '</td><td>' + esc(v.ref || '') + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="when">Chaque ouverture de page est notée (au plus une fois toutes les 10 minutes par page et par onglet). 📱 = depuis l\'appli installée. Le pays et la ville viennent de l\'adresse IP (service ip-api.com) : c\'est approximatif, souvent la ville du fournisseur d\'accès. Le journal est effacé après ' + VKEEP + ' jours. Trait vert = une adresse d\'où un prénom de la famille a joué.</p></section>';
}

async function fetchVisits(){
  const need = vdays > 30 ? 60 : 30; if(vBusy || (VIS && vLoaded >= need)) return; vBusy = true;
  try{ const R = await post({ action:'visits', pass, days:need }); VIS = R.visits || []; VKEEP = R.keep || 60; vLoaded = need; VERR = ''; }catch(e){ VERR = e.message; }
  vBusy = false; draw();
}
function draw(){
  const S = lastS, pane = $('#pane'); if(!S || !pane) return;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  document.querySelectorAll('#pdays button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.d === vdays));
  $('#pdays').style.visibility = tab === 'enfants' || tab === 'suivi' || tab === 'records' ? 'hidden' : '';
  const keep = tab === 'journal' && document.activeElement && document.activeElement.id === 'jQ' ? document.activeElement.selectionStart : null;
  pane.innerHTML = tab === 'vue' ? vueHTML(S) : tab === 'activite' ? activiteHTML(S) : tab === 'enfants' ? enfantsHTML(S) : tab === 'suivi' ? manageHTML(S) : tab === 'records' ? recordsHTML(S) : journalHTML();
  if(tab === 'suivi') bindManage();
  pane.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => { kid = b.dataset.kid; mem.set('prog-kid', kid); setTab('enfants'); });
  pane.querySelectorAll('#kidSeg button').forEach(b => b.onclick = () => { kid = b.dataset.k; mem.set('prog-kid', kid); draw(); });
  pane.querySelectorAll('#aKid button').forEach(b => b.onclick = () => { aKid = b.dataset.k; draw(); });
  pane.querySelectorAll('#jSeg button').forEach(b => b.onclick = () => { jFilter = b.dataset.f; draw(); });
  const q = $('#jQ'); if(q){ q.oninput = () => { jQuery = q.value; draw(); }; if(keep !== null){ q.focus(); try{ q.setSelectionRange(keep, keep); }catch(e){} } }
}
function setTab(t){ tab = t; mem.set('prog-tab', t); draw(); scrollTo({ top:0 }); }
function show(S){
  $('#login').hidden = true; const b = $('#board'); b.hidden = false; lastS = S;
  if(!TABS.some(t => t[0] === tab)) tab = 'vue';
  b.innerHTML = '<nav class="tabs" id="tabs" role="tablist" aria-label="Rubriques">' + TABS.map(t => '<button role="tab" data-t="' + t[0] + '"><span aria-hidden="true">' + t[1] + '</span>' + t[2] + '</button>').join('') + '</nav>' +
    '<div class="bar"><span class="seg" id="pdays"><button data-d="1">24 h</button><button data-d="7">7 jours</button><button data-d="30">30 jours</button><button data-d="60">60 jours</button></span><span class="grow"></span><span>Mis à jour ' + fmtDate(new Date().toISOString()) + '</span><button class="tool" id="reload">↻ Actualiser</button><button class="tool" id="logout">Se déconnecter</button></div><div id="pane" class="pane"></div>';
  document.querySelectorAll('#tabs button').forEach(x => x.onclick = () => setTab(x.dataset.t));
  document.querySelectorAll('#pdays button').forEach(x => x.onclick = () => { vdays = +x.dataset.d; mem.set('prog-days', vdays); draw(); fetchVisits(); });
  $('#reload').onclick = async () => { try{ const S2 = await post({action:'summary', pass}); VIS = null; vLoaded = 0; show(S2); }catch(e){ loginForm(e.message); } };
  $('#logout').onclick = () => { pass = null; VIS = null; vLoaded = 0; try{ sessionStorage.removeItem('famille-pass'); }catch(e){} loginForm(''); };
  draw(); fetchVisits();
}
/* ---------- Journal des visites (site.js, toutes les pages) ---------- */
const PAGES = { '/':'Accueil', '/index.html':'Accueil', '/indexancien.html':'Ancienne accueil', '/progression.html':'Progression (parents)', '/essil/':'Espace Essil', '/salma/':'Espace Salma', '/amine/':'Espace Amine',
  '/essil/deutsch-express.html':'Deutsch Express', '/essil/via-romana.html':'Via Romana', '/salma/english-garden.html':'English Garden', '/salma/weather-station.html':'Weather Station', '/salma/atelier-des-verbes.html':'Atelier des Verbes', '/salma/atelier-des-formes.html':'Atelier des Formes', '/salma/miroir-magique.html':'Miroir Magique', '/salma/marche-d-ollie.html':"Marché d'Ollie",
  '/salma/jardin-des-nombres.html':'Jardin des Nombres', '/salma/le-grand-galop.html':'Le Grand Galop', '/amine/ardoise-magique.html':'Ardoise magique', '/amine/planete-des-nombres.html':'Planète des Nombres', '/amine/la-nuit-d-amine.html':"La Nuit d'Amine", '/amine/la-nuit-d-amine-2.html':"La Nuit d'Amine 2",
  '/amine/nahki-tounsi.html':'Nahki Tounsi', '/amine/serpentin.html':'Serpentin', '/jeux/serpent-legendes.html':'Serpent Légendes', '/jeux/ma-houma.html':'Ma Houma', '/jeux/ludo-legendes.html':'Ludo Légendes', '/jeux/grimpe-glace.html':'Grimpe-Glace', '/jeux/legende-du-jasmin.html':'La Légende du Jasmin (ancienne version)', '/jeux/legende-du-jasmin-3.html':'La Légende du Jasmin 3', '/jeux/legende-du-jasmin-2.html':'La Légende du Jasmin', '/jeux/atelier-du-jasmin.html':"L'Atelier du Jasmin", '/essil/videos-geometrie.html':'Pas à pas · Géométrie', '/essil/videos-fractions.html':'Pas à pas · Les fractions', '/essil/les-ecuries.html':"Les Écuries d'Essil", '/jeux/les-ecuries.html':'Les Écuries', '/essil/les-ecuries.html':'Les Écuries d\'Essil', '/jeux/medina-express.html':'Médina Express' };
const pageName = p => PAGES[p] || PAGES[p.replace(/index\.html$/, '')] || p;
const flag = cc => cc && /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 127397 + c.charCodeAt(0))) : '🏳️';
function device(ua, screen){
  const [sw, sh] = (screen || '0x0').split('x').map(Number);   // un iPad se présente comme un Mac, mais son écran est en hauteur
  const d = /iPad/.test(ua) || (/Macintosh/.test(ua) && sw && sw < sh) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? (/Mobile/.test(ua) ? 'Android (téléphone)' : 'Android (tablette)') : /Windows/.test(ua) ? 'PC Windows' : /Macintosh/.test(ua) ? 'Mac' : /CrOS/.test(ua) ? 'Chromebook' : /Linux/.test(ua) ? 'Linux' : /bot|crawl|spider|preview/i.test(ua) ? 'Robot' : 'Autre';
  const b = /Edg\//.test(ua) ? 'Edge' : /SamsungBrowser/.test(ua) ? 'Samsung' : /Firefox|FxiOS/.test(ua) ? 'Firefox' : /CriOS|Chrome/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : '';
  return d + (b ? ' · ' + b : '');
}
start();
