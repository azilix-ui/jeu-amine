<script>window.LECON = {"n": 3, "key": "salma-en3", "titre": "One, two, three!", "sous": "Les nombres de 1 à 10 en anglais", "histoire": "Count with Ollie", "bonjour": "Hello, Salma ! Aujourd'hui, on compte <b>de 1 à 10 en anglais</b>. Écoute Ollie, compte avec lui, et répète les nombres à voix haute !", "scenes": [{"img": "ollie/img/h-e31.webp", "vid": "ollie/img/h-e31.mp4", "txt": "Au parc, dix petits canards nagent sur l'étang. Ollie les compte en anglais : « <i lang=\"en\">One, two, three, four, five, six, seven, eight, nine, ten!</i> » Compte avec lui !"}, {"img": "ollie/img/h-e32.webp", "vid": "ollie/img/h-e32.mp4", "txt": "C'est un anniversaire ! Combien de bougies ? « <i lang=\"en\">Eight candles!</i> » <b>Eight</b>, c'est <b>huit</b>. « <i lang=\"en\">I am eight!</i> » dit Salma : <b>j'ai huit ans</b> !"}, {"img": "ollie/img/h-e33.webp", "vid": "ollie/img/h-e33.mp4", "txt": "Dans la cour, Salma joue à la marelle et saute en comptant : « <i lang=\"en\">one, two, three…</i> » jusqu'à <b>ten</b>, <b>dix</b>. À toi de compter en anglais !"}], "mots": [["one", "1️⃣", "un"], ["two", "2️⃣", "deux", ["too", "to"]], ["three", "3️⃣", "trois", ["tree"]], ["four", "4️⃣", "quatre", ["for"]], ["five", "5️⃣", "cinq"], ["six", "6️⃣", "six"], ["seven", "7️⃣", "sept"], ["eight", "8️⃣", "huit", ["ate"]], ["nine", "9️⃣", "neuf"], ["ten", "🔟", "dix"]], "phrases": [[["I", "am", "eight"], "J'ai huit ans", ".", ["i'm eight", "i am 8", "i'm 8"]], [["I", "have", "two", "cats"], "J'ai deux chats", ".", ["i have 2 cats"]], [["Count", "with", "me"], "Compte avec moi", "!"], [["Ten", "little", "ducks"], "Dix petits canards", ".", ["10 little ducks"]]]};</script>
