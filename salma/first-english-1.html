<script>window.LECON = {"n": 1, "key": "salma-en1", "titre": "Hello, Ollie!", "sous": "Mon premier cours d'anglais : dire bonjour, se présenter, dire au revoir", "histoire": "Hello, Salma!", "bonjour": "Hello, Salma ! Aujourd'hui, ton tout premier cours d'anglais : dire <b>bonjour</b>, te <b>présenter</b> et dire <b>au revoir</b>. Écoute bien Ollie, et répète à voix haute : la tablette t'écoute !", "scenes": [{"img": "ollie/img/h-e11.webp", "vid": "ollie/img/h-e11.mp4", "txt": "Toc toc ! Salma ouvre la porte bleue… c'est Ollie ! Il lève son aile et dit : « <i lang=\"en\">Hello!</i> ». En anglais, <b>hello</b> veut dire <b>bonjour</b>. Salma répond en souriant : « <i lang=\"en\">Hello, Ollie!</i> »"}, {"img": "ollie/img/h-e12.webp", "vid": "ollie/img/h-e12.mp4", "txt": "À l'école, Ollie se présente : « <i lang=\"en\">My name is Ollie.</i> » Ça veut dire : <b>je m'appelle Ollie</b>. Salma lui serre l'aile : « <i lang=\"en\">My name is Salma. Nice to meet you!</i> » : <b>enchantée</b> !"}, {"img": "ollie/img/h-e13.webp", "vid": "ollie/img/h-e13.mp4", "txt": "Le soir, sur la terrasse, le soleil se couche sur la mer. « <i lang=\"en\">Goodbye, Salma! Good night!</i> » dit Ollie. <b>Goodbye</b>, c'est <b>au revoir</b>, et <b>good night</b>, <b>bonne nuit</b>. À toi : écoute, et répète comme Ollie !"}], "mots": [["hello", "👋", "bonjour"], ["goodbye", "🚪", "au revoir", ["good bye", "bye"]], ["good morning", "☀️", "bonjour (le matin)"], ["good night", "🌙", "bonne nuit"], ["please", "🙏", "s'il te plaît"], ["thank you", "💐", "merci", ["thanks"]], ["yes", "✅", "oui"], ["no", "❌", "non"]], "phrases": [[["My", "name", "is", "Salma"], "Je m'appelle Salma", ".", ["my name's salma"]], [["How", "are", "you"], "Comment vas-tu ?", "?"], [["I", "am", "fine"], "Je vais bien", ".", ["i'm fine"]], [["Nice", "to", "meet", "you"], "Enchantée", "!"]]};</script>
