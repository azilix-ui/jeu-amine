<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missaoui">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/site.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10231f">
<title>Sourate Al-Fâtiḥa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Aref+Ruqaa:wght@700&family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Éveil religieux · rubrique « Sourate » (18/11, demande du papa) : apprendre Al-Fâtiḥa verset par verset, à la façon de
   chaque enfant. Cheikh Al-Husary récite (vrai enregistrement), l'enfant répète, la tablette écoute (reconnaissance vocale
   de l'appareil, en arabe) et encourage, jamais d'échec. Essil : tajwid en couleurs ; Salma : arabe + lettres françaises ;
   Amine : un petit dessin animé par verset, tout à l'oreille. La voix artificielle ne dit jamais un verset : seulement le sens
   et les encouragements. Aucune personne dans les images. Code : sourate/jeu.js, sourate/ecoute.js ; textes : sourate/fatiha.js */
:root{ --nuit:#10231f; --nuit2:#173a33; --or:#f2c45a; --creme:#fff8e8; --doux:#d7e6dc; --encre:#2a2016; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html, body{ margin:0; min-height:100%; background:var(--nuit); color:var(--creme); font-family:Nunito, system-ui, sans-serif; }
body{ background:repeating-linear-gradient(45deg, #f2c45a0d 0 2px, transparent 2px 22px), repeating-linear-gradient(-45deg, #f2c45a0d 0 2px, transparent 2px 22px), radial-gradient(ellipse at top, #1f4a40 0%, var(--nuit) 60%) fixed; background-color:var(--nuit); }
button{ font:inherit; color:inherit; border:0; cursor:pointer; }
h1, h2, h3{ font-family:'Baloo 2', sans-serif; margin:0; }
.ecran{ display:none; min-height:100vh; }
.ecran.on{ display:block; }
.boite{ max-width:1000px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px 40px; }
.haut{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.esp{ flex:1; }
.pill{ background:#ffffff14; border:2px solid #ffffff26; border-radius:999px; padding:8px 16px; font-weight:800; min-height:48px; display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--creme); }
.pill img{ width:32px; height:32px; border-radius:50%; object-fit:cover; }
.pill.on{ background:var(--or); color:#2a1f05; border-color:var(--or); }
/* le titre : cadre doré ComfyUI, écriture en vraie police */
.cartouche{ position:relative; width:min(720px, 100%); aspect-ratio:3.1/1; margin:14px auto 6px; background:url(sourate/img/cartouche.webp) center/contain no-repeat; display:grid; place-items:center; }
.cartouche b{ font-family:'Aref Ruqaa', Amiri, serif; font-size:clamp(30px, 7vw, 58px); color:#7a5410; text-shadow:0 1px 0 #fff6, 0 0 1px #b8862b; line-height:1; padding-bottom:4px; }
.sous{ text-align:center; color:var(--doux); font-size:18px; margin:4px 0 16px; }
.savoir{ max-width:760px; margin:0 auto 18px; text-align:center; color:#f5ead0; font-size:16px; }
.modes{ display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:14px; }
.mode{ text-align:left; border-radius:22px; overflow:hidden; background:#ffffff10; border:2px solid #ffffff22; padding:0; }
.mode.moi{ border-color:var(--or); box-shadow:0 0 0 3px #f2c45a44; }
.mode .img{ aspect-ratio:16/8; background:#173a33 center/cover; position:relative; }
.mode .img span{ position:absolute; left:10px; top:10px; background:#10231fcc; border-radius:999px; padding:4px 12px; font-weight:800; font-size:14px; }
.mode .t{ padding:10px 16px 14px; }
.mode h2{ font-size:22px; }
.mode p{ margin:4px 0 0; color:var(--doux); }
.prog{ display:flex; justify-content:center; gap:6px; margin:18px 0 4px; flex-wrap:wrap; font-size:22px; }
.prog i{ font-style:normal; opacity:.35; }
/* la leçon */
.lecon{ display:grid; gap:14px; margin-top:10px; }
@media (min-width:900px) and (orientation:landscape){ .lecon.amine{ grid-template-columns:1.25fr 1fr; align-items:start; } }
.points{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; direction:rtl; }
.points button{ min-width:48px; height:48px; border-radius:50%; background:#ffffff14; border:2px solid #ffffff2a; font-family:Amiri, serif; font-size:22px; font-weight:700; }
.points button.ok{ background:#1f7a5c; border-color:#57c49b; }
.points button.cur{ background:var(--or); color:#2a1f05; border-color:var(--or); }
.points .tout{ border-radius:999px; padding:0 16px; font-family:Nunito, system-ui, sans-serif; font-size:16px; direction:ltr; }
.scene{ position:relative; border-radius:24px; overflow:hidden; aspect-ratio:16/9; background:#173a33 center/cover; box-shadow:0 12px 36px #0008; }
.scene video{ width:100%; height:100%; object-fit:cover; display:block; }
.page{ background:#f8eed8 url(sourate/img/parchemin.webp); color:var(--encre); border-radius:22px; padding:18px 18px 14px; box-shadow:0 12px 36px #0008, inset 0 0 0 3px #c9a24e, inset 0 0 0 7px #f8eed8, inset 0 0 0 9px #1d4f7a55; }
.coran{ font-family:'Amiri Quran', Amiri, serif; direction:rtl; text-align:center; font-size:clamp(28px, 4.6vw, 44px); line-height:2.15; }
.v{ transition:opacity .3s; }
.essil .v:not(.cur){ opacity:.45; }
.w{ border-radius:10px; padding:0 2px; transition:background .15s; }
.w.lit{ background:#f2c45a; box-shadow:0 0 0 3px #f2c45a; }
.w.dit{ text-decoration:underline 4px #1f9d6b; text-underline-offset:10px; }
.fin-v{ font-family:'Amiri Quran', Amiri, serif; color:#1d4f7a; margin:0 .2em; }
.tj-h, .tj-l{ color:#9a948a; } .tj-n{ color:#2f80ed; } .tj-p{ color:#1b45c4; } .tj-m{ color:#0b1f6b; }
.legende{ display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; font-size:14px; margin-top:6px; color:#4a3d2c; }
.legende b{ display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:4px; }
/* Salma : un mot arabe au-dessus de son mot en lettres françaises */
.duo{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px 10px; direction:rtl; }
.duo .w{ display:flex; flex-direction:column; align-items:center; padding:2px 6px; }
.duo .w .a{ font-family:'Amiri Quran', Amiri, serif; font-size:clamp(30px, 5vw, 46px); line-height:1.9; }
.duo .w .l{ direction:ltr; font-size:clamp(17px, 2.4vw, 22px); font-weight:800; color:#7a4b12; margin-top:-6px; }
.sens{ font-size:18px; margin:10px 0 0; text-align:center; }
.motbox{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:10px; background:#fff7e3; border:2px dashed #c9a24e; border-radius:16px; padding:8px 14px; }
.motbox .a{ font-family:Amiri, serif; font-size:30px; font-weight:700; color:#1d4f7a; }
.expl{ font-size:18px; line-height:1.45; margin:10px 0 0; }
.racine{ margin-top:8px; font-size:16px; color:#5a4630; }
.racine .a{ font-family:Amiri, serif; font-size:24px; font-weight:700; color:#1d4f7a; }
.essil .coran{ font-size:clamp(26px, 3.8vw, 40px); }
.amine .coran{ font-size:clamp(30px, 6vw, 52px); }
.amine .phrase{ font-size:20px; text-align:center; margin:6px 0 0; }
/* le conteur et le micro */
.bulle{ display:flex; gap:12px; align-items:center; background:#ffffff12; border:2px solid #ffffff22; border-radius:20px; padding:10px 14px; min-height:72px; }
.bulle img{ width:56px; height:56px; border-radius:50%; object-fit:cover; background:#173a33; flex:none; }
.bulle p{ margin:0; font-size:18px; }
.bulle .ar{ font-family:Amiri, serif; font-size:22px; direction:rtl; }
.barre{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center; }
.gros{ min-height:56px; border-radius:999px; padding:10px 20px; font-weight:800; font-size:18px; background:#ffffff18; border:2px solid #ffffff30; }
.gros.or{ background:var(--or); color:#2a1f05; border-color:var(--or); }
.micro{ width:84px; height:84px; border-radius:50%; font-size:40px; background:#1f7a5c; border:3px solid #7fe0b8; display:grid; place-items:center; }
.micro.ecoute{ background:#c0392b; border-color:#ffb3a6; animation:pouls 1s ease-in-out infinite; }
@keyframes pouls{ 50%{ transform:scale(1.12); box-shadow:0 0 0 14px #c0392b33; } }
.micro.attend{ animation:pouls 1.2s ease-in-out infinite; background:#e67e22; border-color:#ffd8a8; }
.etoile{ position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; font-size:120px; animation:pop 1.1s ease-out forwards; z-index:9; }
@keyframes pop{ 0%{ transform:scale(.2); opacity:0; } 30%{ transform:scale(1.2); opacity:1; } 100%{ transform:scale(1) translateY(-60px); opacity:0; } }
.note{ text-align:center; color:var(--doux); font-size:14px; margin-top:6px; }
@media (prefers-reduced-motion:reduce){ .micro.ecoute, .micro.attend, .etoile{ animation:none; } }
</style>
</head>
<body data-sourate="fatiha">
<section class="ecran on" id="e-accueil"><div class="boite">
  <div class="haut"><a class="pill" href="index.html">← Éveil religieux</a><span class="esp"></span><button class="pill" id="qui">👤 Qui récite ?</button></div>
  <div class="cartouche"><b lang="ar" dir="rtl">سُورَةُ الْفَاتِحَةِ</b></div>
  <p class="sous">Apprends Al-Fâtiḥa verset par verset : écoute cheikh Al-Husary, puis répète.</p>
  <p class="savoir" id="savoir"></p>
  <div class="modes" id="modes"></div>
  <div class="prog" id="prog"></div>
  <p class="note">La tablette écoute ta voix pour t'encourager (reconnaissance vocale de l'appareil, par Google ou Apple). Rien n'est enregistré par le site.</p>
</div></section>

<section class="ecran" id="e-lecon"><div class="boite">
  <div class="haut">
    <button class="pill" id="retour">←</button>
    <button class="pill" data-mode="essil">🎨 Tajwid</button><button class="pill" data-mode="salma">🔤 Lettres</button><button class="pill" data-mode="amine">🎬 J'écoute</button>
    <span class="esp"></span>
    <button class="pill" id="com" title="Les encouragements en français ou en arabe">FR</button>
  </div>
  <div class="lecon" id="lecon">
    <div class="scene" id="scene" hidden><video id="vid" muted loop playsinline preload="auto"></video></div>
    <div class="page" id="page"></div>
  </div>
  <div style="height:12px"></div>
  <div class="points" id="points"></div>
  <div style="height:12px"></div>
  <div class="bulle"><img id="conteur" alt=""><div><p id="dit">Touche « Commencer ».</p><p class="ar" id="ditar" lang="ar" hidden></p></div></div>
  <div style="height:12px"></div>
  <div class="barre">
    <button class="gros or" id="go">▶ Commencer</button>
    <button class="gros" id="reecoute">🔁 Réécouter</button>
    <button class="micro" id="micro" title="Je récite">🎤</button>
    <button class="gros" id="suivant">Verset suivant ⏭</button>
  </div>
  <div style="height:10px"></div>
  <div class="barre"><button class="gros" id="tout">📖 Écouter toute la sourate</button><button class="gros" id="seul">🌟 Je récite seul</button></div>
  <p class="note" id="note"></p>
</div></section>

<script src="../famille.js"></script>
<script type="module" src="sourate/jeu.js?v=1"></script>
</body>
</html>
